name: CI

on:
  push:
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE

      - name: Basic HTML sanity check
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const checks = [
            [/id=["']root["']/, "Missing React mount (#root)"],
            [/class=["'][^"']*stage-svg/, "Missing main SVG (.stage-svg)"],
            [/createRoot\s*\(/, "Missing React DOM bootstrap (createRoot)"],
            [/Simulace rovnovážné páky/, "Missing expected page title text"],
          ];
          for (const [re, msg] of checks) {
            if (!re.test(html)) throw new Error(msg);
          }
          console.log("OK");
          NODE
