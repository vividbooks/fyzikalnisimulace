name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          test -f index.html
          test -f 404.html
          test -f scripts/optika-spa-fallback.js
          test -f vztlakova-sila.html
          test -f michani-barev/index.html
          test -f graf-pohybu/index.html
          test -f skutecny-obraz/index.html
          test -f cocky/index.html
          test -f cocky/script.js
          test -f paka/index.html
          test -f paka/lever-app.js
          test -f skladani_sil/index.html
          test -f skladani_sil/main.js
          test -f silomer_2/index.html
          test -f silomer_2/main.js
          test -f optika_geometrie/index.html
          test -d optika_geometrie/rysovani-app
          test -f README.md
          test -f LICENSE

      - name: Basic HTML sanity check
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const checks = [
            [/id=["']root["']/, "Missing React mount (#root)"],
            [/class=["'][^"']*stage-svg/, "Missing main SVG (.stage-svg)"],
            [/vztlakova-sila\.html/, "Missing vztlaková full-page navigation target"],
            [/"paka\/"/, "Missing páka full-page navigation target"],
            [/Fyzikální simulace/, "Missing expected page title text"],
          ];
          for (const [re, msg] of checks) {
            if (!re.test(html)) throw new Error(msg);
          }
          console.log("OK");
          NODE

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '_site' \
            ./ _site/

      - name: Point GitHub Pages to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
