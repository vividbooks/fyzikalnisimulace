name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE

      - name: Basic HTML sanity check
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const checks = [
            [/id=["']root["']/, "Missing React mount (#root)"],
            [/class=["'][^"']*stage-svg/, "Missing main SVG (.stage-svg)"],
            [/createRoot\s*\(/, "Missing React DOM bootstrap (createRoot)"],
            [/Fyzikální simulace/, "Missing expected page title text"],
          ];
          for (const [re, msg] of checks) {
            if (!re.test(html)) throw new Error(msg);
          }
          console.log("OK");
          NODE

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: static-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
