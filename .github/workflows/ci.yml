name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          test -f index.html
          test -f 404.html
          test -f scripts/optika-spa-fallback.js
          test -f vztlakova-sila.html
          test -f michani-barev/index.html
          test -f graf-pohybu/index.html
          test -f skutecny-obraz/index.html
          test -f cocky/index.html
          test -f cocky/script.js
          test -f paka/index.html
          test -f paka/lever-app.js
          test -f kladkostroj/index.html
          test -f kladkostroj/app.js
          test -f teziste/index.html
          test -f teziste/main.js
          test -f skladani_sil/index.html
          test -f skladani_sil/main.js
          test -f silomer_2/index.html
          test -f silomer_2/main.js
          test -f tlak/index.html
          test -f tlak/main.js
          test -f treni/index.html
          test -f treni/main.js
          test -f hydrostatika/index.html
          test -f hydrostatika/main.js
          test -f mereni_casu/index.html
          test -f mereni_casu/main.js
          test -f obsah/index.html
          test -f obsah/main.js
          test -f objem/index.html
          test -f objem/main.js
          test -f druhy-pohybu/index.html
          test -f druhy-pohybu/main.js
          test -f optika_geometrie/index.html
          test -d optika_geometrie/rysovani-app
          test -f videni/index.html
          test -f videni/main.js
          test -f README.md
          test -f LICENSE

      - name: Basic HTML sanity check
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const checks = [
            [/id=["']root["']/, "Missing React mount (#root)"],
            [/class=["'][^"']*stage-svg/, "Missing main SVG (.stage-svg)"],
            [/vztlakova-sila\.html/, "Missing vztlaková full-page navigation target"],
            [/"paka\/"/, "Missing páka full-page navigation target"],
            [/Fyzikální simulace/, "Missing expected page title text"],
          ];
          for (const [re, msg] of checks) {
            if (!re.test(html)) throw new Error(msg);
          }
          console.log("OK");
          NODE

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '_site' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
