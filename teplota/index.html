<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teplota</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>
<body>
  <div class="app-root" data-app-mode="heating">
    <aside class="left-panel">
      <div class="panel-copy">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="panel-title">Teplota</h1>
        <div class="mode-switch" role="tablist" aria-label="Režim simulace">
          <button
            type="button"
            class="mode-switch__btn is-active"
            data-app-mode="heating"
            role="tab"
            aria-selected="true"
          >
            Ohřev
          </button>
          <button
            type="button"
            class="mode-switch__btn"
            data-app-mode="cooling"
            role="tab"
            aria-selected="false"
          >
            Měření
          </button>
        </div>
      </div>

      <div class="heating-panel">
        <div class="subject-control" role="group" aria-label="Těleso na hořáku">
          <button
            type="button"
            class="subject-btn"
            data-subject="gold"
            aria-pressed="false"
          >
            Zlato
          </button>
          <button
            type="button"
            class="subject-btn is-active"
            data-subject="water"
            aria-pressed="true"
          >
            Voda
          </button>
          <button
            type="button"
            class="subject-btn"
            data-subject="gas"
            aria-pressed="false"
          >
            Plyn
          </button>
        </div>
        <div class="panel-actions">
          <button
            type="button"
            id="burner-toggle"
            class="action-btn action-btn--primary"
            aria-pressed="false"
          >
            <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.14v13.72L19 12 8 5.14z"/>
            </svg>
            <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 5h3v14H7V5zm7 0h3v14h-3V5z"/>
            </svg>
            <span class="action-btn__label">Zapnout hořák</span>
          </button>
        </div>
      </div>

      <div class="cooling-panel">
        <div class="panel-actions">
          <button
            type="button"
            id="cooling-toggle"
            class="action-btn action-btn--primary"
            aria-pressed="false"
          >
            <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.14v13.72L19 12 8 5.14z"/>
            </svg>
            <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 5h3v14H7V5zm7 0h3v14h-3V5z"/>
            </svg>
            <span class="action-btn__label">Nechat ochladit</span>
          </button>
        </div>
        <div class="stopwatch" aria-live="polite">
          <span class="stopwatch-label">Čas</span>
          <time class="stopwatch-time" id="cooling-stopwatch" datetime="PT0S">0 s</time>
        </div>
        <div class="panel-actions cooling-reset-row">
          <button type="button" id="cooling-reset-btn" class="action-btn action-btn--danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 8A7.5 7.5 0 1 1 4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4.5 3.5V8h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Reset
          </button>
          <button
            type="button"
            id="ambient-temp-btn"
            class="action-btn"
          >
            Okolní teplota
          </button>
        </div>
        <div class="panel-actions">
          <button
            type="button"
            id="cooling-graph-btn"
            class="action-btn graph-btn"
            aria-pressed="false"
          >
            <span class="action-btn__label">Zobrazit graf</span>
          </button>
        </div>
        <div class="graph-tools" id="cooling-graph-tools" aria-label="Nástroje grafu">
          <div class="panel-actions graph-actions">
            <button type="button" class="action-btn action-btn--save" id="cooling-chart-save-btn">Uložit</button>
            <button type="button" class="action-btn" id="cooling-chart-undo-btn" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 14H4v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 9a8 8 0 1 1-1.2 4.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Zpět
            </button>
            <button type="button" class="action-btn action-btn--danger" id="cooling-chart-reset-btn">
              Vymazat body
            </button>
          </div>
          <div class="panel-actions graph-fit-row">
            <button
              type="button"
              class="action-btn"
              id="cooling-chart-fit-btn"
              aria-pressed="false"
              disabled
            >
              Proložit
            </button>
            <div
              class="graph-fit-mode-row"
              id="cooling-chart-fit-mode-row"
              aria-label="Typ proložení"
            >
              <button
                type="button"
                id="cooling-chart-fit-mode-polyline-btn"
                class="action-btn graph-fit-mode-btn"
                aria-pressed="false"
                aria-label="Lomená čára"
                title="Lomená čára"
              >
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M6 4v15h15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M8.5 16.5 11.2 10l2.5 3.2L18 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button
                type="button"
                id="cooling-chart-fit-mode-curve-btn"
                class="action-btn graph-fit-mode-btn"
                aria-pressed="false"
                aria-label="Křivka"
                title="Křivka"
              >
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 16c3.4-9.5 10.6-9.5 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <circle cx="5" cy="16" r="2.15" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="19" cy="16" r="2.15" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <div class="board-stage" aria-label="Simulace teploty">
        <p class="sim-empty-hint" id="hintEl">Zapni hořák a sleduj, jak se těleso ohřívá.</p>
        <p class="ambient-temp-label" id="ambient-temp-label">Okolní teplota: 22 °C</p>
        <div class="sim-fit">
        <div class="sim-stage">
          <div id="thermometer" class="thermometer" aria-label="Teploměr">
            <svg viewBox="0 0 56 130" aria-hidden="true">
              <rect class="tube-bg" x="18" y="8" width="20" height="118" rx="10" />
              <rect class="tube-inner" x="22" y="12" width="12" height="110" rx="6" />
              <rect id="mercury-column" class="mercury" x="24" y="118" width="8" height="4" rx="4" />
            </svg>
            <div id="temp-readout" class="temp-readout">teplota</div>
          </div>

          <div class="cup-wrap" id="water-subject">
            <div id="lottie" class="lottie" aria-label="Hrníček s vodou"></div>
            <div class="water-detail" aria-label="Detail částic vody">
              <canvas id="water-particles" class="water-particles"></canvas>
            </div>
          </div>

          <div class="gold-brick-wrap" id="gold-subject" hidden>
            <div class="gold-scene">
              <img
                class="gold-brick"
                src="assets/gold-brick.svg"
                width="148"
                height="88"
                alt="Zlatá cihla"
              />
              <div class="gold-detail" aria-label="Detail částic zlata">
                <canvas id="gold-particles" class="gold-particles"></canvas>
              </div>
            </div>
          </div>

          <div class="gas-wrap" id="gas-subject" hidden>
            <div class="gas-scene">
              <div
                id="gas-vessel"
                class="gas-vessel"
                role="img"
                aria-label="Nádoba s plynem"
              ></div>
              <div class="gas-detail" aria-label="Detail částic plynu">
                <canvas id="gas-particles" class="gas-particles"></canvas>
              </div>
            </div>
          </div>

          <div class="burner-wrap">
            <div
              id="burner"
              class="burner"
              role="img"
              aria-label="Hořák"
            ></div>
          </div>
        </div>
        </div>
        <div class="cooling-chart-wrap" id="cooling-chart-wrap">
          <svg
            id="cooling-chart"
            class="cooling-chart-svg"
            role="img"
            aria-label="Graf závislosti teploty vody na čase"
          ></svg>
          <div class="cooling-chart-cursor" id="cooling-chart-cursor" hidden aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="ambient-keypad-overlay" class="table-keypad-overlay" hidden>
    <div
      class="table-keypad-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ambient-keypad-title"
    >
      <p id="ambient-keypad-title" class="table-keypad-panel__title">Okolní teplota</p>
      <div
        id="ambient-keypad-display"
        class="table-keypad-panel__display"
        aria-live="polite"
      ></div>
      <p id="ambient-keypad-error" class="table-keypad-panel__error" hidden></p>
      <div class="table-math-keypad" id="ambient-math-keypad" aria-label="Matematická klávesnice">
        <div class="table-math-keypad__grid">
          <button class="table-math-keypad__key" type="button" data-value="7">7</button>
          <button class="table-math-keypad__key" type="button" data-value="8">8</button>
          <button class="table-math-keypad__key" type="button" data-value="9">9</button>
          <button class="table-math-keypad__key" type="button" data-value="4">4</button>
          <button class="table-math-keypad__key" type="button" data-value="5">5</button>
          <button class="table-math-keypad__key" type="button" data-value="6">6</button>
          <button class="table-math-keypad__key" type="button" data-value="1">1</button>
          <button class="table-math-keypad__key" type="button" data-value="2">2</button>
          <button class="table-math-keypad__key" type="button" data-value="3">3</button>
          <button
            class="table-math-keypad__key table-math-keypad__key--wide"
            type="button"
            data-value="0"
          >
            0
          </button>
          <button
            class="table-math-keypad__key"
            type="button"
            data-action="clear"
            aria-label="Smazat vše"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="table-keypad-panel__actions">
        <button
          type="button"
          id="ambient-keypad-cancel"
          class="table-keypad-panel__action table-keypad-panel__cancel"
          aria-label="Zavřít bez uložení"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6l12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          type="button"
          id="ambient-keypad-confirm"
          class="table-keypad-panel__action table-keypad-panel__confirm"
          aria-label="Vložit hodnotu"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M5 12.5l5 5L19 7"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
