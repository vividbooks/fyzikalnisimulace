<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pascalův zákon</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <main class="scene" aria-label="Simulace Pascalova zákona">
    <aside class="setup-panel" aria-label="Ovládání simulace">
      <div class="panel-copy">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="panel-title">Pascalův zákon</h1>
      </div>

      <section class="panel-section" aria-label="Místo stisku">
        <label class="panel-label" for="posSlider">Místo stisku</label>
        <div class="speed-control">
          <input type="range" id="posSlider" class="speed-control__slider" min="0" max="100" step="1" value="35" />
        </div>
        <span class="panel-note">Místo můžeš vybrat i klepnutím na láhev.</span>
      </section>

      <section class="panel-section" aria-label="Síla stisku">
        <label class="panel-label" for="forceSlider">Síla stisku</label>
        <div class="speed-control">
          <input type="range" id="forceSlider" class="speed-control__slider" min="5" max="50" step="5" value="25" />
          <output class="speed-control__value" id="forceValue" for="forceSlider">25 N</output>
        </div>
      </section>

      <section class="panel-section">
        <button type="button" id="btnPress" class="action-btn action-btn--run press-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v12M6 11l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 21h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          Stisknout láhev
        </button>
        <span class="panel-note">Drž tlačítko (nebo láhev) — voda stříká, dokud tlačíš.</span>
      </section>
    </aside>

    <div class="scene-workspace" id="workspace">
