<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Druhy pohybů</title>
  <style>
    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-Book.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-SemiBold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Cooper Light";
      src: url("assets/fonts/Cooper-Light.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    :root {
      --font-app: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
      --page-bg: #1e2533;
      --bg: #1e2533;
      --card-bg: #2a3344;
      --idle-bg: #334155;
      --idle-text: #cbd5e1;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-on: #ffffff;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #475569;
      --border-strong: #475569;
      --focus: #3b82f6;
      --canvas-bg: #ffffe6;
      --canvas-text: #334155;
      --success: #4ade80;
      --danger: #ef4444;
      --radius: 12px;
      --radius-canvas: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-app);
      background: var(--page-bg);
      color: var(--text);
      color-scheme: dark;
    }

    button, input, select, label {
      font-family: inherit;
    }

    .app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
      background: var(--page-bg);
    }

    .app-head {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      flex: 0 0 auto;
      min-width: 0;
    }

    .hub-back-to-sims {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: #1e293b;
      color: var(--text);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      text-decoration: none;
    }

    .hub-back-to-sims svg {
      display: block;
      flex: 0 0 auto;
    }

    .hub-back-to-sims:hover {
      color: #ffffff;
    }

    .hub-back-to-sims:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .panel-title {
      margin: 0;
      min-width: 0;
      color: var(--text);
      font-family: "Cooper Light", serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }

    .workspace {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-canvas);
      background: var(--canvas-bg);
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #animation-svg {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 8px;
      pointer-events: none;
    }

    .picker-wrap {
      pointer-events: auto;
    }

    .picker-wrap h2 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #ball-picker {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .ball-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--canvas-text);
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .ball-option:has(input:checked) {
      border-color: var(--accent);
      background: #eff6ff;
      color: #1e3a8a;
    }

    .ball-option input {
      accent-color: var(--accent);
    }

    .ball-option span {
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: lowercase;
    }

    .ball-option-group {
      position: relative;
    }

    .seda-change-btn {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--canvas-text);
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      transition: border-color 0.15s, background 0.15s, color 0.15s, opacity 0.15s, visibility 0.15s;
    }

    .seda-change-btn svg {
      display: block;
      width: 16px;
      height: 14px;
    }

    .seda-change-btn:not(.is-visible) {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .seda-change-btn:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }

    #jet-motor {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
    }

    #jet-motor.is-active {
      opacity: 1;
      visibility: visible;
    }

    #jet-motor svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(251, 146, 60, 0.85))
        drop-shadow(0 0 28px rgba(239, 68, 68, 0.45));
    }

    .jet-flame {
      transform-box: fill-box;
      transform-origin: 86% 50%;
    }

    #jet-motor.is-active .jet-flame-outer {
      animation: jet-pulse-outer 0.14s ease-in-out infinite alternate;
    }

    #jet-motor.is-active .jet-flame-inner {
      animation: jet-pulse-inner 0.09s ease-in-out infinite alternate-reverse;
    }

    #jet-motor.is-active .jet-flame-core {
      animation: jet-pulse-core 0.07s ease-in-out infinite alternate;
    }

    @keyframes jet-pulse-outer {
      from { transform: scaleX(0.88) scaleY(1.06); opacity: 0.88; }
      to { transform: scaleX(1.18) scaleY(0.88); opacity: 1; }
    }

    @keyframes jet-pulse-inner {
      from { transform: scaleX(0.86) scaleY(1.04); opacity: 0.9; }
      to { transform: scaleX(1.14) scaleY(0.9); opacity: 1; }
    }

    @keyframes jet-pulse-core {
      from { transform: scaleX(0.84) scaleY(1); opacity: 0.82; }
      to { transform: scaleX(1.12) scaleY(0.94); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .jet-flame { animation: none !important; }
    }

    .quiz-wrap {
      position: absolute;
      top: 58%;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--canvas-text);
      max-width: min(calc(100% - 32px), 520px);
      width: max-content;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .quiz-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .quiz-select {
      position: relative;
    }

    .quiz-select-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 148px;
      padding: 6px 10px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--canvas-text);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .quiz-select-value.is-empty {
      color: transparent;
    }

    .quiz-select-value.is-empty::before {
      content: " ";
      display: inline-block;
      width: 1px;
    }

    .quiz-select-chevron {
      margin-left: auto;
      color: #6b7280;
      font-size: 0.8rem;
    }

    .quiz-select-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 20;
      min-width: 100%;
      margin: 0;
      padding: 4px;
      list-style: none;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    .quiz-select-menu[hidden] {
      display: none;
    }

    .quiz-select-option {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .quiz-select-option:hover,
    .quiz-select-option.is-selected {
      background: #f3f4f6;
    }

    .quiz-select-btn.is-correct {
      border-color: #16a34a;
      background: #ecfdf5;
      color: #166534;
    }

    .quiz-select-btn.is-correct .quiz-select-chevron {
      color: #166534;
    }

    .quiz-select-btn.is-wrong {
      border-color: #dc2626;
      background: #fef2f2;
      color: #991b1b;
    }

    .quiz-select-btn.is-wrong .quiz-select-chevron {
      color: #991b1b;
    }

    #verify-btn {
      margin-top: 4px;
      min-height: 44px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-on);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    #verify-btn:hover {
      background: var(--accent-hover);
    }

    #verify-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    @media (max-width: 899.98px) {
      .app {
        padding: max(8px, env(safe-area-inset-top, 0px))
          max(10px, env(safe-area-inset-right, 0px))
          max(12px, env(safe-area-inset-bottom, 0px))
          max(10px, env(safe-area-inset-left, 0px));
        gap: 10px;
      }

      .panel-title {
        font-size: 28px;
      }

      .ui-overlay {
        padding: 12px 12px 8px;
      }

      .ball-option {
        padding: 8px 10px;
        gap: 8px;
      }
    }

  </style>
</head>
<body>
  <div class="app">
    <header class="app-head">
      <a href="../index.html" class="hub-back-to-sims">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Zpět
      </a>
      <h1 class="panel-title">Druhy pohybů</h1>
    </header>

    <div class="workspace">
      <div id="stage"></div>

      <div class="ui-overlay">
        <div class="picker-wrap">
          <h2>Vyber kuličku</h2>
          <div id="ball-picker"></div>
        </div>
      </div>

      <div class="quiz-wrap" id="quiz-wrap">
        <div class="quiz-row">
          <span>Pohyb kuličky je</span>
          <div class="quiz-select" id="path-type" data-label="Tvar dráhy pohybu">
            <button type="button" class="quiz-select-btn" aria-haspopup="listbox" aria-expanded="false">
              <span class="quiz-select-value is-empty"></span>
              <span class="quiz-select-chevron" aria-hidden="true">▾</span>
            </button>
            <ul class="quiz-select-menu" role="listbox" hidden>
              <li class="quiz-select-option" role="option" data-value="přímočarý">přímočarý</li>
              <li class="quiz-select-option" role="option" data-value="křivočarý">křivočarý</li>
            </ul>
          </div>
        </div>
        <div class="quiz-row">
          <span>Pohyb kuličky je</span>
          <div class="quiz-select" id="speed-type" data-label="Rovnoměrnost pohybu">
            <button type="button" class="quiz-select-btn" aria-haspopup="listbox" aria-expanded="false">
              <span class="quiz-select-value is-empty"></span>
              <span class="quiz-select-chevron" aria-hidden="true">▾</span>
            </button>
            <ul class="quiz-select-menu" role="listbox" hidden>
              <li class="quiz-select-option" role="option" data-value="rovnoměrný">rovnoměrný</li>
              <li class="quiz-select-option" role="option" data-value="nerovnoměrný">nerovnoměrný</li>
            </ul>
          </div>
        </div>
        <button id="verify-btn" type="button">Ověřit</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
