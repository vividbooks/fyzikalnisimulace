<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Druhy pohybů</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #1a1a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #animation-svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      pointer-events: none;
    }

    .ui-overlay h1 {
      font-size: 1.05rem;
      font-weight: 600;
      pointer-events: none;
    }

    .picker-wrap {
      pointer-events: auto;
    }

    .picker-wrap h2 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #ball-picker {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .ball-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .ball-option:has(input:checked) {
      border-color: #3b50f0;
      background: rgba(244, 246, 255, 0.95);
    }

    .ball-option input {
      accent-color: #3b50f0;
    }

    .ball-option span {
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: lowercase;
    }

    .ball-option-group {
      position: relative;
    }

    .seda-change-btn {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      color: #4b5563;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      transition: border-color 0.15s, background 0.15s, color 0.15s, opacity 0.15s, visibility 0.15s;
    }

    .seda-change-btn svg {
      display: block;
      width: 16px;
      height: 14px;
    }

    .seda-change-btn:not(.is-visible) {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .seda-change-btn:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }

    #jet-motor {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
    }

    #jet-motor.is-active {
      opacity: 1;
      visibility: visible;
    }

    #jet-motor svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(251, 146, 60, 0.85))
        drop-shadow(0 0 28px rgba(239, 68, 68, 0.45));
    }

    .jet-flame {
      transform-box: fill-box;
      transform-origin: 86% 50%;
    }

    #jet-motor.is-active .jet-flame-outer {
      animation: jet-pulse-outer 0.14s ease-in-out infinite alternate;
    }

    #jet-motor.is-active .jet-flame-inner {
      animation: jet-pulse-inner 0.09s ease-in-out infinite alternate-reverse;
    }

    #jet-motor.is-active .jet-flame-core {
      animation: jet-pulse-core 0.07s ease-in-out infinite alternate;
    }

    @keyframes jet-pulse-outer {
      from { transform: scaleX(0.88) scaleY(1.06); opacity: 0.88; }
      to { transform: scaleX(1.18) scaleY(0.88); opacity: 1; }
    }

    @keyframes jet-pulse-inner {
      from { transform: scaleX(0.86) scaleY(1.04); opacity: 0.9; }
      to { transform: scaleX(1.14) scaleY(0.9); opacity: 1; }
    }

    @keyframes jet-pulse-core {
      from { transform: scaleX(0.84) scaleY(1); opacity: 0.82; }
      to { transform: scaleX(1.12) scaleY(0.94); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .jet-flame { animation: none !important; }
    }

    .quiz-wrap {
      position: fixed;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      max-width: min(calc(100% - 32px), 520px);
      width: max-content;
    }

    .quiz-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .quiz-select {
      position: relative;
    }

    .quiz-select-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 148px;
      padding: 6px 10px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1a1a1a;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .quiz-select-value.is-empty {
      color: transparent;
    }

    .quiz-select-value.is-empty::before {
      content: " ";
      display: inline-block;
      width: 1px;
    }

    .quiz-select-chevron {
      margin-left: auto;
      color: #6b7280;
      font-size: 0.8rem;
    }

    .quiz-select-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 20;
      min-width: 100%;
      margin: 0;
      padding: 4px;
      list-style: none;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    .quiz-select-menu[hidden] {
      display: none;
    }

    .quiz-select-option {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .quiz-select-option:hover,
    .quiz-select-option.is-selected {
      background: #f3f4f6;
    }

    .quiz-select-btn.is-correct {
      border-color: #16a34a;
      background: #ecfdf5;
      color: #166534;
    }

    .quiz-select-btn.is-correct .quiz-select-chevron {
      color: #166534;
    }

    .quiz-select-btn.is-wrong {
      border-color: #dc2626;
      background: #fef2f2;
      color: #991b1b;
    }

    .quiz-select-btn.is-wrong .quiz-select-chevron {
      color: #991b1b;
    }

    #verify-btn {
      margin-top: 4px;
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: #3b50f0;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    #verify-btn:hover {
      background: #3246d8;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .hub-back-to-sims {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.94);
      color: #111827;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .hub-back-to-sims:hover {
      border-color: #3b50f0;
      color: #3b50f0;
      background: #f4f6ff;
    }

  </style>
</head>
<body>
  <a href="../index.html" class="hub-back-to-sims">← Přehled simulací</a>
  <div id="stage"></div>

  <div class="ui-overlay">
    <h1>Druhy pohybů</h1>
    <div class="picker-wrap">
      <h2>Vyber kuličku</h2>
      <div id="ball-picker"></div>
    </div>
  </div>

  <div class="quiz-wrap" id="quiz-wrap">
    <div class="quiz-row">
      <span>Pohyb kuličky je</span>
      <div class="quiz-select" id="path-type" data-label="Tvar dráhy pohybu">
        <button type="button" class="quiz-select-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="quiz-select-value is-empty"></span>
          <span class="quiz-select-chevron" aria-hidden="true">▾</span>
        </button>
        <ul class="quiz-select-menu" role="listbox" hidden>
          <li class="quiz-select-option" role="option" data-value="přímočarý">přímočarý</li>
          <li class="quiz-select-option" role="option" data-value="křivočarý">křivočarý</li>
        </ul>
      </div>
    </div>
    <div class="quiz-row">
      <span>Pohyb kuličky je</span>
      <div class="quiz-select" id="speed-type" data-label="Rovnoměrnost pohybu">
        <button type="button" class="quiz-select-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="quiz-select-value is-empty"></span>
          <span class="quiz-select-chevron" aria-hidden="true">▾</span>
        </button>
        <ul class="quiz-select-menu" role="listbox" hidden>
          <li class="quiz-select-option" role="option" data-value="rovnoměrný">rovnoměrný</li>
          <li class="quiz-select-option" role="option" data-value="nerovnoměrný">nerovnoměrný</li>
        </ul>
      </div>
    </div>
    <button id="verify-btn" type="button">Ověřit</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
