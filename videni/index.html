<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Barevné vidění</title>
    <link rel="stylesheet" href="style.css?v=fedits-ux2" />
  </head>
  <body>
    <div class="app">
      <header class="hud" aria-label="Ovládání">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="hud-title">Barevné vidění</h1>
        <div class="hud-actions">
          <button type="button" id="src-photo" class="hud-btn is-active" aria-pressed="true">
            Fotografie
          </button>
          <label class="hud-btn hud-btn--file" id="src-upload" for="file-input">
            Vlastní obrázek
            <span class="hud-file-clip">
              <input
                id="file-input"
                class="hud-file-input"
                type="file"
                accept="image/*"
                tabindex="-1"
                aria-label="Vybrat vlastní obrázek"
              />
            </span>
          </label>
        </div>
      </header>

      <div class="workspace">
      <main class="stage" aria-label="Obrázek s barevnými složkami">
        <button
          type="button"
          id="photo-prev"
          class="photo-nav"
          aria-label="Předchozí fotografie"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7"></path>
          </svg>
        </button>
        <div class="frame">
          <canvas id="view" aria-label="Zobrazený obrázek"></canvas>
        </div>
        <button
          type="button"
          id="photo-next"
          class="photo-nav"
          aria-label="Další fotografie"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </main>

      <footer class="dock">
        <div class="dock-bar">
          <div class="mode-toggle" role="group" aria-label="Režim zobrazení">
            <button type="button" id="panel-rgb" class="mode-toggle-btn is-active" aria-pressed="true">
              RGB
            </button>
            <button type="button" id="panel-disorders" class="mode-toggle-btn" aria-pressed="false">
              Poruchy
            </button>
          </div>
          <button
            type="button"
            id="zoom-btn"
            class="zoom-btn"
            aria-label="Zobrazit obrázek přes celou obrazovku prohlížeče"
            aria-pressed="false"
          >
            <svg class="zoom-icon zoom-icon--in" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
              <path d="M11 8v6"></path>
              <path d="M8 11h6"></path>
            </svg>
            <svg class="zoom-icon zoom-icon--out" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
              <path d="M8 11h6"></path>
            </svg>
          </button>
        </div>
        <div class="channels" id="rgb-panel" role="group" aria-label="Barevné složky">
          <div
            class="channel-scrub"
            data-channel="red"
            tabindex="0"
            role="slider"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
            aria-label="Maximální intenzita červené"
          >
            <button
              type="button"
              class="channel-lock"
              aria-pressed="false"
              aria-label="Zamknout červenou na 0 %"
            >
              <svg class="channel-lock-icon channel-lock-icon--open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="channel-lock-icon channel-lock-icon--shut" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3.2 3.8"></path>
                <path d="M6.6 6.6A16 16 0 0 0 2 12s3.5 7 10 7c1.5 0 2.9-.3 4.1-.8"></path>
                <path d="M9.9 9.9A3 3 0 0 0 14 14"></path>
              </svg>
            </button>
            <span class="channel-scrub-inner">
              <button type="button" class="channel-scrub-arrow channel-scrub-arrow-dec" aria-label="Snížit intenzitu červené">◀</button>
              <span class="channel-val" id="val-red">100</span><span class="channel-pct">%</span>
              <button type="button" class="channel-scrub-arrow channel-scrub-arrow-inc" aria-label="Zvýšit intenzitu červené">▶</button>
            </span>
          </div>
          <div
            class="channel-scrub"
            data-channel="green"
            tabindex="0"
            role="slider"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
            aria-label="Maximální intenzita zelené"
          >
            <button
              type="button"
              class="channel-lock"
              aria-pressed="false"
              aria-label="Zamknout zelenou na 0 %"
            >
              <svg class="channel-lock-icon channel-lock-icon--open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="channel-lock-icon channel-lock-icon--shut" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3.2 3.8"></path>
                <path d="M6.6 6.6A16 16 0 0 0 2 12s3.5 7 10 7c1.5 0 2.9-.3 4.1-.8"></path>
                <path d="M9.9 9.9A3 3 0 0 0 14 14"></path>
              </svg>
            </button>
            <span class="channel-scrub-inner">
              <button type="button" class="channel-scrub-arrow channel-scrub-arrow-dec" aria-label="Snížit intenzitu zelené">◀</button>
              <span class="channel-val" id="val-green">100</span><span class="channel-pct">%</span>
              <button type="button" class="channel-scrub-arrow channel-scrub-arrow-inc" aria-label="Zvýšit intenzitu zelené">▶</button>
            </span>
          </div>
          <div
            class="channel-scrub"
            data-channel="blue"
            tabindex="0"
            role="slider"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
            aria-label="Maximální intenzita modré"
          >
            <button
              type="button"
              class="channel-lock"
              aria-pressed="false"
              aria-label="Zamknout modrou na 0 %"
            >
              <svg class="channel-lock-icon channel-lock-icon--open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="channel-lock-icon channel-lock-icon--shut" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3.2 3.8"></path>
                <path d="M6.6 6.6A16 16 0 0 0 2 12s3.5 7 10 7c1.5 0 2.9-.3 4.1-.8"></path>
                <path d="M9.9 9.9A3 3 0 0 0 14 14"></path>
              </svg>
            </button>
            <span class="channel-scrub-inner">
              <button type="button" class="channel-scrub-arrow channel-scrub-arrow-dec" aria-label="Snížit intenzitu modré">◀</button>
              <span class="channel-val" id="val-blue">100</span><span class="channel-pct">%</span>
              <button type="button" class="channel-scrub-arrow channel-scrub-arrow-inc" aria-label="Zvýšit intenzitu modré">▶</button>
            </span>
          </div>
        </div>
        <div class="channels disorders" id="disorder-panel" hidden role="group" aria-label="Poruchy barevného vidění">
          <button type="button" class="channel is-on" data-disorder="none" aria-pressed="true">
            Bez poruchy
          </button>
          <button type="button" class="channel" data-disorder="deuteranopia" aria-pressed="false">
            Červeno-zelená
          </button>
          <button type="button" class="channel" data-disorder="protanopia" aria-pressed="false">
            Červená
          </button>
          <button type="button" class="channel" data-disorder="tritanopia" aria-pressed="false">
            Modro-žlutá
          </button>
          <button type="button" class="channel" data-disorder="achromatopsia" aria-pressed="false">
            Úplná
          </button>
        </div>
      </footer>
      </div>
    </div>

    <script src="main.js?v=disorders-3"></script>
  </body>
</html>
