  <main class="scene" aria-label="Simulace tónu – generátor obdélníkového signálu a reproduktor">
    <aside class="setup-panel" aria-label="Ovládání simulace">
      <div class="panel-copy">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="panel-title">Tón</h1>
      </div>

      <section class="panel-section" aria-label="Generátor">
        <button type="button" id="btnRun" class="action-btn action-btn--run" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="runIcon" d="M8 5.14v13.72L19 12 8 5.14z"/></svg>
          <span id="runText">Spustit</span>
        </button>
      </section>

      <section class="panel-section" aria-label="Tvar signálu">
        <span class="panel-label">Tvar signálu</span>
        <div class="mode-switch mode-switch--3" role="group" aria-label="Tvar signálu">
          <button class="mode-switch__btn is-active" type="button" data-wave="square" aria-pressed="true">obdélník</button>
          <button class="mode-switch__btn" type="button" data-wave="sine" aria-pressed="false">sinus</button>
          <button class="mode-switch__btn" type="button" data-wave="violin" aria-pressed="false">housle</button>
        </div>
      </section>

      <section class="panel-section" aria-label="Frekvence">
        <span class="panel-label">Frekvence signálu</span>
        <div class="obj-card">
          <div class="ton-freq"><i class="qty">f</i>&nbsp;=&nbsp;<span class="ton-freq__value" id="fVal">5</span><span class="ton-freq__unit">Hz</span></div>
          <input class="ton-slider" id="fSlider" type="range" min="0" max="1000" step="1" value="212" aria-label="Frekvence" />
          <div class="ton-scale"><span>0 Hz</span><span>10 Hz</span><span>100 Hz</span><span>2 000 Hz</span></div>
          <div class="ton-step">
            <button type="button" id="fMinus" aria-label="Snížit frekvenci">−</button>
            <span id="fStepLabel">po 1 Hz</span>
            <button type="button" id="fPlus" aria-label="Zvýšit frekvenci">+</button>
          </div>
        </div>
      </section>

      <section class="panel-section" aria-label="Rychlé volby">
        <span class="panel-label">Rychlé volby</span>
        <div class="ton-presets">
          <button type="button" class="ton-preset" data-f="0">0 Hz</button>
          <button type="button" class="ton-preset" data-f="1">1 Hz</button>
          <button type="button" class="ton-preset" data-f="5">5 Hz</button>
          <button type="button" class="ton-preset" data-f="20">20 Hz</button>
          <button type="button" class="ton-preset" data-f="50">50 Hz</button>
          <button type="button" class="ton-preset ton-preset--wide" data-f="440">440 Hz<small>komorní a</small></button>
          <button type="button" class="ton-preset" data-f="1000">1&nbsp;000&nbsp;Hz</button>
        </div>
      </section>

      <section class="panel-section" aria-label="Perioda">
        <span class="panel-label">Perioda</span>
        <div class="obj-card ton-card">
          <div class="ton-row"><span>kmitů za 1 sekundu</span><span id="perSec">5</span></div>
          <div class="ton-row"><span class="ton-row__label">perioda&nbsp;<i class="qty">T</i>&nbsp;=&nbsp;<span class="ton-frac" aria-label="1 lomeno f"><span class="ton-frac__num">1</span><span class="ton-frac__den"><i class="qty">f</i></span></span></span><span id="period">0,2 s</span></div>
          <p class="ton-note">Perioda je doba jednoho kmitu – mezi dvěma pohyby blány reproduktoru.</p>
        </div>
      </section>

    </aside>
