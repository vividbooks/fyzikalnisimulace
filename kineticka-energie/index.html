<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Kinetická energie</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <main class="scene" aria-label="Simulace kinetické energie">
    <aside class="setup-panel" aria-label="Ovládání simulace">
      <div class="panel-copy">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="panel-title">Kinetická energie</h1>
      </div>


      <section class="panel-section" aria-label="Prostředí">
        <span class="panel-label">Prostředí</span>
        <div class="env-toggle" id="envToggle" role="radiogroup" aria-label="Prostředí simulace"></div>
      </section>

      <section class="panel-section" aria-label="Výběr tělesa">
        <span class="panel-label">Těleso</span>
        <div class="object-picker" id="objectPicker" role="radiogroup" aria-label="Těleso"></div>
      </section>

      <section class="panel-section" aria-label="Rychlost tělesa">
        <label class="panel-label" for="speedSlider">Rychlost</label>
        <div class="speed-control">
          <input
            type="range"
            id="speedSlider"
            class="speed-control__slider"
            min="1"
            max="10"
            step="1"
            value="5"
          />
          <output class="speed-control__value" id="speedValue" for="speedSlider">5 <span class="unit-frac" aria-label="metrů za sekundu"><span class="unit-frac__num">m</span><span class="unit-frac__den">s</span></span></output>
        </div>
      </section>

      <section class="panel-section">
        <div class="actions-row" aria-label="Akce simulace">
          <button type="button" id="btnRun" class="action-btn action-btn--run">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.14v13.72L19 12 8 5.14z"/>
            </svg>
            Pustit
          </button>
          <button type="button" id="btnReset" class="action-btn action-btn--reset">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 8A7.5 7.5 0 1 1 4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4.5 3.5V8h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Znovu
          </button>
        </div>
      </section>

    </aside>

    <div class="scene-workspace" id="workspace">
      <div class="viz-side">
        <div class="body-info" id="bodyInfo" aria-live="polite">
          <span class="body-info__name" id="bodyInfoName">Bowlingová koule</span>
          <span class="body-info__row"><i class="qty">V</i> = <span class="body-info__value" id="volumeValue">500</span> cm³</span>
          <span class="body-info__row"><i class="qty">m</i> = <span class="body-info__value" id="massValue">1</span> <span id="massUnit">kg</span></span>
        </div>
        <div class="sim-label-slot">
          <img class="sim-label sim-label-earth" src="assets/sim-label.svg" width="66" height="53" alt="Země, g = 10 N/kg" />
          <img class="sim-label sim-label-moon" src="assets/sim-label-moon.svg" width="69" height="53" alt="Měsíc, g = 1,6 N/kg" />
          <img class="sim-label sim-label-weightless" src="assets/sim-label-weightless.svg" width="115" height="53" alt="Stav beztíže, g = 0 N/kg" />
        </div>
      </div>
      <p class="sim-empty-hint" id="hintEl">Vyber těleso, nastav rychlost a&nbsp;stiskni Pustit.</p>
      <svg
        class="stage"
        id="stage"
        viewBox="0 0 1110 520"
        preserveAspectRatio="xMidYMax meet"
        role="img"
        aria-label="Těleso se kutálí po zemi a naráží do desky s pružinou"
      ></svg>
    </div>
  </main>

  <script src="main.js?v=16"></script>
  <script src="../shared/sim-qr.js"></script>
</body>
</html>
