<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Stlačování látek</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
  <main class="scene" aria-label="Simulace stlačování látek">
    <aside class="setup-panel" aria-label="Nastavení simulace">
      <a
        href="../index.html"
        class="hub-back-to-sims"
      >
        ← Přehled simulací
      </a>

      <div class="panel-copy">
        <h1 class="panel-title">Stlačování látek</h1>
        <p class="panel-hint" id="hintEl">
          Táhni píst dolů nebo nahoru a zkus stlačit pevnou látku.
        </p>
      </div>

      <div
        class="panel-section subject-control"
        id="simControls"
        role="group"
        aria-label="Druh látky"
      >
        <span class="panel-label">Druh látky</span>
        <div class="subject-control__buttons">
          <button
            type="button"
            class="subject-btn is-active"
            data-scene="solid"
            aria-pressed="true"
          >
            pevná
          </button>
          <button
            type="button"
            class="subject-btn"
            data-scene="liquid"
            aria-pressed="false"
          >
            kapalná
          </button>
          <button
            type="button"
            class="subject-btn"
            data-scene="gas"
            aria-pressed="false"
          >
            plynná
          </button>
        </div>
        <div class="actions-row">
          <button
            type="button"
            id="btnQuiz"
            class="panel-action-btn"
            aria-pressed="false"
          >
            kvíz
          </button>
        </div>
      </div>
    </aside>

    <div class="scene-workspace" aria-label="Vizualizace lisu">
      <div class="sim-view" id="simView">
        <div class="stage-slot">
          <div class="stage" id="stage">
            <div id="lottie" class="lottie" aria-label="Lis s pevnou látkou"></div>
            <div
              class="piston-hit"
              id="pistonHit"
              role="slider"
              tabindex="0"
              aria-label="Píst lisu"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-valuetext="Píst nahoře"
            ></div>
          </div>
        </div>
      </div>

      <div class="quiz-view" id="quizView" hidden>
        <div class="quiz-header">
          <p class="quiz-intro">
            Ke každému skupenství tažením přiřaď, jaké vlastnosti má těleso, které se v
            tomto skupenství nachází (jednu vlastnost může mít i více skupenství).
          </p>
        </div>

        <div class="quiz-pool" id="quizPool" aria-label="Vlastnosti k přiřazení"></div>

        <div class="quiz-board" id="quizBoard" aria-label="Skupenství"></div>

        <div class="quiz-actions">
          <button type="button" id="btnQuizCheck">Zkontrolovat</button>
          <button type="button" id="btnQuizReset" class="secondary">Reset</button>
        </div>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
