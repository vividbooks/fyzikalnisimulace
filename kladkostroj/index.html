<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Kladkostroj</title>
    <link rel="stylesheet" href="style.css?v=run-stop-1" />

  </head>
  <body>
    <div
      id="mode-menu"
      class="mode-menu"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="mode-menu-title"
    >
      <div class="mode-menu__nav">
        <a href="../index.html" id="mode-hub-back" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <button type="button" id="mode-menu-back" class="hub-back-to-sims" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </button>
      </div>
      <div class="mode-menu__panel">
        <div>
          <h1 id="mode-menu-title" class="panel-title">Kladkostroj</h1>
        </div>

        <div id="mode-view-home" class="mode-view">
          <div class="mode-cards">
            <button type="button" class="mode-card mode-card--lab" id="mode-choose-lab">
              <span class="mode-card__title">Laboratoř</span>
              <span class="mode-card__desc">
                Sestav si vlastní kladkostroj.
              </span>
            </button>
            <button
              type="button"
              class="mode-card mode-card--presets"
              id="mode-choose-presets"
            >
              <span class="mode-card__title">Kladkostroje</span>
              <span class="mode-card__desc">
                Hotové soustavy připravené ke spuštění a pozorování.
              </span>
            </button>
            <button
              type="button"
              class="mode-card mode-card--quiz"
              id="mode-choose-quiz"
            >
              <span class="mode-card__title">Kvíz</span>
              <span class="mode-card__desc">
                Doplň velikosti působících sil v náhodném kladkostroji.
              </span>
            </button>
          </div>
        </div>

        <div id="mode-view-presets" class="mode-view" hidden>
          <div class="preset-cards" id="preset-cards"></div>
        </div>
      </div>
    </div>

    <div class="app-root" data-tool="move" data-app-mode="gallery">
      <aside class="left-panel" aria-label="Ovládání simulace">
        <div class="panel-copy">
          <div class="panel-head">
            <button type="button" id="btn-back-menu" class="hub-back-to-sims">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Zpět
            </button>
            <h1 class="panel-title" id="panel-mode-title">Kladkostroj</h1>
          </div>
          <div
            class="mode-switch"
            id="builder-mode-switch"
            role="group"
            aria-label="Režim"
          >
            <button
              type="button"
              class="mode-switch__btn is-active"
              data-builder-mode="gallery"
              aria-pressed="true"
            >
              Kladkostroj
            </button>
            <button
              type="button"
              class="mode-switch__btn"
              data-builder-mode="lab"
              aria-pressed="false"
            >
              Vytvoř vlastní
            </button>
          </div>
          <div class="panel-tools" aria-label="Nástroje">
            <div
              class="panel-actions panel-actions--tools-primary"
              data-lab-only
            >
              <button
                type="button"
                id="tool-erase"
                class="action-btn action-btn--icon"
                aria-pressed="false"
                aria-label="Guma"
                title="Guma"
              >
                <span class="action-btn__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"
                    />
                    <path d="M22 21H7" />
                    <path d="m5 11 9 9" />
                  </svg>
                </span>
              </button>
              <button
                type="button"
                id="tool-move"
                class="action-btn action-btn--icon is-active"
                aria-pressed="true"
                aria-label="Posun"
                title="Posun"
              >
                <span class="action-btn__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2" />
                    <path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2" />
                    <path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8" />
                    <path
                      d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"
                    />
                  </svg>
                </span>
              </button>
              <button
                type="button"
                id="tool-rope"
                class="action-btn"
                aria-pressed="false"
              >
                Lano
              </button>
              <button
                type="button"
                id="tool-freehand"
                class="action-btn"
                aria-pressed="false"
              >
                Tužka
              </button>
            </div>
            <div class="panel-actions" data-lab-only id="export-scene-row">
              <button type="button" id="tool-export-scene" class="action-btn">
                Uložit scénu
              </button>
            </div>
          </div>
          <div class="quiz-panel" id="quiz-panel" aria-label="Kvíz">
            <p class="quiz-panel__task">
              Klikni na políčko u šipky a doplň, jak velká síla působí. Jedno
              závaží má tíhu 100 N.
            </p>
            <div
              class="quiz-panel__status"
              id="quiz-status"
              role="status"
              aria-live="polite"
            >
              Doplněno 0 / 0
            </div>
            <div class="panel-actions quiz-panel__actions">
              <button type="button" id="quiz-reveal" class="action-btn">
                Ukázat řešení
              </button>
              <button type="button" id="quiz-new" class="action-btn">
                Nový úkol
              </button>
            </div>
          </div>
          <div
            class="gallery-presets"
            id="gallery-presets"
            aria-label="Výběr kladkostroje"
          >
            <div id="gallery-preset-list"></div>
            <button type="button" id="btn-enter-quiz" class="action-btn quiz-entry-btn">
              Kvíz
            </button>
          </div>
          <div class="size-control" data-lab-only>
            <label class="panel-label" for="pulley-size-slider">Velikost</label>
            <div class="size-control__row">
              <input
                type="range"
                id="pulley-size-slider"
                min="40"
                max="100"
                step="1"
                value="90"
                aria-valuemin="40"
                aria-valuemax="100"
                aria-valuenow="90"
                aria-label="Velikost kladek, závaží a lana na ploše"
              />
            </div>
          </div>
        </div>

        <div class="stock-section">
          <div class="stock-scaler" id="stock-scaler">
          <div class="stock-tray" id="stock-tray" aria-label="Kladky a závaží">
            <div class="stock-slot" id="stock-slot-fixed" data-slot="fixed">
              <span class="stock-slot__label">Pevná kladka</span>
              <div
            class="pulley pulley--fixed is-stock-template"
            id="stock-template-fixed"
            data-kind="fixed"
            role="img"
            aria-label="Pevná kladka — vytáhnout"
          >
            <svg
              width="276"
              height="315"
              viewBox="0 0 276 315"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M10.5898 176.404C10.5898 246.683 67.5605 303.654 137.839 303.654C208.118 303.654 265.089 246.683 265.089 176.404C265.089 106.125 208.118 49.1548 137.839 49.1548C67.5605 49.1548 10.5898 106.125 10.5898 176.404Z"
                fill="#F03B50"
              />
              <path
                d="M10.5898 176.404C10.5898 246.683 67.5605 303.654 137.839 303.654C208.118 303.654 265.089 246.683 265.089 176.404C265.089 106.125 208.118 49.1548 137.839 49.1548C67.5605 49.1548 10.5898 106.125 10.5898 176.404Z"
                stroke="#F03B50"
                stroke-width="21.18"
                stroke-miterlimit="10"
                stroke-linecap="round"
              />
              <g class="pulley-spin">
                <path
                  class="pulley-spin-mark"
                  d="M139.912 248.413V291.723"
                  stroke="white"
                  stroke-width="21.18"
                  stroke-miterlimit="10"
                  stroke-linecap="round"
                />
              </g>
              <path
                d="M96.3086 10.5898V174.982C96.3086 198.036 115 216.728 138.058 216.728C161.112 216.728 179.8 198.036 179.8 174.982V10.5898"
                fill="#1D1D1B"
              />
              <path
                d="M96.3086 10.5898V174.982C96.3086 198.036 115 216.728 138.058 216.728C161.112 216.728 179.8 198.036 179.8 174.982V10.5898"
                stroke="#1D1D1B"
                stroke-width="21.18"
                stroke-miterlimit="10"
                stroke-linecap="round"
              />
            </svg>
          </div>
            </div>
            <div class="stock-slot" id="stock-slot-free" data-slot="free">
              <span class="stock-slot__label">Volná kladka</span>
              <div
            class="pulley pulley--free is-stock-template"
            id="stock-template-free"
            data-kind="free"
            role="img"
            aria-label="Volná kladka — vytáhnout"
          >
            <svg
              width="282"
              height="434"
              viewBox="0 0 282 434"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15.2495 292.717C15.2495 223.382 71.4595 167.177 140.789 167.177C210.124 167.177 266.329 223.382 266.329 292.717C266.329 362.052 210.124 418.257 140.789 418.257C71.4595 418.257 15.2495 362.052 15.2495 292.717Z"
                fill="#58A1FF"
              />
              <path
                d="M15.2495 292.717C15.2495 223.382 71.4595 167.177 140.789 167.177C210.124 167.177 266.329 223.382 266.329 292.717C266.329 362.052 210.124 418.257 140.789 418.257C71.4595 418.257 15.2495 362.052 15.2495 292.717Z"
                stroke="#58A1FF"
                stroke-width="30.4992"
                stroke-miterlimit="10"
                stroke-linecap="round"
              />
              <g class="pulley-spin">
                <path
                  class="pulley-spin-mark"
                  d="M35.6485 287.364C35.6485 298.344 44.5492 307.249 55.534 307.249C66.5137 307.249 75.4194 298.344 75.4194 287.364C75.4194 276.379 66.5137 267.479 55.534 267.479C44.5492 267.479 35.6485 276.379 35.6485 287.364Z"
                  fill="white"
                />
              </g>
              <path
                d="M143.314 103.887L143.29 117.3L142.995 281.162"
                stroke="#1D1D1B"
                stroke-width="30.4992"
                stroke-miterlimit="10"
                stroke-linecap="round"
              />
            </svg>
          </div>
            </div>
            <div
              class="stock-slot stock-slot--weights"
              id="stock-slot-weights"
              data-slot="weights"
            >
              <span class="stock-slot__label">Závaží</span>
            </div>
            <div
              class="stock-slot stock-slot--winch"
              id="stock-slot-winch"
              data-slot="winch"
            >
              <span class="stock-slot__label">Naviják</span>
            </div>
          </div>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <p class="sim-empty-hint" id="hintEl">Přetáhni kladky a závaží na plochu.</p>
        <div class="workspace-hud" aria-label="Ovládání scény">
          <div class="workspace-hud__left">
            <button
              type="button"
              id="tool-run"
              class="action-btn workspace-hud__run"
              aria-pressed="false"
              aria-label="Spustit simulaci"
            >
              <span class="action-btn__icon workspace-hud__play" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5.14v13.72L19 12 8 5.14z"/>
                </svg>
              </span>
              <span class="action-btn__icon workspace-hud__edit" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="7" y="7" width="10" height="10" rx="1.5"/>
                </svg>
              </span>
              <span class="action-btn__label">Spustit</span>
            </button>
            <button
              type="button"
              id="tool-undo"
              class="action-btn workspace-hud__btn workspace-hud__undo"
              data-lab-only
              disabled
            >
              Zpět
            </button>
          </div>
          <div class="workspace-hud__right">
            <button
              type="button"
              id="tool-reset"
              class="action-btn action-btn--icon workspace-hud__btn workspace-hud__btn--reset"
              aria-label="Reset"
              disabled
            >
              <span class="action-btn__icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M4.5 8A7.5 7.5 0 1 1 4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M4.5 3.5V8h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="action-btn__label">Reset</span>
            </button>
            <button
              type="button"
              id="toggle-forces"
              class="action-btn action-btn--icon workspace-hud__btn"
              aria-pressed="false"
              aria-label="Síly"
            >
              <span class="action-btn__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 18V5" />
                  <path d="m3 8 3-3 3 3" />
                  <path d="M6 18h13" />
                  <path d="m16 15 3 3-3 3" />
                </svg>
              </span>
              <span class="action-btn__label">Síly</span>
            </button>
            <button
              type="button"
              id="toggle-lengths"
              class="action-btn action-btn--icon workspace-hud__btn"
              aria-pressed="false"
              aria-label="Délky"
            >
              <span class="action-btn__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7v10" />
                  <path d="M20 7v10" />
                  <path d="M4 12h16" />
                </svg>
              </span>
              <span class="action-btn__label">Délky</span>
            </button>
          </div>
        </div>
        <div id="stage" aria-label="Plocha s kladkami">
          <svg id="rope-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <div id="measure-overlay" aria-hidden="true"></div>
        </div>
        <div
          id="freehand-confirm"
          class="freehand-confirm"
          hidden
          role="group"
          aria-label="Potvrzení lana z tužky"
        >
          <button type="button" id="freehand-confirm-ok" class="action-btn action-btn--ok">
            Potvrdit
          </button>
          <button type="button" id="freehand-confirm-cancel" class="action-btn">
            Zrušit
          </button>
        </div>
        <div
          id="winch-overload-msg"
          class="winch-overload-msg"
          hidden
          aria-live="polite"
        >
          Příliš velká zátěž!
        </div>
      </div>
    </div>

    <div id="quiz-keypad-overlay" class="quiz-keypad-overlay" hidden>
      <div
        class="quiz-keypad-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="quiz-keypad-title"
      >
        <p id="quiz-keypad-title" class="quiz-keypad-panel__title">Velikost síly</p>
        <div
          id="quiz-keypad-display"
          class="quiz-keypad-panel__display"
          aria-live="polite"
        >
          <span id="quiz-keypad-display-value" class="quiz-keypad-panel__value"></span>
          <span class="quiz-keypad-panel__unit" aria-hidden="true">N</span>
        </div>
        <p id="quiz-keypad-error" class="quiz-keypad-panel__error" hidden></p>
        <div class="quiz-math-keypad" id="quiz-math-keypad" aria-label="Klávesnice">
          <div class="quiz-math-keypad__grid">
            <button class="quiz-math-keypad__key" type="button" data-value="7">7</button>
            <button class="quiz-math-keypad__key" type="button" data-value="8">8</button>
            <button class="quiz-math-keypad__key" type="button" data-value="9">9</button>
            <button class="quiz-math-keypad__key" type="button" data-value="4">4</button>
            <button class="quiz-math-keypad__key" type="button" data-value="5">5</button>
            <button class="quiz-math-keypad__key" type="button" data-value="6">6</button>
            <button class="quiz-math-keypad__key" type="button" data-value="1">1</button>
            <button class="quiz-math-keypad__key" type="button" data-value="2">2</button>
            <button class="quiz-math-keypad__key" type="button" data-value="3">3</button>
            <button class="quiz-math-keypad__key" type="button" data-value=",">,</button>
            <button class="quiz-math-keypad__key" type="button" data-value="0">0</button>
            <button
              class="quiz-math-keypad__key"
              type="button"
              data-action="clear"
              aria-label="Smazat vše"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                  d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="quiz-keypad-panel__actions">
          <button
            type="button"
            id="quiz-keypad-cancel"
            class="quiz-keypad-panel__action quiz-keypad-panel__cancel"
            aria-label="Zavřít bez uložení"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                d="M18 6L6 18M6 6l12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            type="button"
            id="quiz-keypad-confirm"
            class="quiz-keypad-panel__action quiz-keypad-panel__confirm"
            aria-label="Potvrdit hodnotu"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                d="M5 12.5l5 5L19 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="./app.js?v=run-stop-1"></script>
  </body>
</html>
