<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mereni_hmotnost — rovnoramenné váhy</title>
  <style>
    * { box-sizing: border-box; }
    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-Book.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-SemiBold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-SemiBold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    html {
      --ui-scale: 1.2;
      --canvas-bg: #ffffe6;
      --canvas-text: #334155;
      --bg: #ffffe6;
      --panel-bg: #2a3344;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #475569;
      --area-muted: #334155;
      --readout-bg: #1e293b;
      --success: #4ade80;
      --danger: #ef4444;
      background: var(--canvas-bg);
      font-family: "Fenomen Sans", system-ui, sans-serif;
    }
    /*
      +20 % přes transform na `.app-root`; výkonové pozice (`style.left/top`) řeší skript přes --ui-scale.
      Šířka layoutu / scale ⇒ vizuálně ~ zaplněné okno.
    */
    .app-root {
      transform: scale(var(--ui-scale));
      transform-origin: top center;
      width: calc(100% / var(--ui-scale));
      max-width: calc((100vw - 2rem) / var(--ui-scale));
      margin-inline: auto;
    }

    /*
      Bez min-height na výšku okna — dokument končí u obsahu, žádný umělý prázdný pás dole.
    */
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      padding-top: max(0.35rem, env(safe-area-inset-top, 0px));
      padding-bottom: calc(
        max(0.35rem, env(safe-area-inset-bottom, 0px)) + 2.5rem +
          (var(--ui-scale) - 1) * 28vmin
      );
      font-family: inherit;
      background: var(--canvas-bg);
      color: var(--canvas-text);
    }
    /*
      Bez align-self + width táhne sloupcový flex (main) šířku jen „ke obsahu“ —
      karta pak může být užší než obrázek vah a v náhledu/postranním panelu vypadá
      kresba jako oříznutá na půlku.
    */
    main {
      align-self: stretch;
      width: 100%;
      max-width: 100%;
      margin-inline: auto;
      margin-top: 24px;
      padding: 0.35rem 1.5rem 0.4rem;
      background: transparent;
      border-radius: 0;
      box-sizing: border-box;
    }
    .page-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: min(920px, 100%);
      margin: 0 auto 0.7rem;
    }
    .hub-back-to-sims {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--area-muted);
      color: var(--text);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .hub-back-to-sims:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--readout-bg);
    }
    .page-title {
      grid-column: 2;
      margin: 0;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--canvas-text);
      text-align: center;
    }
    .clear-weights-btn {
      appearance: none;
      font: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
    }
    .clear-weights-btn:hover {
      border-color: var(--accent);
    }
    .clear-weights-btn:active {
      transform: translateY(1px);
    }
    .clear-weights-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }
    .stage {
      position: relative;
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: min(920px, 100%);
      margin-inline: auto;
      touch-action: pan-y;
      padding-bottom: clamp(10px, 2.5vw, 20px);
      /*
        Symetrický okraj: stejně vlevo/vpravo, aby byl sloup vah uprostřed;
        hodnota pokrývá přesah jablka i zásobníku závaží.
      */
      padding-inline: clamp(96px, 22vw, 280px);
    }
    /*
      Geometrie vah a překryvy — `.scale-figure` je rámcová oblast kresby (pro %, drag, cíle).
      Paleta potravin je flex sloupec vlevo od kresby (`justify-content: space-between`).
    */
    .scale-wrap {
      position: relative;
      line-height: 0;
      max-width: min(720px, 100%);
    }
    .scale-figure {
      position: relative;
      line-height: 0;
    }
    .scale-art {
      position: relative;
      width: 100%;
      line-height: 0;
    }
    .scale-wrap .scale-layer {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }
    /* Přední okraj misky nad závažími na misce (klony mají z-index 6). Paleta vlevo má vyšší vrstvu. */
    .scale-layer--pan-rims {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      aspect-ratio: 360 / 376;
      height: auto;
      z-index: 7;
      pointer-events: none;
    }
    /* Pozice a velikost míst pro dopínání — počítá skript z geometrie rameně v jednotkách viewBoxu. */
    .pan-target--right,
    .pan-target--left {
      position: absolute;
      inset: auto;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
    }
    .pan-drag {
      position: absolute;
      cursor: grab;
      touch-action: none;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12));
      z-index: 6;
    }
    /* Nad zásobníkem závaží (z-index 10), jen dokud je kus ještě u paletě. */
    .food-palette .pan-drag:not(.on-left-pan):not(.on-right-pan) {
      z-index: 12;
    }
    .pan-drag:active { cursor: grabbing; }
    .pan-drag.is-dragging {
      z-index: 20;
      cursor: grabbing;
    }
    .apple--gfx { width: clamp(36px, 9vw, 58.5px); height: auto; }
    .rohlik--gfx { width: clamp(62.4px, 15.6vw, 98.4px); height: auto; }
    /* Zásobník: vzorky přebijí .pan-drag relativní pozicí v mřížce; klony mají jen .pan-drag → absolute. */
    .sklenice-okurek--gfx { width: clamp(48px, 12vw, 76px); height: auto; }
    .bonbon--gfx { width: clamp(28px, 7vw, 46px); height: auto; }
    .zlata-cihla--gfx { width: clamp(52px, 13vw, 84px); height: auto; }
    .weights-tray-wrap {
      position: absolute;
      left: calc(100% + 62px);
      top: 6%;
      width: max-content;
      max-width: calc((100vw - 2rem - 48px) / var(--ui-scale));
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      /* Nad .scale-layer--pan-rims (7), aby šlo závaží spolehlivě „chytit“ i při překryvu. */
      z-index: 10;
      pointer-events: none;
    }
    .weights-tray {
      width: max-content;
      max-width: 100%;
      display: grid;
      grid-template-columns: repeat(2, max-content);
      grid-auto-rows: max-content;
      align-items: end;
      justify-items: center;
      gap: 12px 18px;
      pointer-events: none;
    }
    .weights-tray-wrap .clear-weights-btn {
      pointer-events: auto;
      width: 100%;
      white-space: nowrap;
    }
    .weights-tray .weight {
      pointer-events: auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex: 0 0 auto;
    }
    .weights-tray .weight:not(.is-dragging) {
      position: relative;
      left: auto !important;
      top: auto !important;
      margin: 0;
    }
    .weight.on-right-pan,
    .weight.on-left-pan {
      position: absolute;
    }
    .weights-tray .weight svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Paleta: 5× 1fr; pevná šířka jako rohlík (ne max-content), jinak po odebrání řádku zúží. */
    .food-palette {
      position: absolute;
      right: 100%;
      margin-right: 50px;
      top: calc(clamp(4px, 1.5vmin, 16px) - 40px);
      bottom: clamp(4px, 1.5vmin, 16px);
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      align-items: center;
      justify-items: center;
      row-gap: clamp(8px, 2vmin, 18px);
      width: clamp(62.4px, 15.6vw, 98.4px);
      max-width: min(140px, 28vw);
      pointer-events: none;
      z-index: 12;
    }
    .food-palette__slot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      width: 100%;
    }
    /*
      Pevná min. výška řádků = výška grafiky při stejném clamp jako u img.
      Bez toho při přesunu prvku z palety zmizí obsah řádku → 1fr přepočítá
      výšky a ostatní ikony vertikálně „cuknou“.
    */
    .food-palette__slot:nth-child(1) {
      min-height: calc(clamp(36px, 9vw, 58.5px) * 68 / 65);
    }
    .food-palette__slot:nth-child(2) {
      min-height: calc(clamp(62.4px, 15.6vw, 98.4px) * 118 / 156);
    }
    .food-palette__slot:nth-child(3) {
      min-height: calc(clamp(48px, 12vw, 76px) * 106 / 78);
    }
    .food-palette__slot:nth-child(4) {
      min-height: calc(clamp(28px, 7vw, 46px) * 36 / 87);
    }
    .food-palette__slot:nth-child(5) {
      min-height: calc(clamp(52px, 13vw, 84px) * 99 / 174);
    }
    /* Drží místo přesně za staženou potravinu během pointer tažení (viz skript). */
    .food-palette__layout-holder {
      flex-shrink: 0;
      box-sizing: border-box;
      pointer-events: none;
      visibility: hidden;
    }
    .food-palette .pan-drag {
      pointer-events: auto;
      flex-shrink: 0;
    }
    .food-palette .pan-drag:not(.on-left-pan):not(.on-right-pan):not(.is-dragging) {
      position: relative;
      left: auto !important;
      top: auto !important;
      right: auto !important;
      bottom: auto !important;
    }
    .food-palette .rohlik.pan-drag:not(.on-left-pan):not(.on-right-pan):not(.is-dragging) {
      top: -10px !important;
    }
    /* Trojice pod váhami — rozvržení jako SVG 498×34 (3×143 + mezery). */
    .mass-verify {
      margin-top: 0.4rem;
      width: 100%;
      max-width: 498px;
      margin-inline: auto;
      display: flex;
      align-items: stretch;
      gap: clamp(8px, 3.5vw, 28px);
    }
    .mass-verify-panel {
      flex: 1 1 0;
      min-width: 0;
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .mass-verify-panel.mass-verify-panel--correct {
      border-color: var(--success);
      background-color: rgba(74, 222, 128, 0.16);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
    }
    .mass-verify-panel.mass-verify-panel--wrong {
      border-color: var(--danger);
      background-color: rgba(239, 68, 68, 0.18);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
    }
    .mass-verify-object-readout {
      width: 100%;
      margin: 0;
      padding: 4px 4px;
      text-align: center;
      font: inherit;
      color: inherit;
      user-select: none;
    }
    .mass-verify-input-wrap {
      display: grid;
      grid-template-columns: 1fr auto auto 1fr;
      align-items: center;
      width: 100%;
      min-width: 0;
      column-gap: 0.25em;
    }
    .mass-verify-input-wrap .mass-verify-input {
      grid-column: 2;
      width: auto;
      min-width: 9ch;
      max-width: min(24ch, 50vw);
      justify-self: end;
      text-align: right;
    }
    .mass-verify-input-wrap .mass-verify-input:placeholder-shown {
      padding-inline-end: 0.55em;
    }
    .mass-verify-input-wrap .mass-verify-unit {
      grid-column: 3;
      justify-self: start;
      padding: 4px 0;
      font: inherit;
      color: var(--muted);
      user-select: none;
    }
    .mass-verify-input {
      width: 100%;
      margin: 0;
      padding: 4px 4px;
      border: none;
      background: transparent;
      font: inherit;
      color: inherit;
      outline: none;
    }
    .mass-verify-input::placeholder {
      color: var(--muted);
      opacity: 1;
    }
    .mass-verify-input::-webkit-outer-spin-button,
    .mass-verify-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .mass-verify-input[type="number"] {
      appearance: textfield;
    }
    .mass-verify-input.app-numeric-input[readonly] {
      cursor: pointer;
    }

    .table-keypad-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.55);
    }

    .table-keypad-overlay[hidden] {
      display: none !important;
    }

    .table-keypad-panel {
      width: min(100%, 300px);
      padding: 16px;
      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      box-shadow: 0 14px 42px rgba(15, 23, 42, 0.35);
      display: grid;
      gap: 12px;
    }

    .table-keypad-panel__title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 650;
      color: var(--muted);
      text-align: center;
    }

    .table-keypad-panel__display {
      box-sizing: border-box;
      height: 64px;
      min-height: 64px;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--readout-bg);
      font-size: 1.5rem;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .table-keypad-panel__display.is-invalid {
      border-color: var(--danger);
      color: var(--danger);
    }

    .table-keypad-panel__error {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 650;
      color: var(--danger);
      text-align: center;
    }

    .table-keypad-panel__error[hidden] {
      display: none !important;
    }

    .table-keypad-panel__actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .table-keypad-panel__action {
      appearance: none;
      -webkit-appearance: none;
      box-sizing: border-box;
      width: 56px;
      height: 56px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .table-keypad-panel__action svg {
      display: block;
      flex-shrink: 0;
    }

    .table-keypad-panel__confirm {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    .table-keypad-panel__cancel {
      background: var(--readout-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .table-keypad-panel__action:hover {
      filter: brightness(1.05);
    }

    .table-keypad-panel__cancel:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .table-keypad-panel__action:active {
      transform: scale(0.97);
    }

    .table-math-keypad {
      width: 100%;
    }

    .table-math-keypad__grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .table-math-keypad__key {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--readout-bg);
      color: var(--text);
      font: inherit;
      font-size: 1.125rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .table-math-keypad__key svg {
      display: block;
      flex-shrink: 0;
    }

    .table-math-keypad__key:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--area-muted);
    }

    .table-math-keypad__key:active:not(:disabled) {
      background: rgba(59, 130, 246, 0.12);
    }

    .table-math-keypad__key:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .mass-verify-result {
      margin-top: 0.4rem;
      max-width: 498px;
      margin-inline: auto;
      font-size: 0.875rem;
      text-align: center;
      line-height: 1.35;
      min-height: 1.35em;
    }
    .mass-verify-result[data-status="ok"] {
      color: var(--success);
    }
    .mass-verify-result[data-status="wrong"],
    .mass-verify-result[data-status="error"] {
      color: var(--danger);
    }
    @media (max-width: 760px) {
      main {
        margin-top: 12px;
        padding: 0.35rem 0.8rem 0.4rem;
      }
      .page-top {
        align-items: flex-start;
      }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app-root">
    <main>
    <header class="page-top">
      <a href="../index.html" class="hub-back-to-sims">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Zpět
      </a>
      <h1 class="page-title">Měření hmotnosti</h1>
    </header>
    <div class="stage" id="stage" aria-label="Pracovní plocha s váhami">
      <div class="scale-wrap">
        <div class="scale-figure" id="scaleFigure">
          <div class="food-palette" id="foodPalette" aria-label="Potraviny na paletě">
            <div class="food-palette__slot">
        <img
          class="apple apple--gfx pan-drag"
          id="apple"
          src="assets/jablko.svg"
          alt="Jablko 112,84 g"
          width="65"
          height="68"
          draggable="false"
        />
            </div>
            <div class="food-palette__slot">
        <img
          class="rohlik rohlik--gfx pan-drag"
          id="rohlik"
          src="assets/rohlik.svg"
          alt="Rohlík 41,42 g"
          width="156"
          height="118"
          draggable="false"
        />
            </div>
            <div class="food-palette__slot">
        <img
          class="sklenice-okurek sklenice-okurek--gfx pan-drag"
          id="skleniceOkurek"
          src="assets/sklenice_okurek.svg"
          alt="Sklenice okurek 687 g"
          width="78"
          height="106"
          draggable="false"
        />
            </div>
            <div class="food-palette__slot">
        <img
          class="bonbon bonbon--gfx pan-drag"
          id="bonbon"
          src="assets/bonbon.svg"
          alt="Bonbón 2,9 g"
          width="87"
          height="36"
          draggable="false"
        />
            </div>
            <div class="food-palette__slot">
        <img
          class="zlata-cihla zlata-cihla--gfx pan-drag"
          id="zlataCihla"
          src="assets/zlata_cihla.svg"
          alt="Zlatá cihla 1322 g"
          width="174"
          height="99"
          draggable="false"
        />
            </div>
          </div>
        <div class="scale-art">
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="376" viewBox="0 0 160 167" fill="none" class="scale scale-layer" role="img" aria-label="Rovnoramenné váhy">
<defs><clipPath id="clip_scale_dyn"><rect width="160" height="166.9" fill="white"/></clipPath></defs>

  <script>
    (function () {
      const stage = document.getElementById("stage");
      const panLeft = document.getElementById("panLeft");
      const panRight = document.getElementById("panRight");
      const apple = document.getElementById("apple");
      const rohlik = document.getElementById("rohlik");
      const skleniceOkurek = document.getElementById("skleniceOkurek");
      const bonbon = document.getElementById("bonbon");
      const zlataCihla = document.getElementById("zlataCihla");
      const weightsTray = document.getElementById("weightsTray");
      /** Jednorázové potraviny z palety (ne klony závaží). */
      const PAN_FOOD_ELS = [apple, rohlik, skleniceOkurek, bonbon, zlataCihla];
      const scaleWrap = stage.querySelector(".scale-wrap");
      const scaleFigure = document.getElementById("scaleFigure");
      const foodPalette = document.getElementById("foodPalette");
      const beamGroup = document.getElementById("scale-beam");
      const beamGroupRims = document.getElementById("scale-beam-rims");
      const panRightCounter = document.getElementById("pan-right-counter");
      const panLeftCounter = document.getElementById("pan-left-counter");
      const panRightCounterRims = document.getElementById(
        "pan-right-counter-rims"
      );
      const panLeftCounterRims = document.getElementById(
        "pan-left-counter-rims"
      );
      const panRightRoot = document.getElementById("pan-right-root");
      const panLeftRoot = document.getElementById("pan-left-root");
      const panRightRootRims = document.getElementById("pan-right-root-rims");
      const panLeftRootRims = document.getElementById("pan-left-root-rims");
      const panContactRightEl = document.getElementById("pan-right-contact");
      const panContactLeftEl = document.getElementById("pan-left-contact");
      let drag = null;
      /** Nezbytný prostor v řádku palety během tažení, aby ostatní ikony nerefakovaly. */
      let foodPaletteLayoutHolder = null;

      /** Hmotnost jablka [g] — vstup do modelu vah. */
      const APPLE_MASS_G = 112.84;
      /** Hmotnost rohlíku [g]. */
      const ROHLIK_MASS_G = 41.42;
      /** Hmotnost sklenice okurek [g]. */
      const SKLENICE_OKUREK_MASS_G = 687;
      /** Hmotnost bonbónu [g]. */
      const BONBON_MASS_G = 2.9;
      /** Hmotnost zlaté cihly [g]. */
      const ZLATA_CIHLA_MASS_G = 1322;

      /** Sada závaží [g]; velikost vizuálně ~ ∛(m/1000) jako u stejnorodého tělesa. */
      const WEIGHT_SET_G = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
      const WEIGHT_VIEW_ASPECT = 85 / 71;

      let weights = []; /** Pouze vzory v `#weightsTray`; na misce jsou vždy jejich klony. */

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function weightTraySizePx(massG, wrapInnerWidth) {
        const t = Math.cbrt(massG / 1000);
        const minPx = Math.max(13, wrapInnerWidth * 0.042);
        const maxPx = Math.min(56, wrapInnerWidth * 0.165);
        const w = minPx + (maxPx - minPx) * t;
        return { w: Math.round(w), h: Math.round(w * WEIGHT_VIEW_ASPECT) };
      }

      function createWeightElement(massG) {
        const el = document.createElement("div");
        el.className = "weight pan-drag";
        el.dataset.massG = String(massG);
        el.setAttribute("role", "img");
        el.setAttribute(
          "aria-label",
          massG >= 1000 ? "Závaží 1 kg" : `Závaží ${massG} g`
        );
        const label = massG >= 1000 ? "1 kg" : `${massG} g`;
        const fs =
          massG >= 1000 ? 21 : massG >= 100 ? 18 : massG >= 10 ? 20 : 21;
        el.innerHTML =
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71 85" width="100%" height="100%" aria-hidden="true">` +

          `<path d="M51 26C51 28.7614 44.0604 31 35.5 31C26.9396 31 20 28.7614 20 26C20 23.2386 26.9396 21 35.5 21C44.0604 21 51 23.2386 51 26Z" fill="black"/>` +
          `<ellipse cx="35.5" cy="76" rx="35.5" ry="9" fill="black"/>` +
          `<path d="M56.6972 1.97522H14.3028V12.6195H56.6972V1.97522Z" fill="black" stroke="black"/>` +
          `<ellipse cx="35.5" cy="1.97523" rx="21.5" ry="1.97523" fill="#6F6F6F"/>` +
          `<ellipse cx="35.5" cy="12.7293" rx="21.5" ry="1.97523" fill="black"/>` +
          `<path d="M29.5 18.5C30 17.5 29.5 14.5 29.5 14.5H41.5V18.5L48.5 24.5H22.5C22.5 24.5 29 19.5 29.5 18.5Z" fill="black" stroke="black"/>` +
          `<path d="M41.7222 14.5C41.7222 14.5 41.2222 17.5 41.7222 18.5C42.2222 19.5 49.7222 24.5 49.7222 24.5" stroke="black" fill="none"/>` +
          `<text x="35.5" y="59.5" text-anchor="middle" dominant-baseline="central" font-family="Fenomen Sans, system-ui, sans-serif" font-weight="600" fill="white" font-size="${fs}">${escapeHtml(
            label
          )}</text>` +
          `</svg>`;
        return el;
      }

      WEIGHT_SET_G.forEach((g) =>
        weightsTray.appendChild(createWeightElement(g))
      );
      weights = Array.from(weightsTray.querySelectorAll(".weight"));

      /** Souřadnice viewBoxu 160×167; rameno se otáčí kolem BEAM_PIVOT. */
      const VB_W = 160;
      const VB_H = 167;
      const BEAM_PIVOT = { x: 80.94, y: 46.02 };
      /** Úchyt řetězu na rameni (stejně jako ve SVG); pozice dna misky se měří přes `#pan-*-contact`. */
      const HOOK_LEFT = { x: 26.043, y: 46.11 };
      const HOOK_RIGHT = { x: 134.955, y: 45.95 };
      const PAN_TARGET_W_PCT = 28;
      const PAN_TARGET_H_PCT = 43;
      /** Posun misek dolů v pixelech (relativně k výšce měřítka → převod do viewBoxu). */
      const PAN_OFFSET_DOWN_PX = 20;
      /** Drobný posun kvůli průhlednému okraji ve spritech (px). */
      const PAN_ITEM_SURFACE_PAD_PX = 2;
      /** Rohlík má v SVG spodní „vzduch“ — na misce ho posuneme o to níž. */
      const ROHLIK_SURFACE_EXTRA_PAD_PX = 8;
      /** Pixely vůči `.scale-wrap`: střed a spodek skrytého kontaktu v misce (stejný řetěz transformací jako kresba). */
      function panSurfaceWrapPx(which) {
        const wr = wrapRect();
        const node =
          which === "left" ? panContactLeftEl : panContactRightEl;
        const bb = node.getBoundingClientRect();
        return {
          cx: (bb.left + bb.right) / 2 - wr.left,
          cy: (bb.top + bb.bottom) / 2 - wr.top,
          bottom: bb.bottom - wr.top,
        };
      }

      function layoutPanTargetsDeg() {
        const wr = wrapRect();
        function applyPan(el, which) {
          const s = panSurfaceWrapPx(which);
          el.style.left = `${(s.cx / wr.width) * 100 - PAN_TARGET_W_PCT / 2}%`;
          el.style.top = `${(s.cy / wr.height) * 100 - PAN_TARGET_H_PCT / 2}%`;
          el.style.width = `${PAN_TARGET_W_PCT}%`;
          el.style.height = `${PAN_TARGET_H_PCT}%`;
        }
        applyPan(panLeft, "left");
        applyPan(panRight, "right");
      }

      /** Laboratorní rovnoramenné váhy — odezva úhlu od Δm (kladný úhel = levá strana dolů). */
      const SCALE_DEAD_ZONE_G = 0.25;
      const SCALE_TANH_DIVISOR_G = 35;
      const SCALE_MAX_ANGLE_DEG = 18;
      /** Pružina + tlumení (úhel ve °, čas v s); mírně podkritické kvůli krátkému překmitnutí. */
      const SCALE_SPRING_STIFFNESS = 46;
      const SCALE_SPRING_DAMPING = 12.5;

      let displayTiltDeg = 0;
      let tiltVelDegPerSec = 0;
      let tiltAnimRaf = null;
      let tiltAnimLastTs = 0;

      function wrapRect() {
        return scaleFigure.getBoundingClientRect();
      }

      /** Viewport px → layout px pro `style.left/top` při `transform: scale(--ui-scale)` na předkovi. */
      function dragLayoutFactor() {
        const raw = getComputedStyle(document.documentElement)
          .getPropertyValue("--ui-scale")
          .trim();
        const n = parseFloat(raw);
        return Number.isFinite(n) && n > 0 ? n : 1;
      }

      function viewportOffsetToLayoutPx(vPx) {
        return vPx / dragLayoutFactor();
      }

      /** Rozměry vykresleného `<svg>` (pro zásobník závaží apod.). */
      function svgLayerBoundingRect() {
        return scaleFigure
          .querySelector("svg.scale-layer:not(.scale-layer--pan-rims)")
          .getBoundingClientRect();
      }

      /** Po přesunu závaží do `.scale-wrap` při tahu je CB měřítko → offset 0; z palety ještě ne přesunuto → offset palety. */
      function dragContainOriginInWrapPx(el) {
        if (!weightsTray.contains(el)) return { ox: 0, oy: 0 };
        const wr = wrapRect();
        const tr = weightsTray.getBoundingClientRect();
        return { ox: tr.left - wr.left, oy: tr.top - wr.top };
      }

      /** Rozměry vzorků v zásobníku (`weights` = jen řádky v `#weightsTray`). */
      function applyTrayWeightSizes() {
        const sr = svgLayerBoundingRect();
        if (sr.width <= 0) return;
        const innerLayW = viewportOffsetToLayoutPx(sr.width);
        weights.forEach((el) => {
          const g = Number(el.dataset.massG);
          const { w, h } = weightTraySizePx(g, innerLayW);
          el.style.width = `${w}px`;
          el.style.height = `${h}px`;
        });
      }

      function panHookYOffsetViewBox() {
        const sr = svgLayerBoundingRect();
        const h = viewportOffsetToLayoutPx(sr.height);
        if (h <= 0) return 0;
        return (PAN_OFFSET_DOWN_PX / h) * VB_H;
      }

      function clamp(n, min, max) {
        return Math.min(Math.max(n, min), max);
      }

      /** Ořízne pozici táhnutého prvku k obdéžníku `<main>` (layout px vůči `.scale-figure`). */
      function clampDragIntoBounds(left, top, wL, hL) {
        const wr = wrapRect();
        const f = dragLayoutFactor();
        const boundsRoot = stage.closest("main") || stage;
        const sr = boundsRoot.getBoundingClientRect();
        const m = 4;
        const sL = (sr.left - wr.left) / f;
        const sR = (sr.right - wr.left) / f;
        const sT = (sr.top - wr.top) / f;
        const sB = (sr.bottom - wr.top) / f;
        const loX = Math.min(sL + m, sR - wL - m);
        const hiX = Math.max(sL + m, sR - wL - m);
        const loY = Math.min(sT + m, sB - hL - m);
        const hiY = Math.max(sT + m, sB - hL - m);
        return {
          left: clamp(left, loX, hiX),
          top: clamp(top, loY, hiY),
        };
      }

      function setPositionPx(el, left, top) {
        el.style.left = `${left}px`;
        el.style.top = `${top}px`;
        el.style.right = "auto";
        el.style.bottom = "auto";
        el.style.margin = "0";
      }

      function elementSize(el) {
        const r = el.getBoundingClientRect();
        return { w: r.width, h: r.height };
      }

      function intersects(a, b) {
        return !(
          a.right < b.left ||
          a.left > b.right ||
          a.bottom < b.top ||
          a.top > b.bottom
        );
      }

      function strictPanRect(panEl) {
        const pr = panEl.getBoundingClientRect();
        return {
          left: pr.left,
          right: pr.right,
          top: pr.top,
          bottom: pr.bottom,
        };
      }

      /** Hranice snappable zóny v pixelech vůči `.scale-wrap`. */
      function panTargetBoundsWrapPx(panEl) {
        const pr = panEl.getBoundingClientRect();
        const wr = wrapRect();
        return {
          left: pr.left - wr.left,
          right: pr.right - wr.left,
          top: pr.top - wr.top,
          bottom: pr.bottom - wr.top,
        };
      }

      /** Horizontální odchylka středu prvku od středu kontaktu v misce (px ve wrapu). */
      function syncPanPlaceOffsetFromElement(el, which) {
        const surf = panSurfaceWrapPx(which);
        const wr = wrapRect();
        const ir = el.getBoundingClientRect();
        const cxEl = (ir.left + ir.right) / 2 - wr.left;
        el.dataset.panPlaceOffsetX = String(
          viewportOffsetToLayoutPx(cxEl - surf.cx)
        );
      }

      function pickSnapPan(ir, releaseClientX, releaseClientY) {
        const onLeft = shouldSnapOntoPan(
          panLeft,
          ir,
          releaseClientX,
          releaseClientY
        );
        const onRight = shouldSnapOntoPan(
          panRight,
          ir,
          releaseClientX,
          releaseClientY
        );
        if (!onLeft && !onRight) return null;
        if (onLeft && !onRight) return "left";
        if (!onLeft && onRight) return "right";
        const wr = wrapRect();
        const icx = (ir.left + ir.right) / 2 - wr.left;
        const icy = (ir.top + ir.bottom) / 2 - wr.top;
        const lc = panSurfaceWrapPx("left");
        const rc = panSurfaceWrapPx("right");
        const dl = (icx - lc.cx) ** 2 + (icy - lc.cy) ** 2;
        const dr = (icx - rc.cx) ** 2 + (icy - rc.cy) ** 2;
        return dl <= dr ? "left" : "right";
      }

      const SNAP_PAD_PX = 6;

      function shouldSnapOntoPan(panEl, itemRect, releaseClientX, releaseClientY) {
        const strict = strictPanRect(panEl);
        if (intersects(itemRect, strict)) return true;
        const cx = (itemRect.left + itemRect.right) / 2;
        const cy = (itemRect.top + itemRect.bottom) / 2;
        if (cx >= strict.left && cx <= strict.right && cy >= strict.top && cy <= strict.bottom)
          return true;

        const p = SNAP_PAD_PX;
        const loose = {
          left: strict.left - p,
          right: strict.right + p,
          top: strict.top - p,
          bottom: strict.bottom + p,
        };
        if (!intersects(itemRect, loose)) return false;
        const pin =
          releaseClientX >= loose.left &&
          releaseClientX <= loose.right &&
          releaseClientY >= loose.top &&
          releaseClientY <= loose.bottom;
        return pin;
      }

      function isFullyOffPan(panEl, itemRect) {
        const strict = strictPanRect(panEl);
        return (
          itemRect.right < strict.left ||
          itemRect.left > strict.right ||
          itemRect.bottom < strict.top ||
          itemRect.top > strict.bottom
        );
      }

      /** Klony závaží z misek zmizí, když je uživatel pustí nad zásobníkem. */
      function shouldReturnWeightToTray(itemRect, releaseClientX, releaseClientY) {
        const tr = weightsTray.getBoundingClientRect();
        if (tr.width <= 0 && tr.height <= 0) return false;
        if (intersects(itemRect, tr)) return true;
        const p = SNAP_PAD_PX;
        const loose = {
          left: tr.left - p,
          right: tr.right + p,
          top: tr.top - p,
          bottom: tr.bottom + p,
        };
        return (
          releaseClientX >= loose.left &&
          releaseClientX <= loose.right &&
          releaseClientY >= loose.top &&
          releaseClientY <= loose.bottom
        );
      }

      function massLeftG() {
        let m = 0;
        if (apple.classList.contains("on-left-pan")) m += APPLE_MASS_G;
        if (rohlik.classList.contains("on-left-pan")) m += ROHLIK_MASS_G;
        if (skleniceOkurek.classList.contains("on-left-pan"))
          m += SKLENICE_OKUREK_MASS_G;
        if (bonbon.classList.contains("on-left-pan")) m += BONBON_MASS_G;
        if (zlataCihla.classList.contains("on-left-pan"))
          m += ZLATA_CIHLA_MASS_G;
        scaleWrap.querySelectorAll(".weight.on-left-pan").forEach((el) => {
          m += Number(el.dataset.massG);
        });
        return m;
      }

      function massRightG() {
        let m = 0;
        if (apple.classList.contains("on-right-pan")) m += APPLE_MASS_G;
        if (rohlik.classList.contains("on-right-pan")) m += ROHLIK_MASS_G;
        if (skleniceOkurek.classList.contains("on-right-pan"))
          m += SKLENICE_OKUREK_MASS_G;
        if (bonbon.classList.contains("on-right-pan")) m += BONBON_MASS_G;
        if (zlataCihla.classList.contains("on-right-pan"))
          m += ZLATA_CIHLA_MASS_G;
        scaleWrap.querySelectorAll(".weight.on-right-pan").forEach((el) => {
          m += Number(el.dataset.massG);
        });
        return m;
      }

      function repositionWeightsOnPan(which) {
        const f = dragLayoutFactor();
        const surfV = panSurfaceWrapPx(which);
        const surf = {
          cx: surfV.cx / f,
          cy: surfV.cy / f,
          bottom: surfV.bottom / f,
        };
        const panEl = which === "left" ? panLeft : panRight;
        const boundsV = panTargetBoundsWrapPx(panEl);
        const bounds = {
          left: boundsV.left / f,
          right: boundsV.right / f,
          top: boundsV.top / f,
          bottom: boundsV.bottom / f,
        };
        const edgePad = 2;
        const sel =
          which === "left" ? ".weight.on-left-pan" : ".weight.on-right-pan";
        scaleWrap.querySelectorAll(sel).forEach((el) => {
          if (el.classList.contains("is-dragging")) return;
          const { w, h } = elementSize(el);
          const wL = w / f;
          const hL = h / f;
          const offsetX = Number(el.dataset.panPlaceOffsetX || 0);
          let left = surf.cx - wL / 2 + offsetX;
          const lo = bounds.left + edgePad;
          const hi = bounds.right - wL - edgePad;
          if (hi >= lo) left = clamp(left, lo, hi);
          else left = (lo + hi) / 2;
          const top = surf.bottom - hL + PAN_ITEM_SURFACE_PAD_PX;
          setPositionPx(el, left, top);
        });
      }

      function repositionFoodImgOnPan(el) {
        if (
          !el ||
          el.classList.contains("is-dragging") ||
          (!el.classList.contains("on-left-pan") &&
            !el.classList.contains("on-right-pan"))
        )
          return;
        const f = dragLayoutFactor();
        const which = el.classList.contains("on-left-pan") ? "left" : "right";
        const surfV = panSurfaceWrapPx(which);
        const surf = {
          cx: surfV.cx / f,
          cy: surfV.cy / f,
          bottom: surfV.bottom / f,
        };
        const panEl = which === "left" ? panLeft : panRight;
        const boundsV = panTargetBoundsWrapPx(panEl);
        const bounds = {
          left: boundsV.left / f,
          right: boundsV.right / f,
          top: boundsV.top / f,
          bottom: boundsV.bottom / f,
        };
        const edgePad = 2;
        const { w, h } = elementSize(el);
        const wL = w / f;
        const hL = h / f;
        const offsetX = Number(el.dataset.panPlaceOffsetX || 0);
        let left = surf.cx - wL / 2 + offsetX;
        const lo = bounds.left + edgePad;
        const hi = bounds.right - wL - edgePad;
        if (hi >= lo) left = clamp(left, lo, hi);
        else left = (lo + hi) / 2;
        const surfacePad =
          PAN_ITEM_SURFACE_PAD_PX +
          (el === rohlik ? ROHLIK_SURFACE_EXTRA_PAD_PX : 0);
        const top = surf.bottom - hL + surfacePad;
        setPositionPx(el, left, top);
      }

      function repositionAllOnPanItems() {
        repositionWeightsOnPan("left");
        repositionWeightsOnPan("right");
        PAN_FOOD_ELS.forEach(repositionFoodImgOnPan);
      }

      let overlayLayoutRaf = null;
      function schedulePanOverlayLayout() {
        if (overlayLayoutRaf != null) cancelAnimationFrame(overlayLayoutRaf);
        overlayLayoutRaf = requestAnimationFrame(() => {
          overlayLayoutRaf = null;
          layoutPanTargetsDeg();
          repositionAllOnPanItems();
        });
      }

      /** delta = levá − pravá [g]; kladný úhel uživatele = levá miska dolů. SVG používá tiltSvg = −úhelUživatele. */
      function targetAngleUserDeg() {
        const delta = massLeftG() - massRightG();
        if (Math.abs(delta) < SCALE_DEAD_ZONE_G) return 0;
        return clamp(
          SCALE_MAX_ANGLE_DEG * Math.tanh(delta / SCALE_TANH_DIVISOR_G),
          -SCALE_MAX_ANGLE_DEG,
          SCALE_MAX_ANGLE_DEG
        );
      }

      function targetTiltDegSvg() {
        return -targetAngleUserDeg();
      }

      function applyTiltVisual(tiltDeg) {
        if (!beamGroup) return;
        const delta = massLeftG() - massRightG();
        scaleWrap.dataset.deltaMassG = delta.toFixed(2);
        scaleWrap.dataset.angleTargetUserDeg = targetAngleUserDeg().toFixed(3);
        scaleWrap.dataset.tiltDeg = tiltDeg.toFixed(4);

        const beamTf = `rotate(${tiltDeg} ${BEAM_PIVOT.x} ${BEAM_PIVOT.y})`;
        beamGroup.setAttribute("transform", beamTf);
        if (beamGroupRims) beamGroupRims.setAttribute("transform", beamTf);
        const counterRot = `${-tiltDeg}`;
        if (panRightCounter) {
          panRightCounter.setAttribute("transform", `rotate(${counterRot})`);
        }
        if (panLeftCounter) {
          panLeftCounter.setAttribute("transform", `rotate(${counterRot})`);
        }
        if (panRightCounterRims) {
          panRightCounterRims.setAttribute(
            "transform",
            `rotate(${counterRot})`
          );
        }
        if (panLeftCounterRims) {
          panLeftCounterRims.setAttribute(
            "transform",
            `rotate(${counterRot})`
          );
        }
        const hookDy = panHookYOffsetViewBox();
        if (panRightRoot) {
          panRightRoot.setAttribute(
            "transform",
            `translate(${HOOK_RIGHT.x} ${HOOK_RIGHT.y + hookDy})`
          );
        }
        if (panLeftRoot) {
          panLeftRoot.setAttribute(
            "transform",
            `translate(${HOOK_LEFT.x} ${HOOK_LEFT.y + hookDy})`
          );
        }
        if (panRightRootRims) {
          panRightRootRims.setAttribute(
            "transform",
            `translate(${HOOK_RIGHT.x} ${HOOK_RIGHT.y + hookDy})`
          );
        }
        if (panLeftRootRims) {
          panLeftRootRims.setAttribute(
            "transform",
            `translate(${HOOK_LEFT.x} ${HOOK_LEFT.y + hookDy})`
          );
        }
        schedulePanOverlayLayout();
      }

      function tiltSpringTick(ts) {
        if (!beamGroup) {
          tiltAnimRaf = null;
          tiltAnimLastTs = 0;
          return;
        }
        if (!tiltAnimLastTs) tiltAnimLastTs = ts;
        let dt = (ts - tiltAnimLastTs) / 1000;
        tiltAnimLastTs = ts;
        dt = clamp(dt, 0.001, 0.064);

        const target = targetTiltDegSvg();
        const err = target - displayTiltDeg;
        tiltVelDegPerSec +=
          SCALE_SPRING_STIFFNESS * err * dt -
          SCALE_SPRING_DAMPING * tiltVelDegPerSec * dt;
        displayTiltDeg += tiltVelDegPerSec * dt;

        applyTiltVisual(displayTiltDeg);

        const settled =
          Math.abs(target - displayTiltDeg) < 0.02 &&
          Math.abs(tiltVelDegPerSec) < 0.03;
        if (settled) {
          displayTiltDeg = target;
          tiltVelDegPerSec = 0;
          applyTiltVisual(displayTiltDeg);
          tiltAnimRaf = null;
          tiltAnimLastTs = 0;
          return;
        }
        tiltAnimRaf = requestAnimationFrame(tiltSpringTick);
      }

      function syncTiltGraphic() {
        if (!beamGroup) return;
        if (
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          if (tiltAnimRaf) cancelAnimationFrame(tiltAnimRaf);
          tiltAnimRaf = null;
          tiltAnimLastTs = 0;
          displayTiltDeg = targetTiltDegSvg();
          tiltVelDegPerSec = 0;
          applyTiltVisual(displayTiltDeg);
          return;
        }
        if (!tiltAnimRaf) {
          tiltAnimLastTs = 0;
          tiltAnimRaf = requestAnimationFrame(tiltSpringTick);
        }
      }

      function snapOntoPan(el, side) {
        el.classList.remove("on-left-pan", "on-right-pan");
        el.classList.add(side === "left" ? "on-left-pan" : "on-right-pan");
        syncPanPlaceOffsetFromElement(el, side);
        syncTiltGraphic();
      }

      function updateScaleAppearance() {
        syncTiltGraphic();
      }

      const clearWeightsBtn = document.getElementById("clear-weights-btn");

      function updateClearWeightsButtonState() {
        if (!clearWeightsBtn) return;
        const n = scaleWrap.querySelectorAll(
          ".weight.on-left-pan, .weight.on-right-pan"
        ).length;
        clearWeightsBtn.disabled = n === 0;
      }

      function removeAllWeightsFromPans() {
        scaleWrap
          .querySelectorAll(".weight.on-left-pan, .weight.on-right-pan")
          .forEach((el) => {
            el.remove();
          });
        layoutPanTargetsDeg();
        repositionAllOnPanItems();
        updateClearWeightsButtonState();
        updateScaleAppearance();
      }

      if (clearWeightsBtn) {
        clearWeightsBtn.addEventListener("click", removeAllWeightsFromPans);
      }

      const DRAG_WINDOW_OPTS = { capture: true, passive: false };

      function detachWindowDragListeners() {
        window.removeEventListener("pointermove", onPointerMove, DRAG_WINDOW_OPTS);
        window.removeEventListener("pointerup", onPointerUp, DRAG_WINDOW_OPTS);
        window.removeEventListener(
          "pointercancel",
          onPointerUp,
          DRAG_WINDOW_OPTS
        );
      }

      function onPointerDown(e) {
        const src = e.target.closest(".pan-drag");
        if (!src) return;
        e.preventDefault();

        /* Měření před změnou DOM — po přesunu potraviny z palety je chvíli absolute bez left/top a rect by „skočil“. */
        const wr = wrapRect();
        const er = src.getBoundingClientRect();

        let el = src;
        if (weights.includes(src) && weightsTray.contains(src)) {
          el = src.cloneNode(true);
          el.classList.remove("is-dragging");
          scaleFigure.appendChild(el);
        } else if (PAN_FOOD_ELS.includes(el) && foodPalette.contains(el)) {
          const slot = el.closest(".food-palette__slot");
          const fDrag = dragLayoutFactor();
          foodPaletteLayoutHolder = document.createElement("div");
          foodPaletteLayoutHolder.className = "food-palette__layout-holder";
          foodPaletteLayoutHolder.setAttribute("aria-hidden", "true");
          foodPaletteLayoutHolder.style.width = `${er.width / fDrag}px`;
          foodPaletteLayoutHolder.style.height = `${er.height / fDrag}px`;
          slot.insertBefore(foodPaletteLayoutHolder, el);
          scaleFigure.appendChild(el);
        }

        if (PAN_FOOD_ELS.includes(el)) syncVerifyPanelFromFood(el);

        const { ox: cbOx, oy: cbOy } = dragContainOriginInWrapPx(el);
        el.classList.add("is-dragging");
        el.setPointerCapture(e.pointerId);
        drag = {
          el,
          pid: e.pointerId,
          grabDX: e.clientX - er.left,
          grabDY: e.clientY - er.top,
          cbOx,
          cbOy,
        };
        setPositionPx(
          el,
          viewportOffsetToLayoutPx(er.left - wr.left - cbOx),
          viewportOffsetToLayoutPx(er.top - wr.top - cbOy)
        );

        window.addEventListener("pointermove", onPointerMove, DRAG_WINDOW_OPTS);
        window.addEventListener("pointerup", onPointerUp, DRAG_WINDOW_OPTS);
        window.addEventListener("pointercancel", onPointerUp, DRAG_WINDOW_OPTS);
      }

      function onPointerMove(e) {
        if (!drag || e.pointerId !== drag.pid) return;
        e.preventDefault();
        const f = dragLayoutFactor();
        const wr = wrapRect();
        const el = drag.el;
        const { w, h } = elementSize(el);
        const wL = w / f;
        const hL = h / f;
        let left = (e.clientX - wr.left - drag.grabDX - drag.cbOx) / f;
        let top = (e.clientY - wr.top - drag.grabDY - drag.cbOy) / f;
        const c = clampDragIntoBounds(left, top, wL, hL);
        setPositionPx(el, c.left, c.top);
      }

      function onPointerUp(e) {
        if (!drag || e.pointerId !== drag.pid) return;
        detachWindowDragListeners();
        const el = drag.el;
        try {
          el.releasePointerCapture(e.pointerId);
        } catch (_) { /* už uvolněno */ }
        el.classList.remove("is-dragging");
        drag = null;

        if (foodPaletteLayoutHolder) {
          foodPaletteLayoutHolder.remove();
          foodPaletteLayoutHolder = null;
        }

        const ir = el.getBoundingClientRect();
        const side = pickSnapPan(ir, e.clientX, e.clientY);

        if (side) {
          snapOntoPan(el, side);
        } else if (
          el.classList.contains("weight") &&
          !weightsTray.contains(el) &&
          shouldReturnWeightToTray(ir, e.clientX, e.clientY)
        ) {
          el.remove();
          layoutPanTargetsDeg();
          repositionAllOnPanItems();
          updateClearWeightsButtonState();
          updateScaleAppearance();
        } else {
          if (
            el.classList.contains("on-left-pan") &&
            isFullyOffPan(panLeft, ir)
          )
            el.classList.remove("on-left-pan");
          if (
            el.classList.contains("on-right-pan") &&
            isFullyOffPan(panRight, ir)
          )
            el.classList.remove("on-right-pan");
          updateScaleAppearance();
        }
        updateClearWeightsButtonState();
      }

      stage.addEventListener("pointerdown", onPointerDown, { passive: false });

      window.addEventListener(
        "resize",
        () => {
          applyTrayWeightSizes();
          applyTiltVisual(displayTiltDeg);
        },
        { passive: true }
      );

      /** Odhad hmotnosti z nabídky — shodné konstanty jako na váhou typu „správné“ řešení. */
      const VERIFY_TOLERANCE_G = 0.5;
      let verifySelectedObject = null;
      const verifyObjectLabel = document.getElementById("verify-object-label");
      const verifyMassInput = document.getElementById("verify-mass-input");
      const verifyMassResult = document.getElementById("verify-mass-result");
      const massVerifyPanels = Array.from(
        document.querySelectorAll(".mass-verify .mass-verify-panel")
      );

      function applyMassVerifyPanelClasses(clsName) {
        massVerifyPanels.forEach((panel) => {
          panel.classList.remove(
            "mass-verify-panel--correct",
            "mass-verify-panel--wrong"
          );
          if (clsName) panel.classList.add(clsName);
        });
      }

      function clearMassVerifyFeedback() {
        if (verifyMassResult) {
          verifyMassResult.textContent = "";
          verifyMassResult.removeAttribute("data-status");
        }
        applyMassVerifyPanelClasses(null);
      }

      function truthMassForVerification(which) {
        if (which === "rohlik") return ROHLIK_MASS_G;
        if (which === "skleniceOkurek") return SKLENICE_OKUREK_MASS_G;
        if (which === "bonbon") return BONBON_MASS_G;
        if (which === "zlataCihla") return ZLATA_CIHLA_MASS_G;
        return APPLE_MASS_G;
      }

      function parseUserGrams(raw) {
        const n = Number.parseFloat(
          String(raw).trim().replace(/\s/g, "").replace(",", ".")
        );
        return Number.isFinite(n) ? n : NaN;
      }

      function syncVerifyPanelFromFood(el) {
        if (!verifyObjectLabel || !PAN_FOOD_ELS.includes(el)) return;
        const rows = [
          [apple, "apple", "Jablko"],
          [rohlik, "rohlik", "Rohlík"],
          [skleniceOkurek, "skleniceOkurek", "Sklenice okurek"],
          [bonbon, "bonbon", "Bonbón"],
          [zlataCihla, "zlataCihla", "Zlatá cihla"],
        ];
        const hit = rows.find(([node]) => node === el);
        if (!hit) return;
        const [, nextKey, labelCs] = hit;
        if (nextKey !== verifySelectedObject) {
          if (verifyMassInput) verifyMassInput.value = "";
          clearMassVerifyFeedback();
        }
        verifySelectedObject = nextKey;
        verifyObjectLabel.textContent = labelCs;
      }

      function onVerifyMass() {
        if (!verifyMassResult) return;
        const g = verifyMassInput ? parseUserGrams(verifyMassInput.value) : NaN;
        if (!verifySelectedObject) {
          applyMassVerifyPanelClasses("mass-verify-panel--wrong");
          verifyMassResult.dataset.status = "error";
          verifyMassResult.textContent =
            "Nejdřív klikni na jablko, rohlík, sklenici okurek, bonbón nebo zlatou cihlu (nebo jej přesuň).";
          return;
        }
        if (!Number.isFinite(g)) {
          applyMassVerifyPanelClasses("mass-verify-panel--wrong");
          verifyMassResult.dataset.status = "error";
          verifyMassResult.textContent =
            "Zadej hmotnost jako číslo (např. 112,84).";
          return;
        }
        const truth = truthMassForVerification(verifySelectedObject);
        const diff = Math.abs(g - truth);
        const ok = diff <= VERIFY_TOLERANCE_G + 1e-9;
        applyMassVerifyPanelClasses(
          ok ? "mass-verify-panel--correct" : "mass-verify-panel--wrong"
        );
        verifyMassResult.dataset.status = ok ? "ok" : "wrong";
        verifyMassResult.textContent = ok
          ? `Správně — jsi v toleranci ± ${VERIFY_TOLERANCE_G.toLocaleString("cs-CZ")} g.`
          : ":(";
      }

      const tableKeypadOverlay = document.getElementById("tableKeypadOverlay");
      const tableKeypadTitle = document.getElementById("tableKeypadTitle");
      const tableKeypadDisplay = document.getElementById("tableKeypadDisplay");
      const tableKeypadError = document.getElementById("tableKeypadError");
      const tableKeypadConfirm = document.getElementById("tableKeypadConfirm");
      const tableKeypadCancel = document.getElementById("tableKeypadCancel");
      const tableMathKeypad = document.getElementById("tableMathKeypad");
      const tableMathKeypadKeys = tableMathKeypad
        ? tableMathKeypad.querySelectorAll(".table-math-keypad__key")
        : [];

      /** @type {HTMLInputElement | null} */
      let tableKeypadTarget = null;
      let tableKeypadDraft = "";

      function prefersAppNumericKeypad() {
        try {
          if (window.matchMedia("(pointer: coarse)").matches) return true;
          if (
            typeof navigator.maxTouchPoints === "number" &&
            navigator.maxTouchPoints > 0 &&
            window.matchMedia("(hover: none)").matches
          ) {
            return true;
          }
        } catch (_err) {
          /* ignore */
        }
        return false;
      }

      const useAppNumericKeypad = prefersAppNumericKeypad();

      function applyNumericKeypadMode(input) {
        if (!input) return;
        input.classList.add("app-numeric-input");
        /* Na tabletu/touch potlač systémovou klávesnici; desktop může psát i přes overlay. */
        if (useAppNumericKeypad) {
          input.readOnly = true;
          input.setAttribute("inputmode", "none");
        } else {
          input.readOnly = false;
          input.setAttribute("inputmode", "decimal");
        }
      }

      function clearTableKeypadError() {
        if (tableKeypadError) {
          tableKeypadError.hidden = true;
          tableKeypadError.textContent = "";
        }
        if (tableKeypadDisplay) {
          tableKeypadDisplay.classList.remove("is-invalid");
        }
      }

      function showTableKeypadError(message) {
        if (tableKeypadError) {
          tableKeypadError.hidden = false;
          tableKeypadError.textContent = message;
        }
        if (tableKeypadDisplay) {
          tableKeypadDisplay.classList.add("is-invalid");
        }
      }

      function validateTableKeypadValue() {
        const raw = tableKeypadDraft.trim();
        if (raw === "") return { ok: true };
        const n = parseUserGrams(raw);
        if (!Number.isFinite(n)) {
          return { ok: false, message: "Zadej platné číslo." };
        }
        if (n < 0) {
          return { ok: false, message: "Hmotnost nemůže být záporná." };
        }
        return { ok: true };
      }

      function updateTableKeypadValidation() {
        const result = validateTableKeypadValue();
        if (!result.ok) {
          showTableKeypadError(result.message);
          return;
        }
        clearTableKeypadError();
      }

      function updateTableKeypadDisplay() {
        if (tableKeypadDisplay) {
          tableKeypadDisplay.textContent = tableKeypadDraft;
        }
        updateTableKeypadValidation();
      }

      function showTableMathKeypad(input) {
        if (!tableKeypadOverlay || !input) return;
        tableKeypadTarget = input;
        tableKeypadDraft = input.value;
        clearTableKeypadError();
        if (tableKeypadTitle) {
          tableKeypadTitle.textContent = "Hmotnost";
        }
        updateTableKeypadDisplay();
        tableKeypadOverlay.hidden = false;
        try {
          input.blur();
        } catch (_e) {
          /* ignore */
        }
      }

      function hideTableMathKeypad() {
        tableKeypadTarget = null;
        tableKeypadDraft = "";
        clearTableKeypadError();
        if (tableKeypadOverlay) tableKeypadOverlay.hidden = true;
        if (tableKeypadDisplay) tableKeypadDisplay.textContent = "";
      }

      function insertIntoTableKeypadDraft(value) {
        if (value === "," || value === ".") {
          if (tableKeypadDraft.indexOf(",") !== -1 || tableKeypadDraft.indexOf(".") !== -1) {
            return;
          }
        }
        if (tableKeypadDraft.length >= 12) return;
        tableKeypadDraft += value;
        updateTableKeypadDisplay();
      }

      function clearTableKeypadDraft() {
        tableKeypadDraft = "";
        updateTableKeypadDisplay();
      }

      function backspaceTableKeypadDraft() {
        tableKeypadDraft = tableKeypadDraft.slice(0, -1);
        updateTableKeypadDisplay();
      }

      function cancelTableKeypad() {
        hideTableMathKeypad();
      }

      function formatMassDraft(raw) {
        const trimmed = String(raw || "").trim();
        if (!trimmed) return "";
        const n = parseUserGrams(trimmed);
        if (!Number.isFinite(n)) return trimmed;
        return String(n).replace(".", ",");
      }

      function confirmTableKeypad() {
        const input = tableKeypadTarget;
        if (!input) return;

        const result = validateTableKeypadValue();
        if (!result.ok) {
          showTableKeypadError(result.message);
          return;
        }

        input.value = formatMassDraft(tableKeypadDraft);
        hideTableMathKeypad();
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
        onVerifyMass();
      }

      function handleTableMathKeypadClick(event) {
        const key = event.currentTarget;
        if (!(key instanceof HTMLButtonElement) || key.disabled) return;

        const action = key.getAttribute("data-action");
        const value = key.getAttribute("data-value");

        if (action === "clear") {
          clearTableKeypadDraft();
          return;
        }

        if (action === "backspace") {
          backspaceTableKeypadDraft();
          return;
        }

        if (value) {
          insertIntoTableKeypadDraft(value);
        }
      }

      if (verifyMassInput) {
        applyNumericKeypadMode(verifyMassInput);
        verifyMassInput.addEventListener("pointerdown", (ev) => {
          ev.preventDefault();
          showTableMathKeypad(verifyMassInput);
        });
        verifyMassInput.addEventListener("focus", () => {
          if (useAppNumericKeypad) {
            try {
              verifyMassInput.blur();
            } catch (_e) {
              /* ignore */
            }
            showTableMathKeypad(verifyMassInput);
          }
        });
        verifyMassInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            onVerifyMass();
          }
        });
      }

      if (tableKeypadConfirm) {
        tableKeypadConfirm.addEventListener("click", confirmTableKeypad);
      }
      if (tableKeypadCancel) {
        tableKeypadCancel.addEventListener("click", cancelTableKeypad);
      }
      if (tableKeypadOverlay) {
        tableKeypadOverlay.addEventListener("click", (ev) => {
          if (ev.target === tableKeypadOverlay) cancelTableKeypad();
        });
      }

      for (let ki = 0; ki < tableMathKeypadKeys.length; ki++) {
        const keyBtn = tableMathKeypadKeys[ki];
        keyBtn.addEventListener("mousedown", (ev) => {
          ev.preventDefault();
        });
        keyBtn.addEventListener("click", handleTableMathKeypadClick);
      }

      document.addEventListener("keydown", (ev) => {
        if (!tableKeypadTarget) return;
        if (ev.key === "Escape") {
          ev.preventDefault();
          cancelTableKeypad();
          return;
        }
        if (ev.key === "Enter") {
          ev.preventDefault();
          confirmTableKeypad();
          return;
        }
        if (ev.key === "Backspace") {
          ev.preventDefault();
          backspaceTableKeypadDraft();
          return;
        }
        if (/^[0-9]$/.test(ev.key)) {
          ev.preventDefault();
          insertIntoTableKeypadDraft(ev.key);
          return;
        }
        if (ev.key === "," || ev.key === ".") {
          ev.preventDefault();
          insertIntoTableKeypadDraft(",");
        }
      });

      applyTrayWeightSizes();
      updateClearWeightsButtonState();
      syncTiltGraphic();
    })();
  </script>
</body>
</html>
