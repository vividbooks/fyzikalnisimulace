<!DOCTYPE html>
<html lang="cs" data-theme="lever-light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Páka — simulace</title>
    <style>
      @font-face {
        font-family: "Fenomen Sans";
        src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf")
          format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --bg-base: #f8fafc;
        --bg-glow-cyan: rgba(56, 189, 248, 0.12);
        --bg-glow-violet: rgba(219, 39, 119, 0.06);
        --bg: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #db2777;
        --border: rgba(15, 23, 42, 0.12);
        --border-subtle: rgba(148, 163, 184, 0.35);
        --area-muted: rgba(241, 245, 249, 0.95);
        --readout-bg: #f1f5f9;
        /* Stejné jako COLORS.bg ve lever-app (plocha SVG přes celý layout box). */
        --lever-scene-bg: #f1f5f9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        overflow-x: hidden;
        font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
        background-color: var(--bg-base);
        background-image:
          radial-gradient(ellipse 125% 95% at 50% -28%, var(--bg-glow-cyan), transparent 54%),
          radial-gradient(ellipse 72% 58% at 108% 38%, var(--bg-glow-violet), transparent 50%),
          radial-gradient(ellipse 58% 42% at -12% 82%, rgba(56, 189, 248, 0.06), transparent 44%),
          linear-gradient(168deg, #f8fafc 0%, #f1f5f9 42%, #eef2f7 100%);
        background-attachment: fixed;
        color: var(--text);
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .app.app--lever {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }

      .sim-subheader {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px max(18px, env(safe-area-inset-right, 0px)) 12px
          max(18px, env(safe-area-inset-left, 0px));
        padding-top: max(12px, env(safe-area-inset-top, 0px));
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        flex-shrink: 0;
      }

      .hub-back-to-sims {
        display: inline-flex;
        align-items: center;
        align-self: center;
        font-size: 0.88rem;
        font-weight: 700;
        text-decoration: none;
        padding: 9px 14px;
        margin: 0;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--area-muted);
        color: var(--text);
        transition: border-color 0.15s, color 0.15s, background 0.15s;
        cursor: pointer;
        font-family: inherit;
        flex-shrink: 0;
      }

      .hub-back-to-sims:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: #fef3f8;
      }

      .sim-subheader-title {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
        flex: 1;
        min-width: 0;
      }

      .research-task-btn {
        flex-shrink: 0;
        border: 1px solid rgba(219, 39, 119, 0.35);
        background: #ffffff;
        color: #9d174d;
        padding: 9px 18px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }

      .research-task-btn:hover {
        border-color: rgba(219, 39, 119, 0.55);
        background: #fef3f8;
      }

      .research-task-btn[aria-pressed="true"] {
        border-color: rgba(219, 39, 119, 0.65);
        background: #fce7f3;
        color: #831843;
        box-shadow: 0 4px 16px rgba(219, 39, 119, 0.18);
      }

      .research-task-btn[aria-pressed="true"]:hover {
        border-color: rgba(219, 39, 119, 0.75);
        background: #fbcfe8;
      }

      .research-task-btn:active {
        transform: translateY(1px);
      }

      .research-task-title-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .research-task-title-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .task-nav-arrow {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border: 1px solid rgba(219, 39, 119, 0.35);
        background: #ffffff;
        color: #9d174d;
        border-radius: 999px;
        font-weight: 700;
        font-size: 1.35rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        padding: 0 0 2px;
      }

      .task-nav-arrow:hover:not(:disabled) {
        border-color: rgba(219, 39, 119, 0.55);
        background: #fef3f8;
      }

      .task-nav-arrow:disabled {
        opacity: 0.38;
        cursor: default;
        box-shadow: none;
      }

      .quiz-answers {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px;
        margin-top: 14px;
      }

      .quiz-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1 1 0;
        min-width: 8.5rem;
        max-width: 10.5rem;
      }

      .quiz-field-label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--muted);
      }

      .quiz-input {
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--text);
        background: #ffffff;
        width: 100%;
      }

      .quiz-input:focus {
        outline: none;
        border-color: rgba(219, 39, 119, 0.45);
        box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.12);
      }

      .quiz-step-input {
        display: flex;
        align-items: stretch;
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        background: #ffffff;
        overflow: hidden;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }

      .quiz-step-input:focus-within {
        border-color: rgba(219, 39, 119, 0.45);
        box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.12);
      }

      .quiz-step-input.quiz-input--ok {
        background: #dcfce7;
        border-color: #22c55e;
      }

      .quiz-step-input.quiz-input--err {
        background: #fee2e2;
        border-color: #ef4444;
      }

      .quiz-step-input .quiz-input {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        text-align: center;
        font-variant-numeric: tabular-nums;
        padding: 10px 6px;
        -moz-appearance: textfield;
        appearance: textfield;
      }

      .quiz-step-input .quiz-input::-webkit-inner-spin-button,
      .quiz-step-input .quiz-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .quiz-step-input .quiz-input:focus {
        outline: none;
        box-shadow: none;
      }

      .quiz-step-input.quiz-input--ok .quiz-input {
        color: #166534;
        font-weight: 700;
      }

      .quiz-step-input.quiz-input--err .quiz-input {
        color: #991b1b;
        font-weight: 700;
      }

      .quiz-step-spin {
        flex-shrink: 0;
        width: 1.7rem;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border-subtle);
      }

      .quiz-step-btn {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: var(--readout-bg);
        color: var(--muted);
        padding: 0;
        font-size: 0.62rem;
        line-height: 1;
        cursor: pointer;
        min-height: 0;
        font-family: inherit;
      }

      .quiz-step-btn + .quiz-step-btn {
        border-top: 1px solid var(--border-subtle);
      }

      .quiz-step-btn:hover:not(:disabled) {
        background: #fce7f3;
        color: #9d174d;
      }

      .quiz-step-btn:active:not(:disabled) {
        background: #fbcfe8;
      }

      .quiz-step-btn:disabled {
        opacity: 0.38;
        cursor: default;
      }

      .quiz-input--fixed {
        background: var(--readout-bg);
        color: var(--muted);
        font-weight: 700;
        cursor: default;
      }

      .quiz-input--ok {
        background: #dcfce7;
        border-color: #22c55e;
        color: #166534;
      }

      .quiz-input--err {
        background: #fee2e2;
        border-color: #ef4444;
        color: #991b1b;
      }

      .quiz-verify-btn {
        border: 1px solid rgba(219, 39, 119, 0.35);
        background: #db2777;
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(219, 39, 119, 0.22);
      }

      .quiz-verify-btn:hover {
        background: #be185d;
      }

      .stage--disabled {
        opacity: 0.52;
        filter: grayscale(0.45);
      }

      .stage--disabled .stage-svg,
      .stage--disabled .clear-weights-btn-wrap {
        pointer-events: none;
      }

      .confetti-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 12;
      }

      .confetti-piece {
        position: absolute;
        left: 50%;
        top: 42%;
        width: var(--size);
        height: calc(var(--size) * 0.55);
        border-radius: 2px;
        background: var(--color);
        opacity: 0;
        animation: confetti-burst 1.75s ease-out forwards;
        animation-delay: var(--delay);
      }

      @keyframes confetti-burst {
        0% {
          transform: translate(-50%, -50%) rotate(0deg) scale(0.35);
          opacity: 1;
        }
        15% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)))
            rotate(var(--rot)) scale(1);
          opacity: 0;
        }
      }

      .research-task-panel {
        flex-shrink: 0;
        padding: 14px max(18px, env(safe-area-inset-right, 0px)) 16px
          max(18px, env(safe-area-inset-left, 0px));
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .research-task-panel-inner {
        max-width: 52rem;
        margin: 0 auto;
      }

      .research-task-panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .research-task-panel-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .research-task-close {
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 1.35rem;
        line-height: 1;
        padding: 2px 6px;
        cursor: pointer;
        border-radius: 6px;
        font-family: inherit;
      }

      .research-task-close:hover {
        color: var(--text);
        background: rgba(15, 23, 42, 0.06);
      }

      .research-task-body {
        margin: 0;
        font-size: 0.94rem;
        line-height: 1.55;
        color: var(--text);
      }

      .research-task-body p {
        margin: 0 0 0.65em;
      }

      .research-task-body p:last-child {
        margin-bottom: 0;
      }

      .research-task-body ol {
        margin: 0.35em 0 0.65em;
        padding-left: 1.35em;
      }

      .research-task-body li {
        margin-bottom: 0.45em;
      }

      .research-task-body li:last-child {
        margin-bottom: 0;
      }

      .stage {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
        padding: 0;
        position: relative;
        overflow: hidden;
      }

      /* flex-basis: 0 — Safari/tablet správně zmenší výšku i přes „intrinsic“ SVG */
      .stage-svg-scale-wrap {
        flex: 1 1 0;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        aspect-ratio: var(--scene-ar, 1);
      }

      .stage-svg {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        background-color: var(--lever-scene-bg);
        user-select: none;
        touch-action: none;
        overflow: hidden;
      }

      .clear-weights-btn-wrap {
        position: absolute;
        z-index: 6;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .clear-weights-btn-wrap .clear-weights-btn {
        pointer-events: auto;
      }

      .clear-weights-btn {
        border: 1px solid rgba(219, 39, 119, 0.35);
        background: #ffffff;
        color: #9d174d;
        padding: 11px 22px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.92rem;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 6px 22px rgba(15, 23, 42, 0.08);
      }

      .clear-weights-btn:hover {
        border-color: rgba(219, 39, 119, 0.55);
        background: #fef3f8;
      }

      .clear-weights-btn:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div id="root" role="presentation" aria-label="Simulace páky"></div>
    <script type="module" src="./lever-app.js"></script>
  </body>
</html>
