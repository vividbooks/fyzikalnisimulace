<!DOCTYPE html>
<html lang="cs" data-theme="lever-light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Páka — simulace</title>
    <style>
      @font-face {
        font-family: "Fenomen Sans";
        src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf")
          format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --canvas-bg: #ffffe6;
        --canvas-text: #334155;
        --bg: #ffffe6;
        --panel-bg: #2a3344;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: #475569;
        --border-subtle: rgba(71, 85, 105, 0.35);
        --area-muted: #334155;
        --readout-bg: #1e293b;
        --lever-scene-bg: #ffffe6;
        --success: #16a34a;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        overflow-x: hidden;
        font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
        background: var(--canvas-bg);
        color: var(--canvas-text);
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .app.app--lever {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }

      .sim-subheader {
        position: relative;
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 12px max(18px, env(safe-area-inset-right, 0px)) 12px
          max(18px, env(safe-area-inset-left, 0px));
        padding-top: max(12px, env(safe-area-inset-top, 0px));
        border-bottom: 1px solid var(--border-subtle);
        background: var(--canvas-bg);
        flex-shrink: 0;
      }

      .hub-back-to-sims {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        align-self: center;
        gap: 6px;
        font-size: 0.88rem;
        font-weight: 700;
        text-decoration: none;
        padding: 9px 14px;
        margin: 0;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--area-muted);
        color: var(--text);
        transition: border-color 0.15s, color 0.15s, background 0.15s;
        cursor: pointer;
        font-family: inherit;
        flex-shrink: 0;
      }

      .hub-back-to-sims:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--readout-bg);
      }

      .sim-subheader-title {
        grid-column: 2;
        margin: 0;
        font-size: 1.08rem;
        font-weight: 700;
        color: var(--canvas-text);
        letter-spacing: -0.02em;
        text-align: center;
        min-width: 0;
      }

      .research-task-btn {
        justify-self: end;
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--panel-bg);
        color: var(--text);
        padding: 9px 18px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      }

      .research-task-btn:hover {
        border-color: var(--accent);
        background: var(--readout-bg);
      }

      .research-task-btn[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--readout-bg);
        color: var(--text);
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.18);
      }

      .research-task-btn[aria-pressed="true"]:hover {
        border-color: var(--accent-hover);
        background: var(--area-muted);
      }

      .research-task-btn:active {
        transform: translateY(1px);
      }

      .research-task-title-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .research-task-title-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .task-nav-arrow {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--panel-bg);
        color: var(--text);
        border-radius: 999px;
        font-weight: 700;
        font-size: 1.35rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        padding: 0 0 2px;
      }

      .task-nav-arrow:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--readout-bg);
      }

      .task-nav-arrow:disabled {
        opacity: 0.38;
        cursor: default;
        box-shadow: none;
      }

      .quiz-answers {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px;
        margin-top: 14px;
      }

      .quiz-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1 1 0;
        min-width: 8.5rem;
        max-width: 10.5rem;
      }

      .quiz-field-label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--muted);
      }

      .quiz-input {
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--canvas-text);
        background: #ffffff;
        width: 100%;
      }

      .quiz-input:focus {
        outline: none;
        border-color: rgba(59, 130, 246, 0.55);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
      }

      .quiz-step-input {
        display: flex;
        align-items: stretch;
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        background: #ffffff;
        overflow: hidden;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }

      .quiz-step-input:focus-within {
        border-color: rgba(59, 130, 246, 0.55);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
      }

      .quiz-step-input.quiz-input--ok {
        background: #ecfdf5;
        border-color: var(--success);
      }

      .quiz-step-input.quiz-input--err {
        background: #fef2f2;
        border-color: var(--danger);
      }

      .quiz-step-input .quiz-input {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        text-align: center;
        font-variant-numeric: tabular-nums;
        padding: 10px 6px;
        -moz-appearance: textfield;
        appearance: textfield;
      }

      .quiz-step-input .quiz-input::-webkit-inner-spin-button,
      .quiz-step-input .quiz-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .quiz-step-input .quiz-input:focus {
        outline: none;
        box-shadow: none;
      }

      .quiz-step-input.quiz-input--ok .quiz-input {
        color: #15803d;
        font-weight: 700;
      }

      .quiz-step-input.quiz-input--err .quiz-input {
        color: #b91c1c;
        font-weight: 700;
      }

      .quiz-step-spin {
        flex-shrink: 0;
        width: 1.7rem;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border-subtle);
      }

      .quiz-step-btn {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: var(--readout-bg);
        color: var(--muted);
        padding: 0;
        font-size: 0.62rem;
        line-height: 1;
        cursor: pointer;
        min-height: 0;
        font-family: inherit;
      }

      .quiz-step-btn + .quiz-step-btn {
        border-top: 1px solid var(--border-subtle);
      }

      .quiz-step-btn:hover:not(:disabled) {
        background: rgba(59, 130, 246, 0.12);
        color: var(--accent);
      }

      .quiz-step-btn:active:not(:disabled) {
        background: rgba(59, 130, 246, 0.2);
      }

      .quiz-step-btn:disabled {
        opacity: 0.38;
        cursor: default;
      }

      .quiz-input--fixed {
        background: var(--readout-bg);
        color: var(--muted);
        font-weight: 700;
        cursor: default;
      }

      .quiz-input--ok {
        background: #ecfdf5;
        border-color: var(--success);
        color: #15803d;
      }

      .quiz-input--err {
        background: #fef2f2;
        border-color: var(--danger);
        color: #b91c1c;
      }

      .quiz-verify-btn {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.22);
      }

      .quiz-verify-btn:hover {
        background: var(--accent-hover);
      }

      .stage--disabled {
        opacity: 0.52;
        filter: grayscale(0.45);
      }

      .stage--disabled .stage-svg,
      .stage--disabled .clear-weights-btn-wrap {
        pointer-events: none;
      }

      .confetti-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 12;
      }

      .confetti-piece {
        position: absolute;
        left: 50%;
        top: 42%;
        width: var(--size);
        height: calc(var(--size) * 0.55);
        border-radius: 2px;
        background: var(--color);
        opacity: 0;
        animation: confetti-burst 1.75s ease-out forwards;
        animation-delay: var(--delay);
      }

      @keyframes confetti-burst {
        0% {
          transform: translate(-50%, -50%) rotate(0deg) scale(0.35);
          opacity: 1;
        }
        15% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)))
            rotate(var(--rot)) scale(1);
          opacity: 0;
        }
      }

      .research-task-panel {
        flex-shrink: 0;
        padding: 14px max(18px, env(safe-area-inset-right, 0px)) 16px
          max(18px, env(safe-area-inset-left, 0px));
        border-bottom: 1px solid var(--border-subtle);
        background: var(--panel-bg);
      }

      .research-task-panel-inner {
        max-width: 52rem;
        margin: 0 auto;
      }

      .research-task-panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .research-task-panel-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .research-task-close {
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 1.35rem;
        line-height: 1;
        padding: 2px 6px;
        cursor: pointer;
        border-radius: 6px;
        font-family: inherit;
      }

      .research-task-close:hover {
        color: var(--text);
        background: rgba(248, 250, 252, 0.08);
      }

      .research-task-body {
        margin: 0;
        font-size: 0.94rem;
        line-height: 1.55;
        color: var(--text);
      }

      .research-task-body p {
        margin: 0 0 0.65em;
      }

      .research-task-body p:last-child {
        margin-bottom: 0;
      }

      .research-task-body ol {
        margin: 0.35em 0 0.65em;
        padding-left: 1.35em;
      }

      .research-task-body li {
        margin-bottom: 0.45em;
      }

      .research-task-body li:last-child {
        margin-bottom: 0;
      }

      .stage {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
        padding: 0;
        position: relative;
        overflow: hidden;
      }

      .research-situation-switcher {
        position: absolute;
        top: max(10px, env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        pointer-events: auto;
      }

      .research-situation-btn {
        appearance: none;
        min-width: 44px;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-bg);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      }

      .research-situation-btn:hover {
        border-color: var(--accent);
        background: var(--readout-bg);
      }

      .research-situation-btn.is-active,
      .research-situation-btn[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.22);
      }

      .sim-empty-hint {
        position: absolute;
        top: max(16px, env(safe-area-inset-top, 0px));
        left: 50%;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        width: max-content;
        max-width: min(720px, calc(100% - 48px));
        margin: 0;
        padding: 12px 28px;
        border: 2px solid #cbd5e1;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        pointer-events: none;
        text-align: center;
        font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1rem, 2.4vw, 1.75rem);
        font-weight: 400;
        line-height: 1.35;
        color: var(--canvas-text);
        transform: translateX(-50%);
      }

      .sim-empty-hint.is-hidden {
        display: none;
      }

      /* flex-basis: 0 — Safari/tablet správně zmenší výšku i přes „intrinsic“ SVG */
      .stage-svg-scale-wrap {
        flex: 1 1 0;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        aspect-ratio: var(--scene-ar, 1);
      }

      .stage-svg {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        background-color: var(--lever-scene-bg);
        user-select: none;
        touch-action: none;
        overflow: hidden;
      }

      .clear-weights-btn-wrap {
        position: absolute;
        z-index: 6;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .clear-weights-btn-wrap .clear-weights-btn {
        pointer-events: auto;
      }

      .clear-weights-btn {
        border: 1px solid var(--border);
        background: var(--panel-bg);
        color: var(--text);
        padding: 11px 22px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.92rem;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 6px 22px rgba(15, 23, 42, 0.08);
      }

      .clear-weights-btn:hover {
        border-color: var(--accent);
        background: var(--readout-bg);
      }

      .clear-weights-btn:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div id="root" role="presentation" aria-label="Simulace páky"></div>
    <script type="module" src="./lever-app.js"></script>
  </body>
</html>
