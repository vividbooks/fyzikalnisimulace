<!doctype html>
<!-- Simulace ze zdroje: https://github.com/FrantisekVvb/vztlakova_sila -->
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vztlaková síla</title>
    <style>
      @font-face {
        font-family: "Fenomen Sans";
        src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light dark;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0ea5e9;
        --ok: #16a34a;
        --warn: #d97706;
        --bad: #dc2626;
        --canvas-bg: #eef2ff;
        --canvas-border: #c7d2fe;
        --water: rgba(14, 165, 233, 0.25);
        --water-line: rgba(14, 165, 233, 0.55);
        --glass: rgba(2, 6, 23, 0.06);
        --rope: #64748b;
        --weight: #334155;
        --scale: #111827;
        --digits: #34d399;
        --digits-dim: rgba(52, 211, 153, 0.25);
        --radius: 14px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --panel: #0f172a;
          --text: #e5e7eb;
          --muted: #94a3b8;
          --accent: #38bdf8;
          --ok: #22c55e;
          --warn: #f59e0b;
          --bad: #fb7185;
          --canvas-bg: #0b1020;
          --canvas-border: #1f2a44;
          --water: rgba(56, 189, 248, 0.22);
          --water-line: rgba(56, 189, 248, 0.55);
          --glass: rgba(255, 255, 255, 0.06);
          --rope: #94a3b8;
          --weight: #cbd5e1;
          --scale: #0b1220;
          --digits: #34d399;
          --digits-dim: rgba(52, 211, 153, 0.22);
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }

      .app {
        width: min(1300px, 100%);
        background: var(--panel);
        border-radius: var(--radius);
        padding: 18px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 14px;
      }

      header {
        display: grid;
        gap: 6px;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.35;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 14px;
        align-items: start;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: color-mix(in oklab, var(--panel) 92%, var(--text) 8%);
        border-radius: 12px;
        padding: 12px;
        border: 1px solid color-mix(in oklab, var(--panel) 82%, var(--text) 18%);
      }

      canvas {
        width: 100%;
        height: auto;
        display: block;
        background: var(--canvas-bg);
        border: 1px solid var(--canvas-border);
        border-radius: 12px;
      }

      /* Když je ovládání delší než výška obrázku, umožni scroll */
      aside.card[aria-label="Ovládání"] {
        max-height: 680px;
        overflow: auto;
        scrollbar-gutter: stable both-edges;
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        gap: 6px;
      }

      label {
        font-weight: 750;
        letter-spacing: 0.2px;
      }

      .sub {
        color: var(--muted);
        font-size: 0.9rem;
      }

      input[type="range"] {
        width: 100%;
      }

      input[type="number"],
      select {
        width: 100%;
        border-radius: 10px;
        padding: 10px 10px;
        border: 1px solid color-mix(in oklab, var(--panel) 78%, var(--text) 22%);
        background: color-mix(in oklab, var(--panel) 94%, var(--text) 6%);
        color: var(--text);
        outline: none;
      }

      .val {
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-weight: 800;
        color: color-mix(in oklab, var(--accent) 80%, var(--text) 20%);
      }

      .kv {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: baseline;
        padding: 10px 10px;
        border-radius: 12px;
        border: 1px solid color-mix(in oklab, var(--panel) 78%, var(--text) 22%);
        background: color-mix(in oklab, var(--panel) 92%, var(--text) 8%);
      }

      .kv .k {
        color: var(--muted);
        font-weight: 700;
      }

      .kv .v {
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-weight: 900;
      }

      .pill {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid color-mix(in oklab, var(--panel) 76%, var(--text) 24%);
        background: color-mix(in oklab, var(--panel) 92%, var(--text) 8%);
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .pill b {
        color: var(--text);
      }

      .status {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }

      .warn {
        color: var(--warn);
      }

      .ok {
        color: var(--ok);
      }

      .bad {
        color: var(--bad);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 850;
        cursor: pointer;
        color: var(--text);
        background: color-mix(in oklab, var(--panel) 86%, var(--text) 14%);
        border: 1px solid color-mix(in oklab, var(--panel) 72%, var(--text) 28%);
        transition: transform 0.12s ease, filter 0.15s ease;
      }

      button:hover {
        filter: brightness(1.03);
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 85%, white 15%), color-mix(in oklab, var(--accent) 65%, black 35%));
        border-color: color-mix(in oklab, var(--accent) 70%, var(--text) 30%);
        color: color-mix(in oklab, var(--panel) 10%, var(--text) 90%);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 50;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(820px, 100%);
        max-height: min(82vh, 900px);
        overflow: auto;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        border: 1px solid color-mix(in oklab, var(--panel) 78%, var(--text) 22%);
      }

      .modal .hd {
        padding: 14px 14px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid color-mix(in oklab, var(--panel) 78%, var(--text) 22%);
        position: sticky;
        top: 0;
        background: color-mix(in oklab, var(--panel) 92%, var(--text) 8%);
        backdrop-filter: blur(8px);
      }

      .modal .hd h2 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: -0.01em;
      }

      .modal .bd {
        padding: 14px;
        line-height: 1.45;
        color: var(--text);
      }

      .modal .bd h3 {
        margin: 14px 0 8px;
        font-size: 1rem;
      }

      .modal .bd p {
        margin: 8px 0;
        color: color-mix(in oklab, var(--text) 92%, var(--muted) 8%);
      }

      .modal .bd .opt {
        margin: 6px 0;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid color-mix(in oklab, var(--panel) 76%, var(--text) 24%);
        background: color-mix(in oklab, var(--panel) 92%, var(--text) 8%);
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Vztlaková síla</h1>
      </header>

      <div class="grid">
        <section class="card" aria-label="Vizualizace">
          <canvas id="cv" width="1200" height="680"></canvas>
        </section>

        <aside class="card" aria-label="Ovládání">
          <div class="controls">
            <div class="row">
              <label for="material">Materiál závaží</label>
              <select id="material">
                <option value="al">Hliník (2700 kg/m³)</option>
                <option value="fe" selected>Železo/ocel (7850 kg/m³)</option>
                <option value="cu">Měď (8960 kg/m³)</option>
                <option value="au">Zlato (19300 kg/m³)</option>
              </select>
            </div>

            <div class="row">
              <label for="vol">Objem závaží</label>
              <div class="sub"><span class="val" id="outV">50 cm³</span></div>
              <input id="vol" type="range" min="1" max="100" step="1" value="50" />
            </div>

            <div class="row">
              <label for="liquid">Kapalina</label>
              <select id="liquid">
                <option value="water" selected>Voda (1000 kg/m³)</option>
                <option value="sea">Mořská voda (1025 kg/m³)</option>
                <option value="oil">Rostlinný olej (920 kg/m³)</option>
                <option value="ethanol">Etanol (789 kg/m³)</option>
                <option value="glycerin">Glycerin (1260 kg/m³)</option>
              </select>
            </div>

            <div class="row">
              <label for="bottomDepth">Ponoření</label>
              <input id="bottomDepth" type="range" min="0" max="45" step="0.1" value="0" />
            </div>

            <div class="row">
              <label style="display: flex; align-items: center; gap: 10px; font-weight: 850">
                <input id="enable2" type="checkbox" />
                Druhé závaží
              </label>
            </div>

            <div id="w2Wrap" class="row" style="display: none; gap: 10px">
              <div class="row">
                <label for="material2">Materiál 2. závaží</label>
                <select id="material2">
                  <option value="al">Hliník (2700 kg/m³)</option>
                  <option value="fe" selected>Železo/ocel (7850 kg/m³)</option>
                  <option value="cu">Měď (8960 kg/m³)</option>
                  <option value="au">Zlato (19300 kg/m³)</option>
                </select>
              </div>

              <div class="row">
                <label for="vol2">Objem 2. závaží</label>
                <div class="sub"><span class="val" id="outV2">50 cm³</span></div>
                <input id="vol2" type="range" min="1" max="100" step="1" value="50" />
              </div>
            </div>

            <div class="row">
              <button id="btnTask" type="button" class="primary">Badatelský úkol</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <div class="modal-backdrop" id="taskModal" role="dialog" aria-modal="true" aria-label="Badatelský úkol" tabindex="-1">
      <div class="modal">
        <div class="hd">
          <h2>Badatelský úkol</h2>
          <button id="btnTaskClose" type="button">Zavřít</button>
        </div>
        <div class="bd" id="taskBody"></div>
      </div>
    </div>

    <script>
      (function () {
        const g = 10;

        const MATERIALS = {
          al: { name: "Hliník", rho: 2700 },
          fe: { name: "Železo/ocel", rho: 7850 },
          cu: { name: "Měď", rho: 8960 },
          au: { name: "Zlato", rho: 19300 },
        };

        const LIQUIDS = {
          water: { name: "Voda", rho: 1000 },
          sea: { name: "Mořská voda", rho: 1025 },
          oil: { name: "Rostlinný olej", rho: 920 },
          ethanol: { name: "Etanol", rho: 789 },
          glycerin: { name: "Glycerin", rho: 1260 },
        };

        const els = {
          cv: document.getElementById("cv"),
          material: document.getElementById("material"),
          vol: document.getElementById("vol"),
          outV: document.getElementById("outV"),
          enable2: document.getElementById("enable2"),
          w2Wrap: document.getElementById("w2Wrap"),
          material2: document.getElementById("material2"),
          vol2: document.getElementById("vol2"),
          outV2: document.getElementById("outV2"),
          liquid: document.getElementById("liquid"),
          bottomDepth: document.getElementById("bottomDepth"),
          btnTask: document.getElementById("btnTask"),
          taskModal: document.getElementById("taskModal"),
          btnTaskClose: document.getElementById("btnTaskClose"),
          taskBody: document.getElementById("taskBody"),
        };

        /** @returns {number} */
        function num(el, fallback) {
          const v = Number(el.value);
          return Number.isFinite(v) ? v : fallback;
        }

        function clamp(x, a, b) {
          return Math.min(b, Math.max(a, x));
        }

        function fmtN(x) {
          return x.toFixed(2).replace(".", ",") + " N";
        }

        function fmtG(x) {
          return (x * 1000).toFixed(0) + " g";
        }

        function fmtCm(x) {
          return x.toFixed(1).replace(".", ",") + " cm";
        }

        function updateMaterialUI() {
          // už jen předdefinované materiály (bez vlastní hustoty)
        }

        function updateLiquidUI() {
          // už jen předdefinované kapaliny (bez vlastní hustoty)
        }

        function weightFromInputs(materialKey, Vcm3, rhoW, xBottom, waterH) {
          const material = MATERIALS[materialKey] || MATERIALS.fe;
          const rhoObj = Math.max(1, material.rho);
          const V = Math.max(1, Vcm3) * 1e-6; // m3

          // Tvar závaží: kostka. Pro čitelnost je v obrázku zvětšená,
          // proto vztlak počítáme přes PODÍL ponoření (zobrazená výška) a ten aplikujeme na reálný objem V.
          const sideCm = Math.cbrt(Math.max(1, Vcm3)); // cm (reálná hrana)
          const displayScale = 2.0;
          const sideDispCm = sideCm * displayScale; // cm (zobrazená hrana)

          const bottom = xBottom; // cm (dno tělesa pod hladinou)
          const top = bottom - sideDispCm; // cm (vršek tělesa pod hladinou)
          const submergedCm = Math.max(0, Math.min(bottom, waterH) - Math.max(top, 0)); // cm
          const frac = sideDispCm > 0 ? clamp(submergedCm / sideDispCm, 0, 1) : 0;
          const Vsub = frac * V;
          const W = rhoObj * g * V;
          const B = rhoW * g * Vsub;
          const Tfree = W - B;
          const m = rhoObj * V;

          return { materialKey, rhoObj, Vcm3, V, sideDispCm, frac, Vsub, W, B, Tfree, m };
        }

        function compute() {
          // Nádoba a hladina jsou pevně dané (v UI se nezobrazují).
          const tankHFixed = 40; // cm
          const waterHFixed = 30; // cm

          const liquidKey = String(els.liquid.value || "water");
          const liquid = LIQUIDS[liquidKey] || LIQUIDS.water;
          const rhoW = Math.max(1, liquid.rho);
          const tankH = tankHFixed;
          const waterH = clamp(waterHFixed, 0, tankH);

          // Uživatelský posuv: 0 znamená, že závaží je kousek NAD hladinou.
          // (aby bylo v klidu vidět "ve vzduchu", bez vztlaku)
          const airGapCm = 2.0;
          // Maximum posuvníku odpovídá "dno nádoby" (dno je waterH pod hladinou) + mezera nad hladinou.
          const maxX = Math.max(0, waterH + airGapCm);
          if (Number(els.bottomDepth.max) !== maxX) els.bottomDepth.max = String(maxX);

          const xUser = clamp(num(els.bottomDepth, 0), 0, maxX); // cm
          const bottomDepthRaw = xUser - airGapCm; // cm (může být i záporné)
          const xBottom = bottomDepthRaw > waterH ? waterH : bottomDepthRaw; // pokud dál než dno nádoby, "naráží" na dno

          const w1 = weightFromInputs(String(els.material.value || "fe"), Math.max(1, num(els.vol, 50)), rhoW, xBottom, waterH);
          const enable2 = !!(els.enable2 && els.enable2.checked);
          const w2 = enable2
            ? weightFromInputs(String(els.material2.value || "fe"), Math.max(1, num(els.vol2, 50)), rhoW, xBottom, waterH)
            : null;

          // Kontakt se dnem (společné pro oba): posuvník je "za dnem" a těleso by tlačilo dolů.
          const wouldHitBottom = bottomDepthRaw > waterH + 1e-9;
          const T1 = wouldHitBottom && w1.Tfree > 0 ? Math.max(0, w1.Tfree) : w1.Tfree;
          const T2 = w2 ? (wouldHitBottom && w2.Tfree > 0 ? Math.max(0, w2.Tfree) : w2.Tfree) : null;
          const netDownIfFree = w1.Tfree + (w2 ? w2.Tfree : 0);

          return {
            rhoW,
            liquidKey,
            tankH,
            waterH,
            xUser,
            xBottom,
            T1,
            T2,
            w1,
            w2,
            wouldHitBottom,
            netDownIfFree,
          };
        }

        function materialGradient(ctx, materialKey, x, y, w, h) {
          const g = ctx.createLinearGradient(x, y, x + w, y + h);
          if (materialKey === "al") {
            g.addColorStop(0.0, "#f8fafc");
            g.addColorStop(0.45, "#cbd5e1");
            g.addColorStop(1.0, "#94a3b8");
          } else if (materialKey === "fe") {
            g.addColorStop(0.0, "#e2e8f0");
            g.addColorStop(0.45, "#64748b");
            g.addColorStop(1.0, "#334155");
          } else if (materialKey === "cu") {
            g.addColorStop(0.0, "#ffe0cf");
            g.addColorStop(0.45, "#d97706");
            g.addColorStop(1.0, "#9a3412");
          } else if (materialKey === "au") {
            g.addColorStop(0.0, "#fff7cc");
            g.addColorStop(0.45, "#fbbf24");
            g.addColorStop(1.0, "#b45309");
          } else {
            g.addColorStop(0.0, "#e2e8f0");
            g.addColorStop(1.0, "#334155");
          }
          return g;
        }

        function materialSphereFill(ctx, materialKey, cx, cy, r) {
          const grad = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.15, cx, cy, r);
          if (materialKey === "al") {
            grad.addColorStop(0.0, "#ffffff");
            grad.addColorStop(0.35, "#e2e8f0");
            grad.addColorStop(0.75, "#94a3b8");
            grad.addColorStop(1.0, "#64748b");
          } else if (materialKey === "fe") {
            grad.addColorStop(0.0, "#f1f5f9");
            grad.addColorStop(0.35, "#cbd5e1");
            grad.addColorStop(0.78, "#475569");
            grad.addColorStop(1.0, "#1f2937");
          } else if (materialKey === "cu") {
            grad.addColorStop(0.0, "#ffe7db");
            grad.addColorStop(0.35, "#fdba74");
            grad.addColorStop(0.78, "#c2410c");
            grad.addColorStop(1.0, "#7c2d12");
          } else if (materialKey === "au") {
            grad.addColorStop(0.0, "#fff7cc");
            grad.addColorStop(0.35, "#fde68a");
            grad.addColorStop(0.78, "#f59e0b");
            grad.addColorStop(1.0, "#92400e");
          } else {
            grad.addColorStop(0.0, "#e2e8f0");
            grad.addColorStop(1.0, "#334155");
          }
          return grad;
        }

        function fillCircle(ctx, cx, cy, r) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        function strokeCircle(ctx, cx, cy, r) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        function liquidStyle(liquidKey) {
          // barvy schválně jednoduše, aby byly "učebnicově" rozeznatelné
          if (liquidKey === "oil") {
            return { fill: "rgba(234, 179, 8, 0.22)", line: "rgba(234, 179, 8, 0.55)" };
          }
          if (liquidKey === "ethanol") {
            return { fill: "rgba(148, 197, 255, 0.10)", line: "rgba(148, 197, 255, 0.35)" };
          }
          if (liquidKey === "glycerin") {
            return { fill: "rgba(52, 211, 153, 0.14)", line: "rgba(52, 211, 153, 0.45)" };
          }
          if (liquidKey === "sea") {
            return { fill: "rgba(2, 132, 199, 0.26)", line: "rgba(2, 132, 199, 0.60)" };
          }
          // water (default)
          return { fill: "rgba(14, 165, 233, 0.25)", line: "rgba(14, 165, 233, 0.55)" };
        }

        function draw(s) {
          const ctx = els.cv.getContext("2d");
          const W = els.cv.width;
          const H = els.cv.height;
          ctx.clearRect(0, 0, W, H);

          // layout
          const pad = 28;
          const topY = pad;
          const tankW = 480;
          const tankHpx = 460;
          const tankX = Math.round(pad + (W - 2 * pad - tankW) / 2);
          const tankY = pad + 150;
          const scaleCenterX = tankX + tankW / 2;

          // map cm -> px (podle výšky nádoby)
          const pxPerCm = tankHpx / Math.max(1, s.tankH);
          const yWater = tankY + (s.tankH - s.waterH) * pxPerCm;
          const yBottom = tankY + tankHpx;

          // background hints
          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--glass").trim() || "rgba(0,0,0,0.06)";
          ctx.fillRect(pad, pad, W - 2 * pad, H - 2 * pad);

          function drawScaleAt(centerX, valueN) {
            const scaleW = 200;
            const scaleH = 118;
            const scaleX = Math.round(centerX - scaleW / 2);
            const scaleY = topY;
            const hookX = centerX;
            const hookBottomY = scaleY + scaleH;

            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--scale").trim() || "#111827";
            roundRect(ctx, scaleX, scaleY, scaleW, scaleH, 16, true, false);

            const dispX = scaleX + 16;
            const dispY = scaleY + 22;
            const dispW = scaleW - 32;
            const dispH = 64;
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--digits-dim").trim() || "rgba(52,211,153,0.22)";
            roundRect(ctx, dispX, dispY, dispW, dispH, 12, true, false);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--digits").trim() || "#34d399";
            ctx.font = "900 34px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const txt = (Math.abs(valueN) < 1e-9 ? 0 : valueN).toFixed(2).replace(".", ",") + " N";
            ctx.fillText(txt, dispX + dispW / 2, dispY + dispH / 2);
            return { hookX, hookBottomY };
          }

          // (bez popisku pod siloměrem)

          // tank outline
          ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--canvas-border").trim() || "#c7d2fe";
          ctx.lineWidth = 2;
          roundRect(ctx, tankX, tankY, tankW, tankHpx, 14, false, true);

          // water fill
          const liq = liquidStyle(s.liquidKey);
          ctx.fillStyle = liq.fill;
          ctx.fillRect(tankX + 2, yWater, tankW - 4, yBottom - yWater - 2);
          ctx.strokeStyle = liq.line;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(tankX + 8, yWater);
          ctx.lineTo(tankX + tankW - 8, yWater);
          ctx.stroke();

          // --- weights (1 or 2) ---
          const bottomCm = s.xBottom;
          const yBottomWeight = yWater + bottomCm * pxPerCm;

          const w1 = s.w1;
          const w2 = s.w2;

          const s1px = clamp(w1.sideDispCm * pxPerCm, 56, 240);
          const s2px = w2 ? clamp(w2.sideDispCm * pxPerCm, 56, 240) : 0;

          const scales = w2
            ? [scaleCenterX - 170, scaleCenterX + 170]
            : [scaleCenterX];

          const hook1 = drawScaleAt(scales[0], s.T1);
          const hook2 = w2 ? drawScaleAt(scales[1], s.T2) : null;

          function drawWeightUnder(hook, sizePx, materialKey) {
            const x = clamp(hook.hookX - sizePx / 2, tankX + 8, tankX + tankW - sizePx - 8);
            const y = yBottomWeight - sizePx;

            ctx.strokeStyle = "rgba(15, 23, 42, 0.75)";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(hook.hookX, hook.hookBottomY + 22);
            ctx.lineTo(x + sizePx / 2, y - 8);
            ctx.stroke();

            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            fillCircle(ctx, x + sizePx / 2, y - 6, 5);

            ctx.fillStyle = materialGradient(ctx, materialKey, x, y, sizePx, sizePx);
            roundRect(ctx, x, y, sizePx, sizePx, 12, true, false);

            ctx.fillStyle = "rgba(255,255,255,0.14)";
            roundRect(ctx, x + sizePx * 0.12, y + sizePx * 0.10, sizePx * 0.18, sizePx * 0.80, 10, true, false);
            return { x, w: sizePx };
          }

          const w1Box = drawWeightUnder(hook1, s1px, w1.materialKey);
          const w2Box = w2 && hook2 ? drawWeightUnder(hook2, s2px, w2.materialKey) : null;

          // (bez popisků na závaží)

          // bottom contact marker
          if (s.wouldHitBottom) {
            ctx.fillStyle = "rgba(217, 119, 6, 0.35)";
            ctx.fillRect(w1Box.x - 10, yBottom - 8, w1Box.w + 20, 8);
            if (w2Box) ctx.fillRect(w2Box.x - 10, yBottom - 8, w2Box.w + 20, 8);
          }

          // (bez popisků "Hladina" / "Dno")

          // (bez popisku hloubky x)
        }

        function roundRect(ctx, x, y, w, h, r, fill, stroke) {
          const rr = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function render() {
          updateMaterialUI();
          updateLiquidUI();
          const s = compute();

          if (els.outV && els.vol) els.outV.textContent = String(Math.round(num(els.vol, 50))) + " cm³";
          if (els.outV2 && els.vol2) els.outV2.textContent = String(Math.round(num(els.vol2, 50))) + " cm³";
          draw(s);
        }

        function taskHtml() {
          return (
            "<p><b>Cíl:</b> prozkoumat, na čem závisí vztlaková síla.</p>" +
            "<h3>Úkol 1 – Vztlak na zcela ponořeném tělese</h3>" +
            "<ol>" +
            "<li>Zvol jako kapalinu <b>vodu</b>.</li>" +
            "<li>Vyber libovolné závaží.</li>" +
            "<li>Zapiš sílu, kterou ukazuje siloměr.</li>" +
            "<li>Ponoř závaží <b>zcela pod hladinu</b> a znovu zapiš sílu.</li>" +
            "<li><b>Vypočítej vztlakovou sílu</b>, kterou voda působí na zcela ponořené závaží.</li>" +
            "</ol>" +
            "<h3>Úkol 2 – Vliv hloubky (těleso je zcela ponořené)</h3>" +
            "<ol>" +
            "<li><b>Odhad:</b> bude voda nadlehčovat závaží více těsně pod hladinou, nebo u dna?</li>" +
            "<li>Ověř odhad pomocí simulace (zcela ponořené závaží v malé a velké hloubce).</li>" +
            "<li><b>Otázka:</b> Jaký vliv má hloubka ponoření na velikost vztlakové síly?</li>" +
            "</ol>" +
            "<h3>Úkol 3 – Vliv materiálu</h3>" +
            "<ol>" +
            "<li><b>Odhad:</b> bude voda nadlehčovat více hliníkové, nebo zlaté závaží?</li>" +
            "<li>Ověř odhad pomocí simulace.</li>" +
            "<li><b>Otázka:</b> Jaký vliv má materiál tělesa na velikost vztlakové síly?</li>" +
            "</ol>" +
            "<h3>Úkol 4 – Vliv hmotnosti (stejný objem)</h3>" +
            "<ol>" +
            "<li>Vyber dvě závaží se <b>stejným objemem</b>, ale rozdílnou hmotností.</li>" +
            "<li><b>Odhad:</b> které z nich bude voda nadlehčovat více?</li>" +
            "<li>Ověř odhad pomocí simulace.</li>" +
            "<li><b>Otázka:</b> Jaký vliv má hmotnost tělesa na velikost vztlakové síly?</li>" +
            "</ol>" +
            "<h3>Úkol 5 – Vliv objemu (stejný materiál)</h3>" +
            "<ol>" +
            "<li>Vyber dvě závaží ze <b>stejného materiálu</b>, ale s různým objemem.</li>" +
            "<li><b>Odhad:</b> které z nich bude voda nadlehčovat více?</li>" +
            "<li>Ověř odhad pomocí simulace.</li>" +
            "<li><b>Otázka:</b> Jaký vliv má objem tělesa na velikost vztlakové síly?</li>" +
            "</ol>" +
            "<h3>Úkol 6 – Vliv hustoty kapaliny</h3>" +
            "<ol>" +
            "<li>Vyber libovolné závaží.</li>" +
            "<li><b>Odhad:</b> bude více nadlehčováno ve vodě, nebo v oleji?</li>" +
            "<li>Ověř odhad pomocí simulace.</li>" +
            "<li><b>Otázka:</b> Jaký vliv má hustota kapaliny na velikost vztlakové síly?</li>" +
            "</ol>"
          );
        }

        function openTask() {
          if (!els.taskModal || !els.taskBody) return;
          els.taskBody.innerHTML = taskHtml();
          els.taskModal.classList.add("open");
          els.taskModal.focus();
        }

        function closeTask() {
          if (!els.taskModal) return;
          els.taskModal.classList.remove("open");
        }

        function onAnyChange() {
          render();
        }

        // events
        els.material.addEventListener("change", () => {
          updateMaterialUI();
          render();
        });
        els.vol.addEventListener("input", onAnyChange);
        if (els.enable2 && els.w2Wrap) {
          const sync2Vis = () => {
            els.w2Wrap.style.display = els.enable2.checked ? "grid" : "none";
            render();
          };
          els.enable2.addEventListener("change", sync2Vis);
          sync2Vis();
        }
        if (els.material2) els.material2.addEventListener("change", onAnyChange);
        if (els.vol2) els.vol2.addEventListener("input", onAnyChange);
        els.liquid.addEventListener("change", () => {
          updateLiquidUI();
          render();
        });
        els.bottomDepth.addEventListener("input", onAnyChange);

        if (els.btnTask) els.btnTask.addEventListener("click", openTask);
        if (els.btnTaskClose) els.btnTaskClose.addEventListener("click", closeTask);
        if (els.taskModal) {
          els.taskModal.addEventListener("click", (e) => {
            if (e.target === els.taskModal) closeTask();
          });
          window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeTask();
          });
        }

        // init
        updateMaterialUI();
        render();
      })();
    </script>

    <noscript>
      <p style="padding: 1rem; text-align: center; color: #f0f4e8">Zapni JavaScript — bez něj simulace nefunguje.</p>
    </noscript>
  </body>
</html>
