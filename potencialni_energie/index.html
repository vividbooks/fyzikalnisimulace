<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Potenciální energie</title>
  <style>
    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-Book.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fenomen Sans";
      src: url("assets/fonts/FenomenSans-SemiBold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Cooper Light";
      src: url("assets/fonts/Cooper-Light.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    :root {
      --font-app: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
      --page-bg: #1e2533;
      --card-bg: #2a3344;
      --idle-bg: #334155;
      --idle-text: #cbd5e1;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-on: #ffffff;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #475569;
      --focus: #3b82f6;
      --readout-bg: #1e293b;
      --canvas-bg: #ffffe6;
      --space-bg: #020208;
      --success: #4ade80;
      --danger: #ef4444;
      --radius: 12px;
      --radius-canvas: 24px;
      --panel-w: min(300px, 34vw);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font-app);
      font-weight: 400;
      color-scheme: dark;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, label, output { font-family: inherit; }

    .hidden { display: none !important; }

    /* ---------- Rozložení ---------- */

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: stretch;
      gap: 16px;
      padding: max(16px, env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        max(16px, env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
      overflow: hidden;
    }

    /* ---------- Panel ---------- */

    .setup-panel {
      flex: 0 0 var(--panel-w);
      width: var(--panel-w);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      min-width: 0;
      overflow: auto;
      padding: 8px 8px 16px;
      scrollbar-gutter: stable;
    }

    .panel-copy {
      display: grid;
      gap: 10px;
    }

    .hub-back-to-sims {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      justify-self: start;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #1e293b;
      color: var(--text);
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      text-decoration: none;
    }

    .hub-back-to-sims svg { display: block; flex: 0 0 auto; }
    .hub-back-to-sims:hover { color: #fff; }
    .hub-back-to-sims:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .panel-title {
      margin: 0;
      color: var(--text);
      font-family: "Cooper Light", serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }

    .panel-section {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--card-bg);
    }

    .panel-label {
      display: block;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .panel-label--sub { margin-top: 6px; }

    .panel-note {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Přepínače (prostředí, typ tělesa) ---------- */

    .env-toggle,
    .body-kind-toggle {
      display: grid;
      gap: 8px;
    }

    .env-toggle { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .body-kind-toggle { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .env-option,
    .body-kind-option {
      appearance: none;
      min-height: 40px;
      min-width: 0;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--idle-bg);
      color: var(--idle-text);
      font: inherit;
      font-size: 14px;
      line-height: 1.15;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .env-option:hover:not(:disabled),
    .body-kind-option:hover:not(:disabled) { color: var(--text); }

    .env-option.selected,
    .body-kind-option.selected {
      background: var(--accent);
      color: var(--accent-on);
    }

    /* ---------- Výběr tělesa ---------- */

    .ball-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
    }

    .ball-option {
      appearance: none;
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 4px;
      min-width: 0;
      padding: 8px 4px 7px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--idle-bg);
      color: var(--idle-text);
      font: inherit;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .ball-option:hover:not(:disabled) { color: var(--text); }

    .ball-option.selected {
      background: var(--accent);
      color: var(--accent-on);
    }

    .ball-swatch-wrap {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ball-swatch {
      display: block;
      box-sizing: border-box;
      border-radius: 50%;
      flex-shrink: 0;
      aspect-ratio: 1;
    }

    .object-swatch {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .ball-option-label {
      font-size: 12px;
      line-height: 1.25;
    }

    .ball-option-name {
      display: block;
      font-size: 14px;
    }

    .ball-option-specs {
      display: block;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .ball-option.selected .ball-option-specs { color: rgba(255, 255, 255, 0.85); }

    .env-option:disabled,
    .body-kind-option:disabled,
    .ball-option:disabled,
    .action-btn:disabled,
    .range-slider:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .env-option:focus-visible,
    .body-kind-option:focus-visible,
    .ball-option:focus-visible,
    .action-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* ---------- Výška ---------- */

    .range-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-slider {
      flex: 1 1 auto;
      min-width: 0;
      height: 28px;
      margin: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: none;
    }

    .range-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        var(--accent) 0%,
        var(--accent) var(--fill, 50%),
        var(--idle-bg) var(--fill, 50%),
        var(--idle-bg) 100%
      );
    }

    .range-slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: var(--idle-bg);
    }

    .range-slider::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      margin-top: -9px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.35);
    }

    .range-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: #fff;
    }

    .range-slider:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
      border-radius: 6px;
    }

    .range-value {
      flex: 0 0 auto;
      min-width: 72px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--readout-bg);
      color: var(--text);
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    /* ---------- Akce ---------- */

    .actions-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 10px 8px;
      white-space: nowrap;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .action-btn svg { display: block; flex: 0 0 auto; }

    .action-btn--run { background: #4ade80; color: #14532d; }
    .action-btn--run:hover:not(:disabled) { background: #86efac; color: #052e16; }
    .action-btn--reset { background: #ef4444; color: #fff; }
    .action-btn--reset:hover:not(:disabled) { background: #dc2626; }

    /* ---------- Plátno ---------- */

    .viz-column {
      flex: 1 1 0;
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 76px 16px var(--ground-band, 16px);
      border-radius: var(--radius-canvas);
      background: var(--canvas-bg);
      isolation: isolate;
      transition: background-color 320ms ease;
    }

    body.env-moon .viz-column,
    body.env-weightless .viz-column {
      background: var(--space-bg);
    }

    .sim-empty-hint {
      position: absolute;
      top: 16px;
      left: 50%;
      z-index: 8;
      width: max-content;
      max-width: min(720px, calc(100% - 48px));
      margin: 0;
      padding: 12px 28px;
      border: 2px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      pointer-events: none;
      text-align: center;
      font-size: 28px;
      line-height: 1.35;
      color: #334155;
      transform: translateX(-50%);
    }

    .sim-empty-hint.is-hidden { visibility: hidden; }

    /* Horní lišta plátna: vlevo údaje o tělese, uprostřed nápověda. */
    .viz-topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 8;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .viz-topbar .sim-empty-hint {
      position: static;
      flex: 1 1 auto;
      width: auto;
      max-width: none;
      margin: 0 auto;
      transform: none;
    }

    .body-info {
      display: grid;
      gap: 2px;
      min-width: 150px;
      padding: 10px 16px 12px;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      color: #334155;
      font-size: 20px;
      line-height: 1.3;
    }

    .body-info__name {
      margin-bottom: 2px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
    }

    .body-info__value {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .space-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background: var(--space-bg) url("assets/space-stars.svg") center / cover no-repeat;
      transition: opacity 320ms ease;
    }

    body.env-moon .space-backdrop,
    body.env-weightless .space-backdrop { opacity: 1; }

    /* Povrch přes celou šířku plátna (jako v Siloměru). */
    .earth-grass,
    .moon-surface {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      line-height: 0;
      overflow: hidden;
      transition: opacity 320ms ease;
    }

    .earth-grass img,
    .moon-surface img {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: block;
      width: 100%;
      height: auto;
    }

    /* Měsíc: nízký pás povrchu přes celou šířku + Země nad obzorem. */
    .moon-surface img.moon-band {
      height: var(--moon-band-h, 72px);
    }

    .moon-surface img.moon-earth {
      left: auto;
      right: 9%;
      bottom: calc(var(--moon-band-h, 72px) * 0.62);
      width: auto;
      height: calc(var(--moon-band-h, 72px) * 1.35);
    }

    /* Země: zelený pás přes celou šířku, tráva se stromem v pevné výšce uprostřed. */
    .earth-grass::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--grass-green, 64px);
      background: #57d976;
    }

    .earth-grass img {
      left: 4%;
      right: auto;
      width: auto;
      height: calc(var(--grass-green, 64px) * 415 / 83);
      transform: none;
    }

    .earth-grass { opacity: 1; }
    .moon-surface { opacity: 0; }
    body.env-moon .earth-grass,
    body.env-weightless .earth-grass { opacity: 0; }
    body.env-moon .moon-surface { opacity: 1; }

    .viz-fit {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .viz-scale-box {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .viz-presentation {
      display: flex;
      align-items: center;
      gap: clamp(14px, 3.5vw, 28px);
      transform-origin: 0 0;
    }

    .ball-visual.is-hidden { display: none; }

    .ground-art {
      position: absolute;
      bottom: 0;
      left: calc(var(--scene-label-pad) + var(--scene-content-width) * 0.5);
      z-index: 0;
      display: block;
      width: calc(990 / 345 * var(--scene-content-width) * var(--grass-scale));
      max-width: none;
      height: auto;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    .ground-grass { display: none; }

    .ground-weightless {
      display: none;
      opacity: 0.85;
    }

    .device-stage.env-moon .ground-grass,
    .device-stage.env-weightless .ground-grass,
    .device-stage.env-weightless .ground-weightless { display: none; }

    .device-stage {
      --scene-content-width: 345px;
      --scene-label-pad: 55px;
      --scene-stage-width: calc(var(--scene-content-width) + var(--scene-label-pad));
      --grass-scale: 0.56;
      /* Spodek povrchu (y≈415) → horní hrana zeleného valu (y≈332.5) */
      --grass-ground-lift: 0px;
      flex: 0 0 auto;
      position: relative;
      width: var(--scene-stage-width);
      /* Bez max-width: jinak se v shrink-to-fit rodiči přístroj zúží a změří menší. */
      max-width: none;
      min-height: 0;
    }

    .scene-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 0;
      margin-bottom: var(--grass-ground-lift);
      overflow: visible;
      display: flex;
      flex-direction: column;
      aspect-ratio: 400 / 750;
    }

    /* Pevná šířka slotu = nejširší popisek; přístroj se při přepnutí neposune. */
    /* Levý sloupec plátna: údaje o tělese a pod nimi prostředí (g). */
    .viz-side {
      flex: 0 0 auto;
      display: grid;
      justify-items: start;
      gap: 14px;
    }

    .sim-label-slot {
      position: relative;
      padding-left: 4px;
    }

    .sim-label-slot .sim-label {
      display: none;
      width: auto;
      height: 72px;
      pointer-events: none;
      user-select: none;
    }

    body.env-earth .sim-label-earth,
    body.env-moon .sim-label-moon,
    body.env-weightless .sim-label-weightless { display: block; }

    .scene-svg {
      display: block;
      overflow: visible;
      width: 100%;
      height: auto;
      flex: 0 0 auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    .scene-svg.idle-ball #ball .ball-body,
    .scene-svg.idle-ball #ballObject { cursor: ns-resize; }

    .scene-height-label {
      pointer-events: none;
      user-select: none;
    }

    .scene-height-label text {
      font-size: 28px;
      font-weight: 600;
      fill: #334155;
    }

    body.env-moon .scene-height-label text,
    body.env-weightless .scene-height-label text {
      fill: #fff;
      stroke: rgba(0, 0, 0, 0.45);
      stroke-width: 4px;
      paint-order: stroke fill;
    }

    /* Stupnice měřiče na tmavém vesmírném pozadí (Měsíc, stav beztíže). */
    body.env-moon #energyScale text,
    body.env-weightless #energyScale text,
    body.env-moon #peakMarks text,
    body.env-weightless #peakMarks text { fill: #fff; }

    body.env-moon #energyScale line,
    body.env-weightless #energyScale line { stroke: #fff; }

    /* ---------- Mobil ---------- */

    @media (max-width: 760px) {
      html, body {
        height: auto;
        overflow: auto;
      }

      .app {
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
        overflow: visible;
        padding-left: max(10px, env(safe-area-inset-left, 0px));
        padding-right: max(10px, env(safe-area-inset-right, 0px));
        padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
        padding-top: max(8px, env(safe-area-inset-top, 0px));
        gap: 12px;
      }

      .setup-panel {
        order: 2;
        flex: 0 1 auto;
        width: 100%;
        overflow: visible;
      }

      .viz-column {
        order: 1;
        flex: 0 0 auto;
        height: min(70dvh, 560px);
        width: 100%;
        padding: 56px 8px var(--ground-band, 8px);
      }

      .panel-title { font-size: 28px; }

      .sim-empty-hint {
        font-size: 15px;
        padding: 8px 14px;
      }

      .viz-topbar {
        top: 10px;
        left: 10px;
        right: 10px;
        gap: 8px;
      }

      .body-info {
        min-width: 0;
        padding: 6px 10px 8px;
        font-size: 15px;
      }

      .body-info__name { font-size: 11px; }

      .viz-side { gap: 6px; }
      .sim-label-slot .sim-label { height: 44px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="setup-panel" aria-label="Ovládání simulace">
      <div class="panel-copy">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="panel-title">Potenciální energie</h1>
      </div>

      <section class="panel-section" aria-label="Prostředí">
        <span class="panel-label">Prostředí</span>
        <div class="env-toggle" id="envToggle" role="radiogroup" aria-label="Prostředí simulace"></div>
        <span class="panel-note">Tíhové zrychlení g = <span id="valGravity">—</span></span>
      </section>

      <section class="panel-section" aria-label="Těleso">
        <span class="panel-label">Typ tělesa</span>
        <div class="body-kind-toggle" id="bodyKindToggle" role="radiogroup" aria-label="Typ tělesa"></div>
        <span class="panel-label panel-label--sub" id="itemPickerLabel">Koule</span>
        <div class="ball-picker" id="ballPicker" role="radiogroup" aria-label="Výběr tělesa"></div>
      </section>

      <section class="panel-section" aria-label="Výška tělesa">
        <label class="panel-label" id="heightSliderLabel" for="sliderHeight">Výška koule</label>
        <div class="range-control">
          <input type="range" id="sliderHeight" class="range-slider" min="0" max="2" step="0.01" value="1" />
          <output class="range-value" id="heightValue" for="sliderHeight">1 m</output>
        </div>
      </section>

      <section class="panel-section">
        <div class="actions-row" aria-label="Akce simulace">
          <button type="button" id="btnRun" class="action-btn action-btn--run">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.14v13.72L19 12 8 5.14z"/>
            </svg>
            Spustit pád
          </button>
          <button type="button" id="btnReset" class="action-btn action-btn--reset">

  <script>
(function () {
  const W = 345;
  const H = 750;
  /** Spodek koule při 0 m = horní hrana plošiny. */
  const PLATFORM_Y_UP = 623;
  const PLATFORM_Y_DOWN = 632;
  const PLATFORM_SINK = PLATFORM_Y_DOWN - PLATFORM_Y_UP;
  const BALL_X = 124.5;
  const LAUNCHER_CX = 261.5;
  const LAUNCHER_R = 9.5;
  const ELLIPSE_REST_CY = 731.5;
  const RAIL_CAP_MIN = 18;
  const PLATFORM_STEM_TOP_UP = 630.5;
  const PLATFORM_STEM_TOP_DOWN = 639.5;
  const PLATFORM_STEM_BOTTOM_UP = 652;
  const PLATFORM_STEM_BOTTOM_DOWN = 661;
  /** Maximum energie = horní okraj tyče; polovina tyče = MAX/2. */
  const MAX_ENERGY_J = 60;
  const REF_ENERGY_J = MAX_ENERGY_J / 2;
  const PEAK_MARK_RX = 22;
  const PEAK_MARK_COLOR = "#9F1239";
  const ENVIRONMENT_IDS = ["earth", "moon", "weightless"];
  const ENVIRONMENTS = {
    earth: { label: "Země", g: 10 },
    moon: { label: "Měsíc", g: 1.6 },
    weightless: { label: "Stav beztíže", g: 0 },
  };
  /** "Gravitace" elipsy ve scéně (px/s²) – čistě vizuální. */
  const G_ELLIPSE = 1200;
  const BODY_KIND_IDS = ["objects", "balls"];
  const BODY_KINDS = {
    balls: { label: "Koule", pickerLabel: "Koule", heightLabel: "Výška koule" },
    objects: { label: "Předměty", pickerLabel: "Předmět", heightLabel: "Výška předmětu" },
  };
  const BALL_PRESETS = [
    { volumeCm3: 1000, mass: 1, color: "#00805B", stroke: "#101F00" },
    { volumeCm3: 2000, mass: 1, color: "#3CB078", stroke: "#0F3320" },
    { volumeCm3: 100, mass: 1, color: "#005A40", stroke: "#101F00" },
    { volumeCm3: 1000, mass: 2, color: "#006F52", stroke: "#101F00" },
    { volumeCm3: 2000, mass: 2, color: "#1E8A62", stroke: "#0F2A18" },
    { volumeCm3: 100, mass: 2, color: "#004530", stroke: "#101F00" },
    { volumeCm3: 1000, mass: 0.5, color: "#52B890", stroke: "#1A4030" },
    { volumeCm3: 2000, mass: 0.5, color: "#7DC9A8", stroke: "#204530" },
    { volumeCm3: 100, mass: 0.5, color: "#2A8060", stroke: "#101F00" },
  ];
  const OBJECT_PRESETS = [
    {
      id: "melon",
      name: "Meloun",
      volumeCm3: 2500,
      mass: 2.5,
      asset: "assets/meloun.svg",
      viewW: 122,
      viewH: 100,
    },
    {
      id: "goldBar",
      name: "Zlatá cihla",
      volumeCm3: 150,
      mass: 3,
      asset: "assets/zlata-cihla.svg",
      viewW: 148,
      viewH: 88,
      displayScale: 0.9,
    },
    {
      id: "bottle",
      name: "Láhev",
      volumeCm3: 1000,
      mass: 1,
      asset: "assets/lahev.svg",
      viewW: 255,
      viewH: 87,
      displayScale: 0.7,
    },
    {
      id: "ball",
      name: "Míč",
      volumeCm3: 2500,
      mass: 0.2,
      asset: "assets/mic.svg",
      viewW: 66,
      viewH: 66,
    },
    {
      id: "stone",
      name: "Kámen",
      volumeCm3: 400,
      mass: 1,
      asset: "assets/kamen.svg",
      viewW: 90,
      viewH: 48,
      displayScale: 0.81,
    },
  ];
  const SVG_NS = "http://www.w3.org/2000/svg";
  const objectSpriteCache = new Map();
  const objectSpritesReady = Promise.all(
    OBJECT_PRESETS.map((preset) => {
      return fetch(preset.asset)
        .then((res) => {
          if (!res.ok) throw new Error(`Nelze načíst ${preset.asset}`);
          return res.text();
        })
        .then((svgText) => {
          const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
          const root = doc.documentElement;
          const wrap = document.createElementNS(SVG_NS, "g");
          wrap.setAttribute("class", "object-sprite-inner");
          wrap.setAttribute(
            "transform",
            `translate(${-preset.viewW / 2} ${-preset.viewH})`
          );
          Array.from(root.childNodes).forEach((node) => {
            if (node.nodeType === Node.ELEMENT_NODE) {
              wrap.appendChild(node.cloneNode(true));
            }
          });
          objectSpriteCache.set(preset.id, wrap);
        });
    })
  );
  const DEFAULT_BALL_INDEX = 0;
  const DEFAULT_OBJECT_INDEX = 0;
  const MAX_BALL_RADIUS_PX = 55.5;
  const BALL_SHAPE_R = 54.75;
  /** 2000 cm³ = největší koule ve scéně. */
  const PX_PER_CM =
    MAX_BALL_RADIUS_PX /
    Math.cbrt((3 * 2000) / (4 * Math.PI));
  const HEIGHT_M_MIN = 0;
  const HEIGHT_M_MAX = 2;
  /** Horní okraj koule při 2 m (menší y = výš ve scéně). */
  const BALL_TOP_AT_2M_PX = 58;
  const DEFAULT_VOLUME_CM3 = BALL_PRESETS[DEFAULT_BALL_INDEX].volumeCm3;
  const SWATCH_MAX_DIAM_PX = 28;
  const MIN_ELLIPSE_PEAK_PX = 10;
  const ELLIPSE_TOP_MARGIN_PX = 8;
  const RAIL_TOP_Y = 63;

  function maxEllipsePeakPx() {
    const minCenterY = RAIL_TOP_Y + LAUNCHER_R + ELLIPSE_TOP_MARGIN_PX;
    return Math.max(0, ELLIPSE_REST_CY - minCenterY);
  }

  /** E [J] → výška značky [px]: 30 J = polovina tyče, 60 J = maximum. */
  const ENERGY_TO_HEIGHT = maxEllipsePeakPx() / MAX_ENERGY_J;

  const scene = document.getElementById("scene");
  const ballEl = document.getElementById("ball");
  const ballSphereEl = document.getElementById("ballSphere");
  const ballObjectEl = document.getElementById("ballObject");
  const ballBodyEl = document.querySelector("#ball .ball-body");
  const launcherEl = document.getElementById("launcher");
  const railFillEl = document.getElementById("railFill");
  const platformEl = document.getElementById("platform");
  const platformStemEl = document.getElementById("platformStem");
  const headerDotsEl = document.getElementById("headerDots");
  const headerEnergyEl = document.getElementById("headerEnergy");
  const headerEnergyValueEl = document.getElementById("headerEnergyValue");
  const peakMarksEl = document.getElementById("peakMarks");
  const ballPickerEl = document.getElementById("ballPicker");
  const bodyKindToggleEl = document.getElementById("bodyKindToggle");
  const itemPickerLabelEl = document.getElementById("itemPickerLabel");
  const heightSliderLabelEl = document.getElementById("heightSliderLabel");
  const envToggleEl = document.getElementById("envToggle");
  const deviceStageEl = document.getElementById("deviceStage");
  const vizPresentationEl = document.getElementById("vizPresentation");
  const vizFitEl = document.getElementById("vizFit");
  const vizScaleBoxEl = document.getElementById("vizScaleBox");
  const objectHeightTextEl = document.getElementById("objectHeightText");
  const valGravity = document.getElementById("valGravity");
  const btnRun = document.getElementById("btnRun");
  const btnReset = document.getElementById("btnReset");
  const sliderHeight = document.getElementById("sliderHeight");
  // Pozn.: výšku elipsy už nezobrazujeme, proto tu není readHeight.

  const state = {
    environment: "earth",
    bodyKind: "objects",
    itemIndex: DEFAULT_OBJECT_INDEX,
    volumeCm3: OBJECT_PRESETS[DEFAULT_OBJECT_INDEX].volumeCm3,
    radius: 0,
    mass: OBJECT_PRESETS[DEFAULT_OBJECT_INDEX].mass,
    ballHeightM: 0,
    fallStartHeightM: 0,
    ballVy: 0,
    ballY: 0,
    ellipseY: ELLIPSE_REST_CY,
    ellipseVy: 0,
    mode: "idle",
    impactHandled: false,
    currentPeak: 0,
    lastPeak: 0,
    peakMarks: [],
    platformSunk: false,
    showHeaderEnergy: false,
    showZeroEnergy: false,
    ellipseWasAscending: false,
    dragging: false,
  };

  let rafId = 0;
  let lastTs = 0;

  function restBottomY() {
    return PLATFORM_Y_UP;
  }

  function fallLandBallY(r) {
    return PLATFORM_Y_DOWN - r;
  }

  function restorePlatformUp() {
    if (!state.platformSunk) return;
    state.platformSunk = false;
    state.ballY = heightMToBallY(state.ballHeightM, state.radius);
  }

  function volumeCm3ToRadiusPx(volumeCm3) {
    const rCm = Math.cbrt((3 * volumeCm3) / (4 * Math.PI));
    return rCm * PX_PER_CM;
  }

  function presetSwatchDiameterPx(volumeCm3) {
    const maxR = volumeCm3ToRadiusPx(2000);
    const r = volumeCm3ToRadiusPx(volumeCm3);
    return Math.max(10, (r / maxR) * SWATCH_MAX_DIAM_PX);
  }

  function getGravity() {
    return ENVIRONMENTS[state.environment].g;
  }

  function getPresets() {
    return state.bodyKind === "objects" ? OBJECT_PRESETS : BALL_PRESETS;
  }

  function getCurrentPreset() {
    return getPresets()[state.itemIndex];
  }

  function formatPresetMass(preset) {
    if (preset.mass < 0.1) {
      return `${formatNum(preset.mass * 1000, 1)} g`;
    }
    return `${formatNum(preset.mass, 1)} kg`;
  }

  function itemPresetLabel(preset) {
    const specs = `${formatNum(preset.volumeCm3, 0)} cm³ ${formatPresetMass(preset)}`;
    return preset.name ? `${preset.name} · ${specs}` : specs;
  }

  function applyBodyKindUI() {
    const kind = BODY_KINDS[state.bodyKind];
    itemPickerLabelEl.textContent = kind.pickerLabel;
    heightSliderLabelEl.textContent = kind.heightLabel;
    ballPickerEl.setAttribute(
      "aria-label",
      state.bodyKind === "objects" ? "Výběr předmětu" : "Výběr koule"
    );
    renderBodyKindToggle();
    renderItemPicker();
  }

  function renderBodyKindToggle() {
    bodyKindToggleEl.innerHTML = "";
    BODY_KIND_IDS.forEach((id) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className =
        "body-kind-option" + (id === state.bodyKind ? " selected" : "");
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-checked", id === state.bodyKind ? "true" : "false");
      btn.textContent = BODY_KINDS[id].label;
      btn.disabled = state.mode !== "idle";
      btn.addEventListener("click", () => {
        if (state.mode !== "idle" || id === state.bodyKind) return;
        state.bodyKind = id;
        state.itemIndex = 0;
        applyBodyKindUI();
        const finishBodyKindSwitch = () => {
          applyItemPreset(0);
          resetSimulation();
        };
        if (id === "objects") {
          objectSpritesReady.then(finishBodyKindSwitch);
        } else {
          finishBodyKindSwitch();
        }
      });
      bodyKindToggleEl.appendChild(btn);
    });
  }

  function renderEnvToggle() {
    envToggleEl.innerHTML = "";
    Object.entries(ENVIRONMENTS).forEach(([id, env]) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className =
        "env-option" + (id === state.environment ? " selected" : "");
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-checked", id === state.environment ? "true" : "false");
      btn.textContent = env.label;
      btn.disabled = state.mode !== "idle";
      btn.addEventListener("click", () => {
        if (state.mode !== "idle" || id === state.environment) return;
        state.environment = id;
        applyEnvironmentUI();
        resetSimulation({ keepHeight: true });
      });
      envToggleEl.appendChild(btn);
    });
  }

  function applyEnvironmentUI() {
    const envClass = "env-" + state.environment;
    const envClasses = ENVIRONMENT_IDS.map((id) => "env-" + id);
    document.body.classList.remove(...envClasses);
    document.body.classList.add(envClass);
    deviceStageEl.classList.remove(...envClasses);
    deviceStageEl.classList.add(envClass);
    vizPresentationEl.classList.remove(...envClasses);
    vizPresentationEl.classList.add(envClass);
    valGravity.textContent = `${formatNum(getGravity(), 1)} N/kg`;
    renderEnvToggle();
    fitVizToScreen();
  }

  function layoutMoonSurface() {
    if (!deviceStageEl) return;

    const stageRect = deviceStageEl.getBoundingClientRect();
    const cs = getComputedStyle(deviceStageEl);
    const contentW = parseFloat(cs.getPropertyValue("--scene-content-width"));
    const labelPad = parseFloat(cs.getPropertyValue("--scene-label-pad"));
    const grassScale = parseFloat(cs.getPropertyValue("--grass-scale"));
    const stageNaturalW = contentW + labelPad;
    if (!(stageNaturalW > 0) || !(stageRect.width > 0)) return;

    const scale = stageRect.width / stageNaturalW;
    const colEl = document.getElementById("vizColumn");
    const originX = colEl ? colEl.getBoundingClientRect().left : 0;
    const centerX = stageRect.left - originX + (labelPad + contentW * 0.5) * scale;
    const originBottom = colEl ? colEl.getBoundingClientRect().bottom : stageRect.bottom;
    /* Povrch Měsíce sedí pod přístrojem stejně jako tráva na Zemi. */
    document.documentElement.style.setProperty(
      "--ground-surface-bottom",
      `${Math.max(0, originBottom - stageRect.bottom)}px`
    );
    const width = (990 / 345) * contentW * grassScale * scale;

    document.documentElement.style.setProperty(
      "--ground-surface-center-x",
      `${centerX}px`
    );
    document.documentElement.style.setProperty(
      "--ground-surface-width",
      `${width}px`
    );
  }

  /** Horní hrana povrchu v assetu (y / výška obrázku): tráva 332/415, Měsíc ~470/533 uprostřed. */
  /** Pás měsíčního povrchu: výška podle plátna; vrchol oblouku je ve 20/120 výšky pásu. */
  const MOON_BAND_TOP = 20 / 120;

  function layoutGroundBand() {
    const colEl = document.getElementById("vizColumn");
    if (!colEl) return;
    /* Stejná výška země ve všech prostředích → přístroj má všude stejnou velikost
       (i ve stavu beztíže, kde povrch není vidět). */
    const ground = Math.round(Math.min(80, Math.max(44, colEl.clientHeight * 0.08)));
    colEl.style.setProperty("--grass-green", `${ground}px`);
    colEl.style.setProperty(
      "--moon-band-h",
      `${Math.round((ground + 2) / (1 - MOON_BAND_TOP))}px`
    );
    colEl.style.setProperty("--ground-band", `${ground}px`);
  }

  function fitVizToScreen() {
    if (!vizFitEl || !vizScaleBoxEl || !vizPresentationEl) return;
    layoutGroundBand();

    const availW = vizFitEl.clientWidth;
    const availH = vizFitEl.clientHeight;
    if (availW <= 0 || availH <= 0) return;

    vizPresentationEl.style.transform = "none";
    vizScaleBoxEl.style.width = "";
    vizScaleBoxEl.style.height = "";

    const naturalW = vizPresentationEl.offsetWidth;
    const naturalH = vizPresentationEl.offsetHeight;
    if (naturalW <= 0 || naturalH <= 0) return;

    const scale = Math.min(availW / naturalW, availH / naturalH, 1.6);
    vizScaleBoxEl.style.width = `${naturalW * scale}px`;
    vizScaleBoxEl.style.height = `${naturalH * scale}px`;
    vizPresentationEl.style.transform = `scale(${scale})`;
    /* Na úzkém displeji se přístroj zúží víc, než odpovídá naturalW/H — box stáhnout
       na skutečnou velikost, aby přístroj stál na povrchu. */
    const realRect = vizPresentationEl.getBoundingClientRect();
    if (realRect.height > 0 && realRect.height < naturalH * scale - 1) {
      vizScaleBoxEl.style.height = `${realRect.height}px`;
    }
    layoutMoonSurface();
  }

  let fitVizFrame = 0;
  function scheduleFitVizToScreen() {
    cancelAnimationFrame(fitVizFrame);
    fitVizFrame = requestAnimationFrame(fitVizToScreen);
  }

  if (vizFitEl) {
    new ResizeObserver(scheduleFitVizToScreen).observe(vizFitEl);
    const appEl = document.querySelector(".app");
    if (appEl) new ResizeObserver(scheduleFitVizToScreen).observe(appEl);
    window.addEventListener("load", scheduleFitVizToScreen);
    window.addEventListener("resize", scheduleFitVizToScreen);
  }

  function renderItemPicker() {
    ballPickerEl.innerHTML = "";
    getPresets().forEach((preset, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ball-option" + (index === state.itemIndex ? " selected" : "");
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-checked", index === state.itemIndex ? "true" : "false");
      btn.disabled = state.mode !== "idle";

      const swatchWrap = document.createElement("span");
      swatchWrap.className = "ball-swatch-wrap";

      if (state.bodyKind === "objects") {
        const swatch = document.createElement("img");
        swatch.className = "object-swatch";
        swatch.src = preset.asset;
        swatch.width = preset.viewW;
        swatch.height = preset.viewH;
        swatch.alt = "";
        const displayScale = preset.displayScale ?? 1;
        const scale =
          (presetSwatchDiameterPx(preset.volumeCm3) / preset.viewH) * displayScale;
        swatch.style.width = `${Math.round(preset.viewW * scale)}px`;
        swatch.style.height = `${Math.round(preset.viewH * scale)}px`;
        swatchWrap.appendChild(swatch);
      } else {
        const swatch = document.createElement("span");
        swatch.className = "ball-swatch";
        const diam = Math.round(presetSwatchDiameterPx(preset.volumeCm3));
        swatch.style.width = `${diam}px`;
        swatch.style.height = `${diam}px`;
        swatch.style.background = preset.color;
        swatch.style.border = `1.5px solid ${preset.stroke}`;
        swatchWrap.appendChild(swatch);
      }

      const label = document.createElement("span");
      label.className = "ball-option-label";
      if (preset.name) {
        const nameEl = document.createElement("span");
        nameEl.className = "ball-option-name";
        nameEl.textContent = preset.name;
        const specsEl = document.createElement("span");
        specsEl.className = "ball-option-specs";
        specsEl.textContent = `${formatNum(preset.volumeCm3, 0)} cm³ · ${formatPresetMass(preset)}`;
        label.append(nameEl, specsEl);
      } else {
        const specsEl = document.createElement("span");
        specsEl.className = "ball-option-specs";
        specsEl.textContent = `${formatNum(preset.volumeCm3, 0)} cm³ · ${formatPresetMass(preset)}`;
        label.appendChild(specsEl);
      }

      btn.append(swatchWrap, label);
      btn.addEventListener("click", () => {
        if (state.mode !== "idle") return;
        const applySelection = () => {
          if (index !== state.itemIndex) {
            applyItemPreset(index);
            setBallHeightM(heightFromHeightSlider());
          }
          updateLabels();
        };
        if (state.bodyKind === "objects") {
          objectSpritesReady.then(applySelection);
        } else if (index === state.itemIndex) {
          return;
        } else {
          applyItemPreset(index);
          setBallHeightM(heightFromHeightSlider());
          updateLabels();
        }
      });
      ballPickerEl.appendChild(btn);
    });
  }

  function setBodyVisualKind() {
    const showObject = state.bodyKind === "objects";
    ballSphereEl.classList.toggle("is-hidden", showObject);
    ballObjectEl.classList.toggle("is-hidden", !showObject);
  }

  function mountObjectSprite(preset) {
    const cached = objectSpriteCache.get(preset.id);
    if (cached) {
      ballObjectEl.replaceChildren(cached.cloneNode(true));
    }
  }

  function applyItemPreset(index) {
    const preset = getPresets()[index];
    state.itemIndex = index;
    state.volumeCm3 = preset.volumeCm3;
    state.mass = preset.mass;
    state.radius =
      volumeCm3ToRadiusPx(preset.volumeCm3) * (preset.displayScale ?? 1);
    if (state.bodyKind === "objects") {
      mountObjectSprite(preset);
    }
  }

  function heightFromHeightSlider() {
    return parseFloat(sliderHeight.value);
  }

  // 0 m = plošina, 2 m = horní okraj koule v BALL_TOP_AT_2M_PX.
  const refStartRadius = volumeCm3ToRadiusPx(DEFAULT_VOLUME_CM3);
  const INITIAL_BALL_Y_PX = BALL_TOP_AT_2M_PX + refStartRadius;
  const HEIGHT_PX_PER_M =
    (PLATFORM_Y_UP - (INITIAL_BALL_Y_PX + refStartRadius)) / HEIGHT_M_MAX;

  function heightAboveFloorPx(ballY, r) {
    return PLATFORM_Y_UP - (ballY + r);
  }

  function heightMToBallY(heightM, r) {
    const h = clampHeightM(heightM);
    const bottomY = PLATFORM_Y_UP - h * HEIGHT_PX_PER_M;
    return bottomY - r;
  }

  function ballYToHeightM(ballY, r) {
    const hPx = heightAboveFloorPx(ballY, r);
    return clampHeightM(hPx / HEIGHT_PX_PER_M);
  }

  const INITIAL_HEIGHT_M = 1;

  function clampBallYPx(y, r) {
    // Ořez dle nejnižšího bodu: spodek nesmí jít nad margin ani pod podlahu.
    const minBottomY = PLATFORM_Y_UP - HEIGHT_M_MAX * HEIGHT_PX_PER_M;
    const maxBottomY = PLATFORM_Y_UP;
    const bottomY = Math.min(maxBottomY, Math.max(minBottomY, y + r));
    return bottomY - r;
  }

  function clampHeightM(heightM) {
    return Math.min(HEIGHT_M_MAX, Math.max(HEIGHT_M_MIN, heightM));
  }

  // (původní mapování závislé na poloměru odstraněno)

  function setBallHeightM(heightM) {
    if (state.mode === "idle") {
      restorePlatformUp();
    }
    const h = clampHeightM(heightM);
    state.ballHeightM = h;
    state.ballY = heightMToBallY(h, state.radius);
    sliderHeight.value = String(h);
    return h;
  }

  function formatNum(n, digits) {
    return n.toLocaleString("cs-CZ", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits,
    });
  }

  function formatEnergyDisplay(energyJ) {
    return formatNum(energyJ, 2) + " J";
  }

  /** Stupnice měřiče: dílky po 5 J, popisky po 10 J (vlevo od trubice). */
  function drawEnergyScale() {
    const g = document.getElementById("energyScale");
    if (!g) return;
    const x = 283;
    for (let e = 0; e <= MAX_ENERGY_J; e += 5) {
      const y = ELLIPSE_REST_CY - e * ENERGY_TO_HEIGHT;
      const major = e % 10 === 0;
      const tick = document.createElementNS(SVG_NS, "line");
      tick.setAttribute("x1", String(x));
      tick.setAttribute("x2", String(x + (major ? 12 : 7)));
      tick.setAttribute("y1", String(y));
      tick.setAttribute("y2", String(y));
      tick.setAttribute("stroke", "#3E3E3E");
      tick.setAttribute("stroke-width", major ? "2.5" : "1.5");
      tick.setAttribute("stroke-linecap", "round");
      g.appendChild(tick);
      if (major) {
        const t = document.createElementNS(SVG_NS, "text");
        t.setAttribute("x", String(x + 16));
        t.setAttribute("y", String(y + 5));
        t.setAttribute("text-anchor", "start");
        t.setAttribute("font-size", "14");
        t.setAttribute("fill", "#3E3E3E");
        t.textContent = e + " J";
        g.appendChild(t);
      }
    }
  }
  drawEnergyScale();

  function updatePeakMarks() {
    while (peakMarksEl.firstChild) {
      peakMarksEl.removeChild(peakMarksEl.firstChild);
    }
    state.peakMarks.forEach((peakPx, index) => {
      const y = ELLIPSE_REST_CY - peakPx;
      const lineEl = document.createElementNS(SVG_NS, "line");
      lineEl.setAttribute("x1", String(LAUNCHER_CX - PEAK_MARK_RX));
      lineEl.setAttribute("y1", String(y));
      lineEl.setAttribute("x2", String(LAUNCHER_CX + PEAK_MARK_RX));
      lineEl.setAttribute("y2", String(y));
      lineEl.setAttribute("stroke", PEAK_MARK_COLOR);
      lineEl.setAttribute("stroke-width", "3");
      lineEl.setAttribute("stroke-linecap", "round");
      peakMarksEl.appendChild(lineEl);

      const numberEl = document.createElementNS(SVG_NS, "text");
      numberEl.setAttribute("x", String(LAUNCHER_CX - PEAK_MARK_RX - 5));
      numberEl.setAttribute("y", String(y + 4));
      numberEl.setAttribute("text-anchor", "end");
      numberEl.setAttribute("font-size", "11");
      numberEl.setAttribute("font-weight", "700");
      numberEl.setAttribute("fill", PEAK_MARK_COLOR);
      numberEl.textContent = String(index + 1);
      peakMarksEl.appendChild(numberEl);
    });
  }

  const heightValueEl = document.getElementById("heightValue");
  const hintEl = document.getElementById("hintEl");

  const bodyInfoNameEl = document.getElementById("bodyInfoName");
  const bodyInfoVolumeEl = document.getElementById("bodyInfoVolume");
  const bodyInfoMassEl = document.getElementById("bodyInfoMass");

  function updateBodyInfo() {
    const preset = getCurrentPreset();
    if (!preset) return;
    if (bodyInfoNameEl) bodyInfoNameEl.textContent = preset.name || "Koule";
    if (bodyInfoVolumeEl) bodyInfoVolumeEl.textContent = formatNum(preset.volumeCm3, 0);
    if (bodyInfoMassEl) bodyInfoMassEl.textContent = formatPresetMass(preset);
  }

  function updatePanelStats() {
    updateBodyInfo();
    if (sliderHeight) {
      const min = Number(sliderHeight.min);
      const max = Number(sliderHeight.max);
      const v = Number(sliderHeight.value);
      sliderHeight.style.setProperty("--fill", `${((v - min) / (max - min)) * 100}%`);
      if (heightValueEl) heightValueEl.textContent = `${formatNum(v, 2)} m`;
    }
  }

  function updateSceneVisuals() {
    const platformY = state.platformSunk ? PLATFORM_Y_DOWN : PLATFORM_Y_UP;
    const stemTop = state.platformSunk
      ? PLATFORM_STEM_TOP_DOWN
      : PLATFORM_STEM_TOP_UP;
    const stemBottom = state.platformSunk
      ? PLATFORM_STEM_BOTTOM_DOWN
      : PLATFORM_STEM_BOTTOM_UP;

    platformEl.setAttribute("y", String(platformY));
    platformStemEl.setAttribute(
      "d",
      `M125.5 ${stemTop}V${stemBottom}`
    );

    const railFillPx = Math.max(
      0,
      ELLIPSE_REST_CY - state.ellipseY
    );
    const fillH = RAIL_CAP_MIN + railFillPx;
    railFillEl.setAttribute("height", String(fillH));
    railFillEl.setAttribute("rx", fillH <= 20 ? "9" : "10");

    const showEnergyOnHeader =
      state.showHeaderEnergy && (state.lastEnergy > 0 || state.showZeroEnergy);
    headerDotsEl.setAttribute("visibility", showEnergyOnHeader ? "hidden" : "visible");
    updatePanelStats();
    headerEnergyEl.setAttribute("visibility", showEnergyOnHeader ? "visible" : "hidden");
    headerEnergyValueEl.setAttribute("visibility", showEnergyOnHeader ? "visible" : "hidden");
    if (showEnergyOnHeader) {
      headerEnergyValueEl.textContent = formatEnergyDisplay(
        state.showZeroEnergy ? 0 : state.lastEnergy
      );
    } else {
      headerEnergyValueEl.textContent = "—";
    }
  }

  function objectHalfWidthPx() {
    const preset = getCurrentPreset();
    if (state.bodyKind === "objects") {
      return state.radius * (preset.viewW / preset.viewH);
    }
    return state.radius;
  }

  function formatHeightDisplay(heightM) {
    const rounded = Math.round(heightM * 100) / 100;
    if (rounded <= 0) return "0 m";
    return `${formatNum(rounded, 2)} m`;
  }

  function updateObjectHeightLabel() {
    if (!objectHeightTextEl) return;

    const heightM = ballYToHeightM(state.ballY, state.radius);
    objectHeightTextEl.textContent = formatHeightDisplay(heightM);
    objectHeightTextEl.setAttribute("x", String(BALL_X - objectHalfWidthPx() - 10));
    objectHeightTextEl.setAttribute("y", String(state.ballY));
    objectHeightTextEl.setAttribute("text-anchor", "end");
    objectHeightTextEl.setAttribute("dominant-baseline", "middle");
  }

  function updateLabels() {
    updateObjectHeightLabel();
    const preset = getCurrentPreset();
    setBodyVisualKind();
    if (state.bodyKind === "objects") {
      mountObjectSprite(preset);
      const scale = (2 * state.radius) / preset.viewH;
      ballEl.setAttribute(
        "transform",
        `translate(${BALL_X} ${state.ballY + state.radius}) scale(${scale})`
      );
    } else {
      ballEl.setAttribute(
        "transform",
        `translate(${BALL_X} ${state.ballY}) scale(${state.radius / BALL_SHAPE_R})`
      );
      ballBodyEl.setAttribute("fill", preset.color);
      ballBodyEl.setAttribute("stroke", preset.stroke);
    }
    launcherEl.setAttribute("cx", String(LAUNCHER_CX));
    launcherEl.setAttribute("cy", state.ellipseY);
    launcherEl.setAttribute("r", String(LAUNCHER_R));
    updatePeakMarks();
    updateSceneVisuals();
  }

  function setControlsEnabled(on) {
    sliderHeight.disabled = !on;
    btnRun.disabled = !on;
    envToggleEl.querySelectorAll(".env-option").forEach((btn) => {
      btn.disabled = !on;
    });
    bodyKindToggleEl.querySelectorAll(".body-kind-option").forEach((btn) => {
      btn.disabled = !on;
    });
    ballPickerEl.querySelectorAll(".ball-option").forEach((btn) => {
      btn.disabled = !on;
    });
    scene.classList.toggle("idle-ball", on);
  }

  function resetSimulation(options = {}) {
    const keepHeight = options.keepHeight === true;
    const heightM = keepHeight
      ? clampHeightM(heightFromHeightSlider())
      : INITIAL_HEIGHT_M;
    cancelAnimationFrame(rafId);
    applyItemPreset(state.itemIndex);
    state.ballVy = 0;
    state.ballHeightM = 0;
    state.fallStartHeightM = 0;
    state.ellipseY = ELLIPSE_REST_CY;
    state.ellipseVy = 0;
    state.mode = "idle";
    state.impactHandled = false;
    state.currentPeak = 0;
    state.lastPeak = 0;
    state.lastEnergy = 0;
    state.peakMarks = [];
    state.platformSunk = false;
    state.showHeaderEnergy = false;
    state.showZeroEnergy = false;
    state.ellipseWasAscending = false;
    setBallHeightM(heightM);
    renderItemPicker();
    renderEnvToggle();
    renderBodyKindToggle();
    setControlsEnabled(true);
    updateLabels();
  }

  function launchEllipse(impactEnergy) {
    state.lastEnergy = impactEnergy;
    if (impactEnergy <= 0) return;
    const peakPx = Math.min(
      maxEllipsePeakPx(),
      Math.max(MIN_ELLIPSE_PEAK_PX, impactEnergy * ENERGY_TO_HEIGHT)
    );
    state.currentPeak = 0;
    state.targetPeak = peakPx;
    state.ellipseWasAscending = false;
    const v0 = Math.sqrt(2 * G_ELLIPSE * peakPx);
    state.ellipseVy = -v0;
  }

  function onImpact() {
    if (state.impactHandled) return false;
    state.impactHandled = true;
    const energy = state.mass * getGravity() * state.fallStartHeightM;
    state.showHeaderEnergy = true;
    if (energy <= 0) {
      state.lastEnergy = 0;
      state.showZeroEnergy = true;
      updateLabels();
      return false;
    }
    state.showZeroEnergy = false;
    state.platformSunk = true;
    launchEllipse(energy);
    updateLabels();
    return true;
  }

  function step(dt) {
    const r = state.radius;

    if (state.mode === "falling" || state.mode === "idle") {
      if (state.mode === "falling") {
        state.ballVy += getGravity() * dt; // m/s
        state.ballHeightM -= state.ballVy * dt; // m (dolů)
        if (state.ballHeightM <= 0) {
          state.ballHeightM = 0;
          state.ballVy = 0;
          const ellipseLaunched = onImpact();
          if (state.fallStartHeightM > 0) {
            state.platformSunk = true;
            state.ballY = fallLandBallY(r);
          }
          state.mode = ellipseLaunched ? "resting" : "idle";
        } else {
          state.ballY = heightMToBallY(state.ballHeightM, r);
        }
      }
    }

    if (state.ellipseVy !== 0 || state.ellipseY < ELLIPSE_REST_CY - 0.01) {
      state.ellipseVy += G_ELLIPSE * dt;
      state.ellipseY += state.ellipseVy * dt;

      const peak = ELLIPSE_REST_CY - state.ellipseY;
      if (state.ellipseVy < 0) {
        if (peak > state.currentPeak) {
          state.currentPeak = peak;
        }
        state.ellipseWasAscending = true;
      } else if (state.ellipseWasAscending && state.currentPeak > 0) {
        /* Diskrétní krok vrchol mírně podstřelí — značka musí sedět na stupnici (E · ENERGY_TO_HEIGHT). */
        if (state.targetPeak > 0) state.currentPeak = state.targetPeak;
        state.lastPeak = state.currentPeak;
        state.peakMarks.push(state.currentPeak);
        state.ellipseWasAscending = false;
      }

      if (state.ellipseY >= ELLIPSE_REST_CY) {
        state.ellipseY = ELLIPSE_REST_CY;
        state.ellipseVy = 0;
      }
    }
  }

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;

    step(dt);
    updateLabels();

    if (
      state.mode === "falling" ||
      state.ellipseVy !== 0 ||
      state.ellipseY < ELLIPSE_REST_CY - 0.01
    ) {
      rafId = requestAnimationFrame(tick);
    } else {
      // Po úplném doznění animace umožni další spuštění bez resetu.
      state.mode = "idle";
      lastTs = 0;
      setControlsEnabled(true);
    }
  }

  function isEllipseAnimating() {
    return (
      state.ellipseVy !== 0 ||
      state.ellipseY < ELLIPSE_REST_CY - 0.01
    );
  }

  function recoverStuckSimulation() {
    if (state.mode === "falling" || state.mode === "resting") {
      cancelAnimationFrame(rafId);
      rafId = 0;
      lastTs = 0;
      state.mode = "idle";
      state.ballVy = 0;
      setControlsEnabled(true);
    }
  }

  function startFall() {
    if (isEllipseAnimating()) return;
    if (state.mode !== "idle") recoverStuckSimulation();
    if (state.mode !== "idle") return;

    state.ballHeightM = ballYToHeightM(state.ballY, state.radius);
    state.fallStartHeightM = state.ballHeightM;
    if (state.fallStartHeightM <= 0 || getGravity() === 0) {
      state.lastEnergy = 0;
      state.showZeroEnergy = true;
      state.showHeaderEnergy = true;
      updateLabels();
      return;
    }
    state.showZeroEnergy = false;
    state.mode = "falling";
    state.ballVy = 0;
    state.impactHandled = false;
    setControlsEnabled(false);
    lastTs = 0;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function pointerToHeightM(clientY) {
    const rect = scene.getBoundingClientRect();
    const y = ((clientY - rect.top) / rect.height) * H;
    const bottomY = y + state.radius;
    const hPx = PLATFORM_Y_UP - bottomY;
    return clampHeightM(hPx / HEIGHT_PX_PER_M);
  }

  scene.addEventListener("pointerdown", (e) => {
    if (state.mode !== "idle") return;
    const pt = scene.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const ctm = scene.getScreenCTM();
    if (!ctm) return;
    const svgPt = pt.matrixTransform(ctm.inverse());
    const dx = svgPt.x - BALL_X;
    const dy = svgPt.y - state.ballY;
    if (dx * dx + dy * dy > (state.radius + 14) * (state.radius + 14)) return;
    restorePlatformUp();
    updateLabels();
    state.dragging = true;
    scene.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  scene.addEventListener("pointermove", (e) => {
    if (!state.dragging) return;
    setBallHeightM(pointerToHeightM(e.clientY));
    updateLabels();
  });

  function endDrag(e) {
    if (!state.dragging) return;
    state.dragging = false;
    try { scene.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  }
  scene.addEventListener("pointerup", endDrag);
  scene.addEventListener("pointercancel", endDrag);

  sliderHeight.addEventListener("input", () => {
    setBallHeightM(heightFromHeightSlider());
    updateLabels();
  });

  btnRun.addEventListener("click", startFall);

  /* Nápověda na plátně zmizí po první interakci se simulací (panel i plátno). */
  function hideHintOnce() {
    if (hintEl) hintEl.classList.add("is-hidden");
    ["pointerdown", "keydown", "input"].forEach((type) =>
      document.removeEventListener(type, hideHintOnce, true)
    );
  }
  ["pointerdown", "keydown", "input"].forEach((type) =>
    document.addEventListener(type, hideHintOnce, true)
  );
  btnReset.addEventListener("click", resetSimulation);

  applyEnvironmentUI();
  applyBodyKindUI();
  objectSpritesReady
    .then(() => {
      resetSimulation();
      scheduleFitVizToScreen();
    })
    .catch((err) => console.error(err));
  scheduleFitVizToScreen();
})();
  </script>
</body>
</html>
