      <section class="panel-section" aria-label="Nahrávka">

        <div class="rev-stack">

        </div>

      <section class="panel-section" aria-label="Přehrávání">
        <span class="panel-label">Přehrávání</span>

          <div class="rev-play-row">
            <button type="button" id="btnFwd" class="action-btn action-btn--run" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path class="rev-ico" d="M8 5.14v13.72L19 12 8 5.14z"/></svg>
              <span class="rev-lbl">Přehrát normálně</span>
            </button>
            <button type="button" id="btnDlFwd" class="rev-dl-btn" disabled aria-label="Stáhnout nahrávku (WAV)" title="Stáhnout nahrávku (WAV)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
