<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Graf</title>
  <style>
    @font-face {
      font-family: "Fenomen Sans";
      src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf")
        format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --axis: #1e6bb8;
      --grid: rgba(30, 107, 184, 0.22);
      --bg: #f4f7fb;
      --panel: #fff;
      --panel-bg: #ffffff;
      --accent: #3d5a9a;
      --accent-hover: #334b81;
      --text: #171923;
      --muted: #6b7280;
      --border: #e8eaef;
      --focus: #3d5a9a;
      --area-muted: #eceff5;
      --readout-bg: #f4f5f8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    label {
      font-family: inherit;
    }

    .app {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      align-content: stretch;
      gap: clamp(10px, 1.8vw, 20px);
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      margin: 0 auto;
      padding: clamp(8px, 1.2vw, 14px);
      box-sizing: border-box;
      overflow: hidden;
    }

    .viz-column {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.5vh, 16px);
      overflow: hidden;
    }

    .chart-wrap {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-radius: 14px;
      padding: clamp(12px, 1.4vw, 18px) clamp(12px, 1.4vw, 18px) 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      touch-action: none;
    }

    .chart-svg {
      display: block;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      cursor: crosshair;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
    }

    .chart-svg.is-holding-point {
      cursor: grabbing;
    }

    .chart-svg text {
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
      font-family: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
    }

    .point-coord-label {
      pointer-events: none;
    }

    .setup-panel {
      flex: 0 0 min(320px, 36vw);
      align-self: stretch;
      min-height: 0;
      max-height: 100%;
      overflow: auto;
      padding: 18px;
      border-radius: 22px;
      scrollbar-gutter: stable;
      color-scheme: light;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      color: var(--text);
    }

    .panel-title {
      margin: 0 0 6px;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hub-back-to-sims {
      display: inline-flex;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--area-muted);
      color: var(--text);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .hub-back-to-sims:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--readout-bg);
    }

    .controls {
      display: grid;
      gap: 20px;
    }

    .row {
      display: grid;
      gap: 8px;
    }

    .row-label {
      font-weight: 650;
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .collapsible-section > .section-body {
      display: grid;
      gap: 8px;
    }

    .collapsible-section.is-collapsed > .section-body {
      display: none;
    }

    .section-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 2px 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 650;
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      box-shadow: none;
      transform: none;
    }

    .section-toggle:hover:not(:disabled),
    .section-toggle:active:not(:disabled) {
      background: transparent;
      border: none;
      color: var(--text);
      transform: none;
      filter: none;
    }

    .section-toggle-chevron {
      flex: 0 0 auto;
      font-size: 0.7rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .collapsible-section.is-collapsed .section-toggle-chevron {
      transform: rotate(-90deg);
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .actions-row button {
      flex: 1 1 auto;
      min-width: min(100%, 7rem);
    }

    button {
      font: inherit;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button.secondary {
      background: var(--panel-bg);
      color: var(--accent);
      border-color: var(--border);
    }

    button.secondary:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--readout-bg);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.fit-curve-active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.fit-curve-active:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .fit-mode-row[hidden] {
      display: none !important;
    }

    .fit-mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fit-mode-switch button {
      flex: 1 1 auto;
      min-width: min(100%, 6.5rem);
    }

    .points-table-section {
      flex: 0 0 auto;
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 8px 10px;
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .points-table-section[hidden] {
      display: none !important;
    }

    .points-table-wrap {
      overflow-x: auto;
      min-width: 0;
      -webkit-overflow-scrolling: touch;
    }

    .points-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }

    .points-table th,
    .points-table td {
      border: 1px solid var(--border);
      padding: 0;
      vertical-align: middle;
    }

    .points-table td {
      min-width: 0;
      height: 1px;
    }

    .points-table th {
      width: clamp(3.25rem, 12vw, 5.25rem);
      background: var(--readout-bg);
      font-size: 0.8125rem;
      font-weight: 650;
      color: var(--muted);
      text-align: left;
      white-space: nowrap;
      line-height: 1.2;
      padding: 8px 10px;
      overflow: hidden;
    }

    .points-table td input {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 1.625rem;
      box-sizing: border-box;
      border: none;
      background: transparent;
      padding: 3px 2px;
      margin: 0;
      font: inherit;
      font-size: clamp(0.6875rem, 1.6vw, 0.8125rem);
      color: var(--text);
      text-align: center;
      border-radius: 0;
      appearance: none;
    }

    .points-table td input:focus {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
      background: #fff;
    }

    .points-table td input[readonly],
    .custom-field > input.app-numeric-input[readonly],
    .custom-step-input input.app-numeric-input[readonly] {
      cursor: pointer;
    }

    .points-table-section.graph-theme-0 {
      --graph-color: #1e6bb8;
      --graph-muted: rgba(30, 107, 184, 0.14);
    }

    .points-table-section.graph-theme-1 {
      --graph-color: #c62828;
      --graph-muted: rgba(198, 40, 40, 0.14);
    }

    .points-table-section.graph-theme-2 {
      --graph-color: #2e7d32;
      --graph-muted: rgba(46, 125, 50, 0.14);
    }

    .points-table-section[class*="graph-theme"] {
      border-color: var(--graph-color);
    }

    .points-table-section[class*="graph-theme"] .points-table th,
    .points-table-section[class*="graph-theme"] .points-table td {
      border-color: var(--graph-muted);
    }

    .points-table-section[class*="graph-theme"] .points-table th {
      background: var(--graph-muted);
      color: var(--muted);
    }

    .points-table-section[class*="graph-theme"] .points-table td input:focus {
      outline-color: var(--graph-color);
    }

    .graph-select-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
    }

    .graph-select {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
    }

    .graph-select:has(input:checked) {
      color: var(--text);
    }

    .graph-select input {
      width: 1rem;
      height: 1rem;
      margin: 0;
      accent-color: var(--graph-color, var(--accent));
    }

    .graph-select-swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .graph-select--0 {
      --graph-color: #1e6bb8;
    }

    .graph-select--1 {
      --graph-color: #c62828;
    }

    .graph-select--2 {
      --graph-color: #2e7d32;
    }

    .graph-select--0 .graph-select-swatch {
      background: #1e6bb8;
    }

    .graph-select--1 .graph-select-swatch {
      background: #c62828;
    }

    .graph-select--2 .graph-select-swatch {
      background: #2e7d32;
    }

    .table-keypad-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.42);
    }

    .table-keypad-overlay[hidden] {
      display: none !important;
    }

    .table-keypad-panel {
      width: min(100%, 300px);
      padding: 16px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 14px 42px rgba(15, 23, 42, 0.22);
      display: grid;
      gap: 12px;
    }

    .table-keypad-panel__title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 650;
      color: var(--muted);
      text-align: center;
    }

    .table-keypad-panel__display {
      min-height: 48px;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg);
      font-size: 1.5rem;
      font-weight: 650;
      text-align: center;
      color: var(--text);
    }

    .table-keypad-panel__display.is-invalid {
      border-color: #c62828;
      color: #c62828;
    }

    .table-keypad-panel__error {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 650;
      color: #c62828;
      text-align: center;
    }

    .table-keypad-panel__error[hidden] {
      display: none !important;
    }

    .table-keypad-panel__actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .table-keypad-panel__action {
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .table-keypad-panel__confirm {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px color-mix(in oklab, var(--accent) 35%, transparent);
    }

    .table-keypad-panel__cancel {
      background: var(--panel-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .table-keypad-panel__action:hover {
      filter: brightness(1.05);
    }

    .table-keypad-panel__cancel:hover {
      color: var(--text);
      border-color: color-mix(in oklab, var(--muted) 55%, var(--border));
    }

    .table-keypad-panel__action:active {
      transform: scale(0.97);
    }

    .table-math-keypad {
      width: 100%;
    }

    .table-math-keypad__grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .table-math-keypad__key {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg);
      color: var(--text);
      font: inherit;
      font-size: 1.125rem;
      font-weight: 650;
      cursor: pointer;
    }

    .table-math-keypad__key:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--readout-bg);
    }

    .table-math-keypad__key:active:not(:disabled) {
      background: color-mix(in oklab, var(--accent) 12%, var(--panel-bg));
    }

    .table-math-keypad__key:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .table-math-keypad__key--wide {
      grid-column: 1 / -1;
      font-size: 1rem;
    }

    .custom-axis-settings {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .custom-axis-block {
      margin: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--readout-bg);
      display: grid;
      gap: 8px;
    }

    .custom-axis-block-title {
      font-size: 0.8125rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
      padding: 0;
    }

    .custom-axis-inline-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: end;
    }

    .custom-axis-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      cursor: pointer;
    }

    .custom-axis-check input {
      width: 1rem;
      height: 1rem;
      margin: 0;
      flex: 0 0 auto;
    }

    .custom-axis-check:has(input:disabled) {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.65;
    }

    @media (max-width: 479.98px) {
      .custom-axis-inline-row {
        grid-template-columns: 1fr;
      }
    }

    .custom-field {
      display: grid;
      gap: 4px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .custom-field > input,
    .custom-step-input input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    .custom-step-input {
      position: relative;
      display: block;
    }

    .custom-step-input input {
      padding-right: 2.1rem;
    }

    .custom-step-spin {
      position: absolute;
      top: 1px;
      right: 1px;
      bottom: 1px;
      width: 1.65rem;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-radius: 0 7px 7px 0;
      overflow: hidden;
    }

    .custom-step-btn {
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--readout-bg);
      color: var(--muted);
      padding: 0;
      font-size: 0.62rem;
      line-height: 1;
      cursor: pointer;
      min-height: 0;
    }

    .custom-step-btn:hover {
      background: var(--area-muted);
      color: var(--text);
    }

    .custom-step-btn:active {
      background: var(--border);
    }

    .custom-step-btn + .custom-step-btn {
      border-top: 1px solid var(--border);
    }

    .custom-field > input:focus,
    .custom-step-input input:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .custom-field > input::placeholder,
    .custom-step-input input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .chart-type-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-type-switch button {
      flex: 1 1 auto;
      min-width: min(100%, 6.5rem);
    }

    .line-chart-controls,
    .pie-chart-controls,
    .bar-chart-controls {
      display: grid;
      gap: 20px;
    }

    .line-chart-controls[hidden],
    .pie-chart-controls[hidden],
    .bar-chart-controls[hidden] {
      display: none !important;
    }

    .pie-slices-list {
      display: grid;
      gap: 10px;
    }

    .pie-slice-row,
    .bar-entry-row {
      display: grid;
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--readout-bg);
    }

    .pie-slice-row {
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) auto;
    }

    .bar-entry-row {
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) auto;
    }

    .bar-entry-row.is-dual-value {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.85fr) minmax(0, 0.85fr) auto;
    }

    .bar-value-labels-row[hidden] {
      display: none !important;
    }

    .pie-slice-row .custom-field,
    .bar-entry-row .custom-field {
      min-width: 0;
    }

    .pie-slice-remove {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .pie-slice-remove:hover:not(:disabled) {
      border-color: #c62828;
      color: #c62828;
      background: #fff;
    }

    .pie-slice-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .chart-svg.is-pie-mode,
    .chart-svg.is-bar-mode {
      cursor: default;
    }

    .line-only-action[hidden] {
      display: none !important;
    }

    @media (max-width: 479.98px) {
      .pie-slice-row,
      .bar-entry-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .pie-slice-row .custom-field:first-child,
      .bar-entry-row .custom-field:nth-child(1),
      .bar-entry-row .custom-field:nth-child(2),
      .bar-entry-row.is-dual-value .custom-field:nth-child(3) {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 899.98px) {
      .app {
        flex-direction: column;
        flex-wrap: nowrap;
        padding-left: max(8px, env(safe-area-inset-left, 0px));
        padding-right: max(8px, env(safe-area-inset-right, 0px));
        padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
        padding-top: max(8px, env(safe-area-inset-top, 0px));
        gap: 12px;
      }

      .viz-column {
        order: 1;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
      }

      .setup-panel {
        order: 2;
        flex: 0 0 auto;
        width: 100%;
        max-height: min(42vh, 460px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        border-radius: 18px;
        padding: 14px 16px;
      }

      .chart-wrap {
        flex: 1 1 0;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="setup-panel" aria-label="Nastavení">
      <div class="controls">
        <a href="../index.html" class="hub-back-to-sims">← Přehled simulací</a>
        <h1 class="panel-title">Graf</h1>

        <div class="row collapsible-section is-collapsed" aria-label="Typ grafu">
          <button type="button" class="section-toggle" aria-expanded="false">
            <span>Typ grafu</span>
            <span class="section-toggle-chevron" aria-hidden="true">▼</span>
          </button>
          <div class="section-body">
            <div class="chart-type-switch">
              <button type="button" id="btnChartTypeLine" class="secondary fit-curve-active" aria-pressed="true">Bodový</button>
              <button type="button" id="btnChartTypeBar" class="secondary" aria-pressed="false">Sloupcový</button>

  <script>
(function () {
  const CHART_GRID_SNAP_PX = 7;

  const chartEl = document.getElementById("chart");
  const chartWrap = document.querySelector(".chart-wrap");
  const customXName = document.getElementById("customXName");
  const customXUnit = document.getElementById("customXUnit");
  const customXStep = document.getElementById("customXStep");
  const customXDivisions = document.getElementById("customXDivisions");
  const customXAllowNegative = document.getElementById("customXAllowNegative");
  const customYName = document.getElementById("customYName");
  const customYUnit = document.getElementById("customYUnit");
  const customYStep = document.getElementById("customYStep");
  const customYDivisions = document.getElementById("customYDivisions");
  const customYAllowNegative = document.getElementById("customYAllowNegative");
  const btnSave = document.getElementById("btnSave");
  const btnFitCurve = document.getElementById("btnFitCurve");
  const fitModeRow = document.getElementById("fitModeRow");
  const btnFitModeCurve = document.getElementById("btnFitModeCurve");
  const btnFitModePolyline = document.getElementById("btnFitModePolyline");
  const btnTableInput = document.getElementById("btnTableInput");
  const btnReset = document.getElementById("btnReset");
  const btnChartTypeLine = document.getElementById("btnChartTypeLine");
  const btnChartTypeBar = document.getElementById("btnChartTypeBar");
  const btnChartTypePie = document.getElementById("btnChartTypePie");
  const lineChartControls = document.getElementById("lineChartControls");
  const pieChartControls = document.getElementById("pieChartControls");
  const barChartControls = document.getElementById("barChartControls");
  const pieUnitInput = document.getElementById("pieUnit");
  const pieShowPercentages = document.getElementById("pieShowPercentages");
  const pieSlicesList = document.getElementById("pieSlicesList");
  const btnAddPieSlice = document.getElementById("btnAddPieSlice");
  const barYName = document.getElementById("barYName");
  const barYUnit = document.getElementById("barYUnit");
  const barYStep = document.getElementById("barYStep");
  const barYDivisions = document.getElementById("barYDivisions");
  const barUseTwoValues = document.getElementById("barUseTwoValues");
  const barValueLabelsRow = document.getElementById("barValueLabelsRow");
  const barValue1LabelInput = document.getElementById("barValue1Label");
  const barValue2LabelInput = document.getElementById("barValue2Label");
  const barEntriesList = document.getElementById("barEntriesList");
  const btnAddBarEntry = document.getElementById("btnAddBarEntry");
  const lineOnlyActions = Array.from(document.querySelectorAll(".line-only-action"));
  const pointsTableSection = document.getElementById("pointsTableSection");
  const pointsTableBody = document.getElementById("pointsTableBody");
  const tableKeypadOverlay = document.getElementById("tableKeypadOverlay");
  const tableKeypadTitle = document.getElementById("tableKeypadTitle");
  const tableKeypadDisplay = document.getElementById("tableKeypadDisplay");
  const tableKeypadError = document.getElementById("tableKeypadError");
  const tableKeypadConfirm = document.getElementById("tableKeypadConfirm");
  const tableKeypadCancel = document.getElementById("tableKeypadCancel");
  const tableMathKeypad = document.getElementById("tableMathKeypad");
  const tableMathKeypadKeys = tableMathKeypad
    ? tableMathKeypad.querySelectorAll(".table-math-keypad__key")
    : [];

  const ml = 78;
  const mr = 28;
  const mt = 28;
  const mb = 44;
  const W = 648;
  const H = 340;

  /** Dynamické rozměry grafu – přizpůsobí se obrazovce a popiskům os. */
  const chartLayout = {
    W: W,
    H: H,
    ml: ml,
    mr: mr,
    mt: mt,
    mb: mb,
    pw: W - ml - mr,
    ph: H - mt - mb,
    yAxisLabelX: 16,
  };

  const MIN_PLOT_W = 140;
  const MIN_PLOT_H = 100;
  const TICK_FONT_SIZE = 11;
  const AXIS_FONT_SIZE = 14;
  const CHART_LABEL_FONT = '"Fenomen Sans", ui-sans-serif, system-ui, sans-serif';
  const MIN_CHART_W = 280;
  const MIN_CHART_H = 200;

  let measureCanvas = null;
  let layoutResizeRaf = 0;

  const GRAPH_COUNT = 3;
  const GRAPH_COLORS = ["#1e6bb8", "#c62828", "#2e7d32"];
  const PIE_COLORS = [
    "#1e6bb8",
    "#c62828",
    "#2e7d32",
    "#f9a825",
    "#6a1b9a",
    "#00838f",
    "#ef6c00",
    "#546e7a",
  ];
  const DEFAULT_TABLE_COLUMN_COUNT = 8;

  /** @type {{ points: { t: number, s: number }[], showFittedCurve: boolean, fitMode: "curve" | "polyline", tableColumnCount: number }[]} */
  const graphs = [];

  let activeGraphIndex = 0;
  let tableInputMode = false;
  let tableSyncInProgress = false;
  /** @type {"line" | "pie" | "bar"} */
  let chartType = "line";
  let pieSliceIdSeq = 1;
  let barEntryIdSeq = 1;
  /** @type {{ unit: string, showPercentages: boolean, slices: { id: number, label: string, valueRaw: string }[] }} */
  const pieState = {
    unit: "",
    showPercentages: false,
    slices: [],
  };
  /** @type {{ yName: string, yUnit: string, yStep: number, yDivisions: number, useTwoValues: boolean, value1Label: string, value2Label: string, entries: { id: number, label: string, value1Raw: string, value2Raw: string }[] }} */
  const barState = {
    yName: "",
    yUnit: "",
    yStep: 1,
    yDivisions: 8,
    useTwoValues: false,
    value1Label: "",
    value2Label: "",
    entries: [],
  };
  /** @type {HTMLInputElement | null} */
  let tableKeypadTarget = null;
  let tableKeypadDraft = "";

  const graphSelectInputs = Array.from(
    document.querySelectorAll(".graph-select-input")
  );

  function createGraphState() {
    return {
      points: [],
      showFittedCurve: false,
      fitMode: "curve",
      tableColumnCount: DEFAULT_TABLE_COLUMN_COUNT,
    };
  }

  for (let i = 0; i < GRAPH_COUNT; i++) {
    graphs.push(createGraphState());
  }

  function createPieSlice() {
    const id = pieSliceIdSeq++;
    return {
      id: id,
      label: "",
      valueRaw: "",
    };
  }

  function createBarEntry() {
    const id = barEntryIdSeq++;
    return {
      id: id,
      label: "",
      value1Raw: "",
      value2Raw: "",
    };
  }

  function pieColor(index) {
    return PIE_COLORS[index % PIE_COLORS.length];
  }

  function mixHexColor(hex, towardWhite, amount) {
    const raw = String(hex || "").replace("#", "");
    if (raw.length !== 6) return hex;
    const r = parseInt(raw.slice(0, 2), 16);
    const g = parseInt(raw.slice(2, 4), 16);
    const b = parseInt(raw.slice(4, 6), 16);
    if (![r, g, b].every(Number.isFinite)) return hex;
    const target = towardWhite ? 255 : 0;
    const mix = Math.max(0, Math.min(1, amount));
    function channel(c) {
      return Math.max(0, Math.min(255, Math.round(c + (target - c) * mix)))
        .toString(16)
        .padStart(2, "0");
    }
    return "#" + channel(r) + channel(g) + channel(b);
  }

  function barValueColors(baseColor) {
    return {
      primary: baseColor,
      secondary: mixHexColor(baseColor, true, 0.42),
    };
  }

  function isLineMode() {
    return chartType === "line";
  }

  function isPieMode() {
    return chartType === "pie";
  }

  function isBarMode() {
    return chartType === "bar";
  }

  function parsePieSliceValue(raw) {
    const n = parseDecimalCs(String(raw || "").trim());
    if (!Number.isFinite(n) || n <= 0) return null;
    return n;
  }

  function parseBarEntryValue(raw) {
    const n = parseDecimalCs(String(raw || "").trim());
    if (!Number.isFinite(n) || n < 0) return null;
    return n;
  }

  function getRenderablePieSlices() {
    const result = [];
    pieState.slices.forEach(function (slice, index) {
      const value = parsePieSliceValue(slice.valueRaw);
      if (value == null) return;
      result.push({
        id: slice.id,
        label: (slice.label || "").trim() || "Údaj " + (index + 1),
        value: value,
        color: pieColor(index),
        sourceIndex: index,
      });
    });
    return result;
  }

  function barSeriesLabel(seriesIndex) {
    const raw =
      seriesIndex === 2 ? barState.value2Label : barState.value1Label;
    return (raw || "").trim();
  }

  function getRenderableBarEntries() {
    const result = [];
    barState.entries.forEach(function (entry, index) {
      const value1 = parseBarEntryValue(entry.value1Raw);
      const value2 = barState.useTwoValues
        ? parseBarEntryValue(entry.value2Raw)
        : null;
      if (value1 == null && value2 == null) return;
      result.push({
        id: entry.id,
        label: (entry.label || "").trim() || "Údaj " + (index + 1),
        value1: value1,
        value2: value2,
        color: pieColor(index),
        sourceIndex: index,
      });
    });
    return result;
  }

  function activeGraph() {
    return graphs[activeGraphIndex];
  }

  function activePoints() {
    return activeGraph().points;
  }

  function graphColor(graphIndex) {
    return GRAPH_COLORS[graphIndex] || GRAPH_COLORS[0];
  }

  function applyChartLabelFont(textEl) {
    textEl.setAttribute("font-family", CHART_LABEL_FONT);
  }

  function hasAnyChartPoints() {
    return graphs.some(function (g) {
      return g.points.length > 0;
    });
  }

  function updateNegativeAxisCheckboxState() {
    const locked = hasAnyChartPoints();
    [customXAllowNegative, customYAllowNegative].forEach(function (input) {
      if (!input) return;
      input.disabled = locked;
      const label = input.closest(".custom-axis-check");
      if (label) {
        if (locked) {
          label.setAttribute(
            "title",
            "Záporné hodnoty lze zapnout jen před vložením prvního bodu."
          );
        } else {
          label.removeAttribute("title");
        }
      }
    });
  }

  function updateGraphSelectUI() {
    graphSelectInputs.forEach(function (input, i) {
      input.checked = i === activeGraphIndex;
    });
  }

  function updateTableGraphTheme() {
    if (!pointsTableSection) return;
    for (let i = 0; i < GRAPH_COUNT; i++) {
      pointsTableSection.classList.toggle("graph-theme-" + i, i === activeGraphIndex);
    }

  function setActiveGraph(index) {
    if (index < 0 || index >= GRAPH_COUNT || index === activeGraphIndex) return;
    endPointHold();
    activeGraphIndex = index;
    updateGraphSelectUI();
    updateTableGraphTheme();
    if (tableInputMode) {
      renderPointsTable();
    }
