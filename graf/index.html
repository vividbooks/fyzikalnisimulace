  function clientXY(ev) {
    const touch = ev.touches && ev.touches[0];
    const changed = ev.changedTouches && ev.changedTouches[0];
    if (touch) return { clientX: touch.clientX, clientY: touch.clientY };
    if (changed) return { clientX: changed.clientX, clientY: changed.clientY };
    return { clientX: ev.clientX, clientY: ev.clientY };
  }

  function chartCoordsFromEvent(ev) {
    const svg = chartEl;
    const { clientX, clientY } = clientXY(ev);
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    try {
      const ctm = svg.getScreenCTM();
      if (ctm) {
        const loc = pt.matrixTransform(ctm.inverse());
        return { x: loc.x, y: loc.y };
      }
    } catch (err) {
      /* fallback níže */
    }
    const r = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const rw = r.width || 1;
    const rh = r.height || 1;
    return {
      x: (clientX - r.left) * (vb.width / rw) + vb.x,
      y: (clientY - r.top) * (vb.height / rh) + vb.y,
    };
  }

  function hideChartClickPreview() {
    if (chartClickPreviewGroup) chartClickPreviewGroup.style.display = "none";
    if (!pointHold) hidePointCoordLabel();
  }

  function updateChartClickPreviewFromEvent(ev) {
    if (isPieMode() || isBarMode() || tableInputMode || pointHold) {
      hideChartClickPreview();
      return;
    }
    const marker = markerFromEventTarget(ev.target);
    if (marker) return;
    const { x, y } = chartCoordsFromEvent(ev);
    const inPlot =
      x >= chartLayout.ml &&
      x <= chartLayout.ml + chartLayout.pw &&
      y >= chartLayout.mt &&
      y <= chartLayout.mt + chartLayout.ph;
    if (!inPlot) {
      hideChartClickPreview();
      return;
    }
    if (!chartClickPreviewGroup) return;

    const snapped = snapChartXYToGrid(x, y);
    const t = xToT(snapped.x);
    const val = yToS(snapped.y);

    if (wouldRejectNewPoint(activePoints(), t, val)) {
      hideChartClickPreview();
      return;
    }

    const fin = finalCoordsAfterHypotheticalAdd(activePoints(), t, val);
    const cx = tToX(fin.t);
    const cy = sToY(fin.s);
    setCrossMarkerPosition(chartClickPreviewGroup, cx, cy);
    chartClickPreviewGroup.style.display = "";
    updatePointCoordLabel(fin.t, fin.s, cx, cy);
  }

  function isPlotPointerEvent(ev) {
    const { x, y } = chartCoordsFromEvent(ev);
    return (
      x >= chartLayout.ml &&
      x <= chartLayout.ml + chartLayout.pw &&
      y >= chartLayout.mt &&
      y <= chartLayout.mt + chartLayout.ph
    );
  }

  function handleChartPointerDown(ev) {
    if (!isLineMode()) return;
    if (ev.pointerType === "mouse" && ev.button !== 0) return;

    const marker = markerFromEventTarget(ev.target);
    let existing = null;
    if (marker) {
      const idx = parseInt(marker.getAttribute("data-index"), 10);
      const graphIdx = parseInt(marker.getAttribute("data-graph-index"), 10);
      if (
        graphIdx === activeGraphIndex &&
        idx === idx &&
        idx >= 0 &&
        activePoints()[idx]
      ) {
        const p = activePoints()[idx];
        existing = {
          mode: "existing",
          index: idx,
          graphIndex: graphIdx,
          t: p.t,
          s: p.s,
        };
      }
    }
    if (!existing && (ev.pointerType === "touch" || ev.pointerType === "pen")) {
      const near = findNearestActivePointFromEvent(ev, MARKER_TOUCH_PICK_PX);
      if (near) {
        existing = {
          mode: "existing",
          index: near.index,
          graphIndex: near.graphIndex,
          t: near.t,
          s: near.s,
        };
      }
    }

    if (existing) {
      ev.preventDefault();
      if (typeof ev.stopPropagation === "function") ev.stopPropagation();
      endPointHold();
      startPointHold(existing, ev);
      return;
    }

    if (!isPlotPointerEvent(ev) || tableInputMode) return;
    ev.preventDefault();

    const coords = plotCoordsFromEvent(ev, { clampToPlot: true });
    if (!coords || wouldRejectNewPoint(activePoints(), coords.t, coords.s)) return;

    startPointHold(
      {
        mode: "new",
        graphIndex: activeGraphIndex,
        t: coords.t,
        s: coords.s,
      },
      ev
    );
  }

  function markerFromEventTarget(target) {
    let el = target;
    while (el && el !== chartEl) {
      if (
        el.getAttribute &&
        el.getAttribute("class") &&
        el.getAttribute("class").indexOf("chart-cross-marker") >= 0 &&
        el.getAttribute("data-index") != null &&
        el.getAttribute("data-graph-index") != null
      ) {
        const graphIdx = parseInt(el.getAttribute("data-graph-index"), 10);
        if (graphIdx === activeGraphIndex) {
          return el;
        }
        return null;
      }
      el = el.parentNode;
    }
    return null;
  }

  chartEl.addEventListener("dblclick", function (ev) {

    const idx = parseInt(raw, 10);
    if (idx !== idx || idx < 0) return;
    activePoints().splice(idx, 1);
    redrawChart();
    ev.preventDefault();

      if (input.checked) {
        setActiveGraph(i);
      } else if (i === activeGraphIndex) {
        input.checked = true;
      }
    });
  });

  if (pointsTableSection) {
    pointsTableSection.addEventListener("pointerdown", function (ev) {
      openNumericKeypadFromEvent(ev);
    });
  }

  const setupPanel = document.querySelector(".setup-panel");
  if (setupPanel) {
    setupPanel.addEventListener("pointerdown", function (ev) {
      openNumericKeypadFromEvent(ev);
    });
  }

  [
    customXStep,
    customYStep,
    customXDivisions,
    customYDivisions,
    barYStep,
    barYDivisions,
  ].forEach(function (input) {
    bindNumericKeypadInput(input);
    if (!input) return;
    const label = input.closest("label.custom-field");
    if (label && !input.getAttribute("aria-label")) {
      const title = label.childNodes[0] && label.childNodes[0].textContent
        ? String(label.childNodes[0].textContent).trim()
        : "";
      if (title) input.setAttribute("aria-label", title);
    }
  });

  if (tableKeypadConfirm) {
    tableKeypadConfirm.addEventListener("click", confirmTableKeypad);
  }

  if (tableKeypadCancel) {
    tableKeypadCancel.addEventListener("click", cancelTableKeypad);
  }

  tableMathKeypadKeys.forEach(function (key) {
    key.addEventListener("mousedown", function (ev) {
      ev.preventDefault();
    });
    key.addEventListener("click", handleTableMathKeypadClick);
  });

  chartEl.addEventListener("pointerdown", handleChartPointerDown);
  chartEl.addEventListener("mousemove", updateChartClickPreviewFromEvent);
  chartEl.addEventListener("mouseleave", hideChartClickPreview);
  chartEl.addEventListener("touchmove", updateChartClickPreviewFromEvent, {
    passive: true,
  });
  chartEl.addEventListener(
    "touchstart",
    function (ev) {
      if (!isLineMode()) return;
      if (ev.cancelable) ev.preventDefault();
    },
    { passive: false }
  );

  if (chartWrap && typeof ResizeObserver !== "undefined") {
    const chartResizeObserver = new ResizeObserver(function () {
      scheduleLayoutAndRedraw();
    });
    chartResizeObserver.observe(chartWrap);
  } else {
    window.addEventListener("resize", scheduleLayoutAndRedraw);
  }

  updateTableModeUI();
  updateGraphSelectUI();
  updateTableGraphTheme();
  updateNegativeAxisCheckboxState();
  updateChartTypeUI();
  syncCustomAxisFromInputs();

  document.querySelectorAll(".section-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const section = btn.closest(".collapsible-section");
      if (!section) return;
      const collapsed = section.classList.toggle("is-collapsed");
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    });
  });

  redrawChart();
})();
  </script>
</body>
</html>
