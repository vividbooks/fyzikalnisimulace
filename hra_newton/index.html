  function drawEditorRunDisabledTooltip(clientX, clientY) {
    const label = 'musíš vložit ufo';
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const fontSize = 22;
    const padX = 16;
    const padY = 12;
    const x = (clientX - rect.left) * dpr + 18;
    const y = (clientY - rect.top) * dpr + 18;

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    setUiFont(700, fontSize);
    const textW = ctx.measureText(label).width;
    const boxW = textW + padX * 2;
    const boxH = fontSize + padY * 2;
    fillRoundedRect(x, y, boxW, boxH, 12, 'rgba(255, 255, 255, 0.96)');
    strokeRoundedRect(x, y, boxW, boxH, 12, UI.border, 1.5);
    ctx.fillStyle = UI.text;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + padX, y + boxH / 2 + 0.5);
    ctx.restore();
  }

  function drawPaletteItem(tool, selected) {
    if (tool === 'wall') {
      const w = PALETTE.wall;
      drawSpaceBlock(w.x, w.y, w.w, w.h);
    } else if (tool === 'coin') {
      drawCoin(PALETTE.coin.cx, PALETTE.coin.cy);
    } else if (tool === 'line') {
      const l = PALETTE.line;
      const midY = l.y + l.h / 2;
      ctx.strokeStyle = WALL_FILL;
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(l.x, midY);
      ctx.lineTo(l.x + l.w, midY);
      ctx.stroke();
      ctx.strokeStyle = WALL_STROKE;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(l.x, midY);
      ctx.lineTo(l.x + l.w, midY);
      ctx.stroke();
    } else if (tool === 'circle') {
      const { cx, cy } = PALETTE.circle;
      drawUfoAt(cx, cy);
    }
    if (selected) {
      let bx, by, bw, bh;
      if (tool === 'wall') {
        bx = PALETTE.wall.x - 6;
        by = PALETTE.wall.y - 6;
        bw = PALETTE.wall.w + 12;
        bh = PALETTE.wall.h + 12;
      } else if (tool === 'coin') {
        bx = PALETTE.coin.cx - PALETTE.coin.r - 10;
        by = PALETTE.coin.cy - PALETTE.coin.r - 10;
        bw = (PALETTE.coin.r + 10) * 2;
        bh = bw;
      } else {
        const pad = ufoHitRadius() + 6;
        bx = PALETTE.circle.cx - pad;
        by = PALETTE.circle.cy - pad;
        bw = pad * 2;
        bh = pad * 2;
      }
      ctx.strokeStyle = UI.accent;
      ctx.lineWidth = 3;
      strokeRoundedRect(bx, by, bw, bh, 12, UI.accent, 3);
    }
  }

  function drawEditorPanel() {
    ctx.fillStyle = UI.text;
    setUiFont(700, 22);
    ctx.textAlign = 'left';
    ctx.fillText('Editor', 12, 42);

    drawPaletteItem('wall', editorTool === 'wall');
    drawPaletteItem('coin', editorTool === 'coin');
    drawPaletteItem('line', editorTool === 'line');
    drawPaletteItem('circle', editorTool === 'circle');

    drawEditorFrameButton();
    drawEditorRunButton();
    drawEditorBackButton();
  }

  function drawEditorPerimeterHints() {
    if (editorTool !== 'line') return;
    const { cols, rows } = editorGridLayout();
    ctx.save();
    ctx.strokeStyle = 'rgba(50, 244, 171, 0.35)';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    const addSide = (side, n) => {
      for (let i = 0; i < n; i++) {
        const { x1, y1, x2, y2 } = editorSegmentCoords({ side, index: i });
        const key = lineKey({ side, index: i });
        if (editorLines.some(s => lineKey(s) === key)) continue;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    };
    addSide('top', cols);
    addSide('bottom', cols);
    addSide('left', rows);
    addSide('right', rows);
    ctx.restore();
  }

  function drawEditorObjects() {
    drawEditorPerimeterHints();
    for (const seg of editorLines) drawEditorBorderLine(seg);
    for (const [wx, wy] of editorWalls) {
      drawSpaceBlock(wx, wy, EDITOR_CELL, EDITOR_CELL);
    }
    for (const coin of editorCoins) drawCoin(coin.x, coin.y);
    if (editorPlayer) {
      drawUfoAt(editorPlayer.x, editorPlayer.y);
    }
  }

  function flameShape(baseX, baseY, dirX, dirY, len, spread, wobble) {
    const perpX = -dirY;
    const perpY = dirX;
    const tipX = baseX + dirX * len;
    const tipY = baseY + dirY * len;
    const midX = baseX + dirX * len * 0.55;
    const midY = baseY + dirY * len * 0.55;
    ctx.beginPath();
    ctx.moveTo(baseX + perpX * spread * 0.45, baseY + perpY * spread * 0.45);
    ctx.quadraticCurveTo(
      midX + perpX * (spread + wobble), midY + perpY * (spread + wobble),
      tipX, tipY
    );
    ctx.quadraticCurveTo(
      midX - perpX * (spread + wobble), midY - perpY * (spread + wobble),
      baseX - perpX * spread * 0.45, baseY - perpY * spread * 0.45
    );
    ctx.closePath();
  }

  function drawFlame(baseX, baseY, dirX, dirY, seed) {
    const t = flameTime;
    const flicker = 0.92 + 0.08 * Math.sin(t * 0.02 + seed);
    const len = 38 * flicker;
    const spread = 10;
    const wobble = 0;

    ctx.save();
    ctx.shadowColor = 'rgba(249, 115, 22, 0.28)';
    ctx.shadowBlur = 6;

    flameShape(baseX, baseY, dirX, dirY, len, spread, wobble);
    ctx.fillStyle = '#e63a00';
    ctx.fill();

    flameShape(baseX, baseY, dirX, dirY, len * 0.78, spread * 0.72, wobble * 0.7);
    ctx.fillStyle = '#ff8c00';
    ctx.fill();

    flameShape(baseX, baseY, dirX, dirY, len * 0.5, spread * 0.42, wobble * 0.4);
    ctx.fillStyle = '#ffd54a';
    ctx.fill();

    flameShape(baseX, baseY, dirX, dirY, len * 0.28, spread * 0.22, 0);
    ctx.fillStyle = '#fffde7';
    ctx.fill();

    ctx.restore();
  }

  function drawMotorNozzle(x, y, dirX, dirY, active) {
    const perpX = -dirY;
    const perpY = dirX;
    const nx = x + dirX * PLAYER_R;
    const ny = y + dirY * PLAYER_R;
    ctx.fillStyle = playerColorDark(active);
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(nx + dirX * 4, ny + dirY * 4);
    ctx.lineTo(nx + perpX * 5, ny + perpY * 5);
    ctx.lineTo(nx - dirX * 2, ny - dirY * 2);
    ctx.lineTo(nx - perpX * 5, ny - perpY * 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawMotorNozzleLocal(hx, hy, dirX, dirY, active) {
    const perpX = -dirY;
    const perpY = dirX;
    ctx.fillStyle = playerColorDark(active);
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(hx + dirX * 7, hy + dirY * 7);
    ctx.lineTo(hx + perpX * 6, hy + perpY * 6);
    ctx.lineTo(hx - dirX * 3, hy - dirY * 3);
    ctx.lineTo(hx - perpX * 6, hy - perpY * 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawExplosion() {
    if (!explosion) return;
    const { x, y, particles, time } = explosion;
    const sx = worldToScreenX(x);
    const flash = Math.max(0, 1 - time / 0.12);
    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 240, 180, ${flash * 0.75})`;
      ctx.beginPath();
      ctx.arc(sx, y, PLAYER_R + 20 + flash * 40, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const p of particles) {
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.ring) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(sx, y, p.size, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(worldToScreenX(p.x), p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawRocketBody() {
    ctx.beginPath();
    ctx.moveTo(0, -PLAYER_R - 6);
    ctx.lineTo(PLAYER_R * 0.7, PLAYER_R * 0.62);
    ctx.lineTo(0, PLAYER_R * 0.36);
    ctx.lineTo(-PLAYER_R * 0.7, PLAYER_R * 0.62);
    ctx.closePath();
    ctx.fillStyle = PLAYER_COLOR;
    ctx.fill();
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#9ee7ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -PLAYER_R * 0.2, PLAYER_R * 0.24, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#111827';
    ctx.beginPath();
    ctx.roundRect(-PLAYER_R * 0.42, PLAYER_R * 0.38, PLAYER_R * 0.84, 7, 4);
    ctx.fill();
  }

  function drawUfoBody() {
    const outerR = PLAYER_R * 1.05;

    ctx.beginPath();
    ctx.arc(0, 0, outerR, 0, Math.PI * 2);
    ctx.fillStyle = playerColor();
    ctx.fill();
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, outerR * 0.76, 0, Math.PI * 2);
    ctx.strokeStyle = playerColorDark(false);
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_R * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = '#9ee7ff';
    ctx.fill();
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawUfoAt(x, y) {
    const nozzleDist = PLAYER_R * 0.92;
    const motorDefs = [
      { dirX: 0, dirY: -1 },
      { dirX: 0, dirY: 1 },
      { dirX: -1, dirY: 0 },
      { dirX: 1, dirY: 0 }
    ];
    ctx.save();
    ctx.translate(x, y);
    drawUfoBody();
    for (const m of motorDefs) {
      drawMotorNozzleLocal(m.dirX * nozzleDist, m.dirY * nozzleDist, m.dirX, m.dirY, false);
    }
    ctx.restore();
  }

  function ufoHitRadius() {
    return PLAYER_R * 1.05 + 4;
  }

  function drawPlayer() {
    if (gameState !== 'playing') return;
    const x = isZavod() ? raceScreenX() : player.x;
    const y = player.y;
    const motorDefs = [
      { key: 'up',    dirX: 0, dirY: -1 },
      { key: 'down',  dirX: 0, dirY: 1 },
      { key: 'left',  dirX: -1, dirY: 0 },
      { key: 'right', dirX: 1, dirY: 0 }
    ];
    const nozzleDist = isBludiste() ? PLAYER_R * 0.92 : PLAYER_R * 0.78;
    const flameDist = PLAYER_R + 5;

    const angle = shipAngle();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.shadowColor = 'rgba(124, 58, 237, 0.22)';
    ctx.shadowBlur = 6;
    if (isBludiste()) drawUfoBody();
    else drawRocketBody();
    ctx.shadowBlur = 0;

    if (isBludiste()) {
      for (const m of motorDefs) {
        const hx = m.dirX * nozzleDist;
        const hy = m.dirY * nozzleDist;
        drawMotorNozzleLocal(hx, hy, m.dirX, m.dirY, motors[m.key]);
      }
      let seed = 0;
      for (const m of motorDefs) {
        if (!motors[m.key]) continue;
        drawFlame(m.dirX * flameDist, m.dirY * flameDist, m.dirX, m.dirY, seed);
        seed += 2.1;
      }
    }

    ctx.restore();

    if (isZavod()) {
      let seed = 0;
      for (const m of motorDefs) {
        if (!motors[m.key]) continue;
        const nx = x + m.dirX * (PLAYER_R + 3);
        const ny = y + m.dirY * (PLAYER_R + 3);
        drawFlame(nx, ny, m.dirX, m.dirY, seed);
        seed += 2.1;
      }
    }
  }

  function draw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#070b1c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const offsetX = viewOffsetX;
    const offsetY = viewOffsetY;
    ctx.setTransform(viewScale, 0, 0, viewScale, offsetX - PLAY.x * viewScale, offsetY - PLAY.y * viewScale);
    if (appMode === 'editing') {
      const { w: gridW, h: gridH, ox, oy } = editorGridLayout();
      drawPlaySurface(ox, oy, gridW, gridH);
    } else {
      drawPlaySurface(PLAY.x, PLAY.y, PLAY.w, playH());
    }

    if (appMode === 'editing') {
      drawEditorGrid();
      drawEditorObjects();
      ctx.save();
      const { dx, dy } = editorUiShift();
      ctx.translate(dx, dy);
      drawControlPanelShell();
      drawEditorPanel();
      ctx.restore();
      ctx.restore();
      if (
        !editorPlayer &&
        editorPointer.active &&
        isEditorRunBtn(editorPointer.x, editorPointer.y)
      ) {
        drawEditorRunDisabledTooltip(editorPointer.clientX, editorPointer.clientY);
      }
      return;
    }

    if (isZavod()) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(PLAY.x, PLAY.y, PLAY.w, playH());
      ctx.clip();
    }

    for (const [wx, wy] of walls) {
      const sx = worldToScreenX(wx);
      drawSpaceBlock(sx, wy);
    }

    for (const seg of borderLines) drawBorderLine(seg);

    for (const coin of coins) {
      if (!coin.taken) drawCoin(worldToScreenX(coin.x), coin.y);
    }

    if (isZavod()) {
      drawRaceStart();
      drawRaceGoal();
    }

    if (isZavod()) drawRaceIntro();
    drawTrail();
    drawPlayer();
    drawExplosion();

    if (isZavod()) ctx.restore();
    if (velocityVectorsVisible && gameState === 'playing') drawVelocityVectors();
    if (isZavod()) drawRaceHud();
    if (isZavod()) drawRaceAxis();
    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.05) || 0;
    lastTime = t;
    flameTime = t;
    update(dt);
    draw();
    if (t - lastUiSync > 80) {
      syncHtmlControls();
      lastUiSync = t;
    }
    requestAnimationFrame(loop);
  }

  function canvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const offsetX = viewOffsetX;
    const offsetY = viewOffsetY;
    return {
      x: PLAY.x + (((clientX - rect.left) * dpr) - offsetX) / viewScale,
      y: PLAY.y + (((clientY - rect.top) * dpr) - offsetY) / viewScale
    };
  }

  function dirAt(x, y) {
    for (const [dir, cfg] of Object.entries(CONTROLS)) {
      for (const [rx, ry, rw, rh] of cfg.rects) {
        if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) return dir;
      }
    }
    return null;
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      keys.add(e.key);
    }
  });
  window.addEventListener('keyup', e => keys.delete(e.key));

    function setDirection(dir, active) {
    if (mobilePhase !== 'playing' || appMode === 'editing') {
      pointerDir = null;
      return;
    }
      if (isZavod() && (dir === 'up' || dir === 'down')) {
        return;
      }
    if (active) pointerDir = dir;
    else if (pointerDir === dir) pointerDir = null;
  }

  function handlePointerDown(p) {
    if (appMode === 'editing') {
      if (isEditorFrameBtn(p.x, p.y)) {
        toggleEditorFrame();
        return;
      }
      if (isEditorRunBtn(p.x, p.y)) {
        if (editorPlayer) runEditorLevel();
        return;
      }
      if (isEditorBackBtn(p.x, p.y)) {
        returnToMenu();
        return;
      }
      const tool = paletteToolAt(p.x, p.y);
      if (tool) {
        editorTool = tool;
        return;
      }
      if (!isEditorPanelUi(p.x, p.y)) handleEditorPlace(p.x, p.y);
      return;
    }

    if (isZavod()) {
      const { backBox, vectorsBox } = raceHudLayout();
      if (p.x >= backBox.x && p.x <= backBox.x + backBox.w && p.y >= backBox.y && p.y <= backBox.y + backBox.h) {
        returnToMenu();
        return;
      }
      if (
        p.x >= vectorsBox.x &&
        p.x <= vectorsBox.x + vectorsBox.w &&
        p.y >= vectorsBox.y &&
        p.y <= vectorsBox.y + vectorsBox.h
      ) {
        velocityVectorsVisible = !velocityVectorsVisible;
        syncHtmlControls();
        return;
      }
    }

    pointerDir = dirAt(p.x, p.y);
  }

  function handlePointerMove(p) {
    if (appMode === 'editing') return;
    pointerDir = dirAt(p.x, p.y);
  }

  function handlePointerUp() {
    draggingMass = false;
    pointerDir = null;
  }

  canvas.addEventListener('mousedown', e => handlePointerDown(canvasPos(e)));
  window.addEventListener('mouseup', handlePointerUp);
  canvas.addEventListener('mouseleave', () => {
    editorPointer.active = false;
    if (!draggingMass) pointerDir = null;
  });
  canvas.addEventListener('mousemove', e => {
    const p = canvasPos(e);
    if (appMode === 'editing') {
      editorPointer = { x: p.x, y: p.y, clientX: e.clientX, clientY: e.clientY, active: true };
    }
  });
  window.addEventListener('mousemove', e => {
    if (isBludiste() && draggingMass && settingsEditable) setMassFromX(canvasPos(e).x);
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handlePointerDown(canvasPos(e));
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    handlePointerMove(canvasPos(e));
  }, { passive: false });
  canvas.addEventListener('touchend', handlePointerUp);

  uiEls.modeBludiste.addEventListener('click', () => setPlayMode('bludiste'));
  uiEls.modeZavod.addEventListener('click', () => setPlayMode('zavod'));
  uiEls.scenario1.addEventListener('click', () => setBludisteScenario(1));
  uiEls.scenario2.addEventListener('click', () => setBludisteScenario(2));
  uiEls.scenario3.addEventListener('click', () => setBludisteScenario(3));
  uiEls.scenario4.addEventListener('click', () => setBludisteScenario(4));
  uiEls.raceObstacles.addEventListener('click', () => {
    if (!isZavod()) return;
    raceObstaclesEnabled = !raceObstaclesEnabled;
    applyZavodWalls();
    syncHtmlControls();
  });
  uiEls.frictionBtn.addEventListener('click', () => {
    if (!isBludiste() || !settingsEditable) return;
    frictionEnabled = !frictionEnabled;
    syncHtmlControls();
  });
  uiEls.vectorsBtn.addEventListener('click', () => {
    velocityVectorsVisible = !velocityVectorsVisible;
    syncHtmlControls();
  });
  uiEls.massRange.addEventListener('input', () => {
    if (!isBludiste() || !settingsEditable) return;
    playerMass = Number(uiEls.massRange.value);
    syncHtmlControls();
  });
  uiEls.newGameHtml.addEventListener('click', startMobileCountdown);
  document.querySelector('.html-controls').addEventListener('click', e => {
    const btn = e.target instanceof Element ? e.target.closest('button') : null;
    if (!(btn instanceof HTMLButtonElement)) return;
    if (btn.id === 'modeBludiste') setPlayMode('bludiste');
    if (btn.id === 'modeZavod') setPlayMode('zavod');
    if (btn.id === 'scenario1') setBludisteScenario(1);
    if (btn.id === 'scenario2') setBludisteScenario(2);
    if (btn.id === 'scenario3') setBludisteScenario(3);
    if (btn.id === 'scenario4') setBludisteScenario(4);
    syncHtmlControls();
  });
  document.querySelectorAll('.dpad button[data-dir]').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('mousedown', () => setDirection(dir, true));
    btn.addEventListener('mouseup', () => setDirection(dir, false));
    btn.addEventListener('mouseleave', () => setDirection(dir, false));
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      setDirection(dir, true);
    }, { passive: false });
    btn.addEventListener('touchend', () => setDirection(dir, false));
    btn.addEventListener('touchcancel', () => setDirection(dir, false));
  });

  document.getElementById('restartBtn').addEventListener('click', resetGame);
  document.getElementById('menuReturnBtn').addEventListener('click', returnToMenu);
  uiEls.gameBackBtn.addEventListener('click', returnToMenu);
  document.getElementById('raceNicknameSubmit').addEventListener('click', submitRaceNickname);
  document.getElementById('raceNickname').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitRaceNickname();
  });
  window.addEventListener('resize', () => {
    resizeGameCanvas();
  });

  resizeGameCanvas();
  setMobilePhase('setup');
  setupBludisteLevel();
  player.vx = 0;
  player.vy = 0;
  resetGame();
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
