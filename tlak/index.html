<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Tlak</title>
  <link rel="stylesheet" href="style.css?v=fedits-hint1" />
</head>
<body>
  <main class="scene" aria-label="Simulace tlaku">
    <aside class="setup-panel" aria-label="Ovládání simulace">
      <div class="panel-copy">
        <a href="../index.html" class="hub-back-to-sims">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zpět
        </a>
        <h1 class="panel-title">Tlak</h1>
      </div>

      <section class="panel-section" aria-label="Režim simulace">
        <div class="mode-switch" role="tablist" aria-label="Režim simulace">
          <button
            type="button"
            class="mode-switch__btn is-active"
            id="labModeBtn"
            role="tab"
            aria-selected="true"
            aria-pressed="true"
            data-mode="lab"
          >
            Laboratoř
          </button>
          <button
            type="button"
            class="mode-switch__btn"
            id="pressureCalcToggleBtn"
            role="tab"
            aria-selected="false"
            aria-pressed="false"
            data-mode="pressure"
          >
            Výpočet tlaku
          </button>
          <button
            type="button"
            class="mode-switch__btn"
            id="weightCalcToggleBtn"
            role="tab"
            aria-selected="false"
            aria-pressed="false"
            data-mode="weight"
          >
            Výpočet tíhy
          </button>
          <button
            type="button"
            class="mode-switch__btn"
            id="areaCalcToggleBtn"
            role="tab"
            aria-selected="false"
            aria-pressed="false"
            data-mode="area"
          >
            Výpočet plochy
          </button>
        </div>
      </section>

      <div class="stats-panel" aria-live="polite">
        <p class="stats-panel__item stats-panel__item--weight" id="weightStatItem">
          <span class="panel-label">Tíha</span>
          <span class="stats-panel__weight-display" id="totalWeightDisplay">
            Celková tíha tělesa =
            <span class="stats-panel__value" id="totalWeightValue">0</span>
            N
          </span>
          <span class="stats-panel__calc" id="weightCalc" hidden>
            <span class="stats-panel__calc-row">
              Celková tíha tělesa =
              <span class="stats-panel__field">
                <input
                  type="text"
                  class="stats-panel__input"
                  id="weightInput"
                  inputmode="none"
                  readonly
                  autocomplete="off"
                  enterkeyhint="done"
                  aria-label="Vypočtená tíha"
                />
              </span>
              N
            </span>
            <span class="stats-panel__feedback" id="weightFeedback" hidden></span>
          </span>
        </p>
        <p class="stats-panel__item stats-panel__item--area" id="areaStatItem">
          <span class="panel-label">Plocha</span>
          <span class="stats-panel__area-display" id="areaDisplay">
            Celková plocha =
            <span class="stats-panel__value" id="totalAreaValue">0</span>
            m²
          </span>
          <span class="stats-panel__calc" id="areaCalc" hidden>
            <span class="stats-panel__calc-row">
              Celková plocha =
              <span class="stats-panel__field">
                <input
                  type="text"
                  class="stats-panel__input"
                  id="areaInput"
                  inputmode="none"
                  readonly
                  autocomplete="off"
                  enterkeyhint="done"
                  aria-label="Vypočtená plocha"
                />
              </span>
              m²
            </span>
            <span class="stats-panel__feedback" id="areaFeedback" hidden></span>
          </span>
        </p>
        <p class="stats-panel__item stats-panel__item--pressure" id="pressureStatItem">
          <span class="panel-label">Tlak</span>
          <span class="stats-panel__pressure-display" id="pressureDisplay">
            Tlak =
            <span class="stats-panel__value" id="totalPressureValue">0</span>
            N na m²
          </span>
          <span class="stats-panel__calc" id="pressureCalc" hidden>
            <span class="stats-panel__calc-row">
              Tlak =
              <span class="stats-panel__field">
                <input
                  type="text"
                  class="stats-panel__input"
                  id="pressureInput"
                  inputmode="none"
                  readonly
                  autocomplete="off"
                  enterkeyhint="done"
                  aria-label="Vypočtený tlak"
                />
              </span>
              N na m²
            </span>
            <span class="stats-panel__feedback" id="pressureFeedback" hidden></span>
          </span>
        </p>
      </div>
    </aside>

    <div class="scene-workspace">
      <p class="sim-empty-hint" id="hintEl">Chytni krychli a přesuň ji nebo změň její velikost.</p>
      <div class="stage" id="stage">
        <div class="floor" id="floor" aria-label="Podlaha s 5 čtverci"></div>
        <div class="cube-layer" id="cubeLayer" aria-label="Krychle na ploše"></div>
        <div class="floor floor--front" id="floorFront" aria-hidden="true"></div>
        <div class="weight-label-layer" id="weightLabelLayer" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <div id="tableKeypadOverlay" class="table-keypad-overlay" hidden>
    <div class="table-keypad-panel" role="dialog" aria-modal="true" aria-labelledby="tableKeypadTitle">
      <p id="tableKeypadTitle" class="table-keypad-panel__title">Hodnota</p>
      <div id="tableKeypadDisplay" class="table-keypad-panel__display" aria-live="polite"></div>
      <p id="tableKeypadError" class="table-keypad-panel__error" hidden></p>
      <div class="table-math-keypad" id="tableMathKeypad" aria-label="Matematická klávesnice">
        <div class="table-math-keypad__grid">
          <button class="table-math-keypad__key" type="button" data-value="7">7</button>
          <button class="table-math-keypad__key" type="button" data-value="8">8</button>
          <button class="table-math-keypad__key" type="button" data-value="9">9</button>
          <button class="table-math-keypad__key" type="button" data-value="4">4</button>
          <button class="table-math-keypad__key" type="button" data-value="5">5</button>
          <button class="table-math-keypad__key" type="button" data-value="6">6</button>
          <button class="table-math-keypad__key" type="button" data-value="1">1</button>
          <button class="table-math-keypad__key" type="button" data-value="2">2</button>
          <button class="table-math-keypad__key" type="button" data-value="3">3</button>
          <button class="table-math-keypad__key" type="button" data-value=",">,</button>
          <button class="table-math-keypad__key" type="button" data-value="0">0</button>
          <button class="table-math-keypad__key" type="button" data-action="clear" aria-label="Smazat vše">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="table-keypad-panel__actions">
        <button type="button" id="tableKeypadCancel" class="table-keypad-panel__action table-keypad-panel__cancel" aria-label="Zavřít bez uložení">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6l12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button type="button" id="tableKeypadConfirm" class="table-keypad-panel__action table-keypad-panel__confirm" aria-label="Potvrdit hodnotu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M5 12.5l5 5L19 7"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="main.js?v=fedits-hint1"></script>
</body>
</html>
